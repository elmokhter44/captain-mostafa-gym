name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - mobile/BUILD_TRIGGER.txt

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REALM_DISABLE_ANALYTICS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK and NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Create React Native 0.80 Android project
        shell: bash
        run: |
          npx --yes @react-native-community/cli@latest init CaptainMostafaGymMobile --version 0.80.0 --skip-install
          cd CaptainMostafaGymMobile
          npm install --no-audit --no-fund realm@20.2.0 react-native-webview react-native-fs @react-native-documents/picker crypto-js@4.2.0 buffer@6.0.3

      - name: Prepare identical gym UI and Realm services
        shell: bash
        run: |
          node mobile/prepare-mobile.js "$GITHUB_WORKSPACE/CaptainMostafaGymMobile"
          node --check CaptainMostafaGymMobile/shared/db-mobile.js
          node --check CaptainMostafaGymMobile/shared/excel-mobile.js
          node --check CaptainMostafaGymMobile/auth-mobile.js
          node --check CaptainMostafaGymMobile/restore-mobile.js
          node --check CaptainMostafaGymMobile/android/app/src/main/assets/gym/bridge.js
          grep -q "GymCryptoPackage()" CaptainMostafaGymMobile/android/app/src/main/java/com/captainmostafagymmobile/MainApplication.kt
          grep -q "class GymCryptoModule" CaptainMostafaGymMobile/android/app/src/main/java/com/captainmostafagymmobile/GymCryptoModule.kt
          grep -q "loginUsername" CaptainMostafaGymMobile/App.js
          grep -q "loginButton" CaptainMostafaGymMobile/App.js
          grep -q "mainWebView" CaptainMostafaGymMobile/App.js
          grep -q "versionCode 3" CaptainMostafaGymMobile/android/app/build.gradle
          grep -q 'versionName "1.0.2"' CaptainMostafaGymMobile/android/app/build.gradle
          grep -q "bridge.js" CaptainMostafaGymMobile/android/app/src/main/assets/gym/index.html
          grep -q "mobile-preload.js" CaptainMostafaGymMobile/android/app/src/main/assets/gym/index.html
          node - <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('CaptainMostafaGymMobile/android/app/src/main/assets/gym/index.html','utf8');
          const b=h.indexOf('bridge.js'),p=h.indexOf('mobile-preload.js'),r=h.indexOf('renderer.js');
          if(!(b>=0&&p>b&&r>p))throw new Error('Mobile bridge/preload/renderer script order is invalid');
          console.log('Deterministic WebView bridge script order passed.');
          NODE
          grep -q "استعادة نسخة احتياطية" CaptainMostafaGymMobile/android/app/src/main/assets/gym/mobile-preload.js

      - name: Verify PBKDF2 target remains desktop-compatible
        shell: bash
        run: |
          cd CaptainMostafaGymMobile
          node - <<'NODE'
          const crypto=require('crypto');const C=require('crypto-js');
          const password='Admin',salt='00112233445566778899aabbccddeeff0011223344556677';
          const a=crypto.pbkdf2Sync(password,Buffer.from(salt,'hex'),160000,32,'sha256').toString('hex');
          const b=C.PBKDF2(password,C.enc.Hex.parse(salt),{keySize:8,iterations:160000,hasher:C.algo.SHA256}).toString(C.enc.Hex);
          if(a!==b)throw new Error('PBKDF2 compatibility vector failed');
          console.log('Desktop PBKDF2 compatibility vector passed.');
          NODE

      - name: Run portable business logic and Excel tests
        shell: bash
        run: node --test tests/logic.test.js tests/excel-export.test.js

      - name: Generate native dependency Codegen
        shell: bash
        run: |
          cd CaptainMostafaGymMobile/android
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon --stacktrace
          test -d ../node_modules/react-native-webview/android/build/generated/source/codegen/jni
          test -d ../node_modules/@react-native-documents/picker/android/build/generated/source/codegen/jni

      - name: Build standalone signed release APK
        shell: bash
        run: |
          cd CaptainMostafaGymMobile/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify standalone release APK
        shell: bash
        run: |
          APK="CaptainMostafaGymMobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          unzip -l "$APK" | grep -q "assets/gym/index.html"
          unzip -l "$APK" | grep -q "assets/gym/bridge.js"
          unzip -l "$APK" | grep -q "assets/gym/renderer.js"
          unzip -l "$APK" | grep -q "assets/gym/responsive.css"
          unzip -l "$APK" | grep -q "assets/gym/mobile-preload.js"
          unzip -l "$APK" | grep -E -q "lib/.*/.*realm|lib/.*/librealm|lib/.*/libjsi"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/android-badging.txt"
          grep -q "versionCode='3'" "$GITHUB_WORKSPACE/android-badging.txt"
          grep -q "versionName='1.0.2'" "$GITHUB_WORKSPACE/android-badging.txt"

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end login and dashboard test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/test-android-login.sh CaptainMostafaGymMobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Package verified APK
        shell: bash
        run: |
          APK="CaptainMostafaGymMobile/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "$GITHUB_WORKSPACE/Captain_Mostafa_Gym_Android_v1.0.2.apk"
          sha256sum "$GITHUB_WORKSPACE/Captain_Mostafa_Gym_Android_v1.0.2.apk" | tee "$GITHUB_WORKSPACE/android-sha256.txt"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Mostafa-Gym-Android-APK-v1.0.2
          path: |
            Captain_Mostafa_Gym_Android_v1.0.2.apk
            android-badging.txt
            android-sha256.txt
          if-no-files-found: error
          retention-days: 30
