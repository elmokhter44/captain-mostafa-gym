name: Capture IbnKathir Release Redirects
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture signed release asset redirects
        shell: bash
        run: |
          set -euo pipefail
          TAG='ibnkathir-transfer-v100'
          : > qurani-ibnkathir/release-redirects.txt
          for NAME in IbnKathir-skeleton-v1.0.0.apk android-sign-tools-36.zip; do
            API_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$NAME\") | .apiUrl")"
            test -n "$API_URL"
            LOC="$(curl -fsSI -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$API_URL" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^location:[[:space:]]*/,"");print;exit}')"
            test -n "$LOC"
            printf '%s_URL=%s\n' "$(echo "$NAME" | tr 'a-z.-' 'A-Z__')" "$LOC" >> qurani-ibnkathir/release-redirects.txt
          done
          cat qurani-ibnkathir/release-redirects.txt
      - name: Persist redirects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnkathir/release-redirects.txt
          git commit -m 'ci: capture signed Ibn Kathir release redirects' || true
          git push origin HEAD:qurani-ibnkathir-v100
