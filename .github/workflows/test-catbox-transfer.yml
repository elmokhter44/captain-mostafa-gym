name: Test External Transfer
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe transfer hosts
        shell: bash
        run: |
          set -u
          printf 'ibnkathir-transfer-ok\n' > /tmp/probe.txt
          : > qurani-ibnkathir/transfer-probes-2.txt
          probe() { echo "=== $1 ===" >> qurani-ibnkathir/transfer-probes-2.txt; shift; "$@" >> qurani-ibnkathir/transfer-probes-2.txt 2>&1 || true; echo >> qurani-ibnkathir/transfer-probes-2.txt; }
          BIN="ibnkathir-$(date +%s)-$RANDOM"
          probe FILEBIN curl -sSL --max-time 30 -T /tmp/probe.txt "https://filebin.net/$BIN/probe.txt"
          probe UGUU curl -sSL --max-time 30 -F 'files[]=@/tmp/probe.txt' https://uguu.se/upload.php
          probe ZEROXZERO curl -sSL --max-time 30 -F 'file=@/tmp/probe.txt' https://0x0.st
          probe TEMPSH curl -sSL --max-time 30 -T /tmp/probe.txt https://temp.sh/probe.txt
          probe LITTERBOX curl -sSL --max-time 30 -F 'reqtype=fileupload' -F 'time=24h' -F 'fileToUpload=@/tmp/probe.txt' https://litterbox.catbox.moe/resources/internals/api.php
          probe GOFILE curl -sSL --max-time 30 -F 'file=@/tmp/probe.txt' https://upload.gofile.io/uploadfile
          cat qurani-ibnkathir/transfer-probes-2.txt
      - name: Persist results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnkathir/transfer-probes-2.txt
          git commit -m 'ci: probe alternate transfer hosts' || true
          git push origin HEAD:qurani-ibnkathir-v100
