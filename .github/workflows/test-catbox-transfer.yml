name: Publish Transfer URLs to Paste
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish fresh build URLs to paste.rs
        shell: bash
        run: |
          set -euo pipefail
          test -s qurani-ibnkathir/fresh-transfer-urls.txt
          URL="$(curl -fsS --retry 3 --data-binary @qurani-ibnkathir/fresh-transfer-urls.txt https://paste.rs/)"
          test -n "$URL"
          echo "$URL" | tee qurani-ibnkathir/paste-url.txt
      - name: Persist paste URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnkathir/paste-url.txt
          git commit -m 'ci: publish transfer URLs via paste.rs' || true
          git push origin HEAD:qurani-ibnkathir-v100
