name: Diagnose Delta Inputs
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check master artifact and fresh skeleton URL independently
        shell: bash
        run: |
          set +e
          : > qurani-ibnkathir/delta-input-diagnostics.txt
          echo '=== MASTER DOWNLOAD ===' >> qurani-ibnkathir/delta-input-diagnostics.txt
          rm -rf /tmp/master
          (time gh run download 35100431525 --repo "$GITHUB_REPOSITORY" -n QURANI-FINAL-v1.0.1-R2-1 -D /tmp/master) >> qurani-ibnkathir/delta-input-diagnostics.txt 2>&1
          echo "MASTER_EXIT=$?" >> qurani-ibnkathir/delta-input-diagnostics.txt
          find /tmp/master -maxdepth 3 -type f -printf '%p %s\n' >> qurani-ibnkathir/delta-input-diagnostics.txt 2>&1
          echo '=== SKELETON DOWNLOAD ===' >> qurani-ibnkathir/delta-input-diagnostics.txt
          URL="$(grep '^SKELETON_URL=' qurani-ibnkathir/fresh-transfer-urls.txt | cut -d= -f2-)"
          EXPECTED="$(grep '^SKELETON_SHA256=' qurani-ibnkathir/fresh-transfer-urls.txt | cut -d= -f2)"
          curl -sS -L --retry 2 --max-time 60 -w '\nHTTP=%{http_code} SIZE=%{size_download}\n' "$URL" -o /tmp/new.apk >> qurani-ibnkathir/delta-input-diagnostics.txt 2>&1
          echo "CURL_EXIT=$?" >> qurani-ibnkathir/delta-input-diagnostics.txt
          test -f /tmp/new.apk && { echo "ACTUAL_SIZE=$(stat -c%s /tmp/new.apk)"; echo "ACTUAL_SHA=$(sha256sum /tmp/new.apk | awk '{print $1}')"; echo "EXPECTED_SHA=$EXPECTED"; } >> qurani-ibnkathir/delta-input-diagnostics.txt 2>&1
          cat qurani-ibnkathir/delta-input-diagnostics.txt
          exit 0
      - name: Persist diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnkathir/delta-input-diagnostics.txt
          git commit -m 'ci: diagnose delta inputs' || true
          git push origin HEAD:qurani-ibnkathir-v100
