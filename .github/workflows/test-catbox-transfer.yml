name: Capture Fresh Android Signing Tools URL
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture fresh signed redirect
        shell: bash
        run: |
          set -euo pipefail
          TAG='ibnkathir-transfer-v100'
          NAME='android-sign-tools-36.zip'
          API_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$NAME\") | .apiUrl")"
          LOC="$(curl -fsSI -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$API_URL" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^location:[[:space:]]*/,"");print;exit}')"
          test -n "$LOC"
          printf '%s\n' "$LOC" > qurani-ibnkathir/fresh-tools-url.txt
      - name: Persist URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnkathir/fresh-tools-url.txt
          git commit -m 'ci: capture fresh signing tools URL' || true
          git push origin HEAD:qurani-ibnkathir-v100
