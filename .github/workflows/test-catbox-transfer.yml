name: Text Release Probe
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload text/plain release asset and capture redirect
        shell: bash
        run: |
          set -euo pipefail
          printf 'ibnkathir-text-probe\n' > /tmp/textprobe.txt
          RID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/ibnkathir-transfer-v100" --jq .id)"
          OLD="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[] | select(.name=="textprobe.txt") | .id' || true)"
          [ -z "$OLD" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"
          RESP="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: text/plain' --data-binary @/tmp/textprobe.txt "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=textprobe.txt")"
          AID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$RESP")"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AID"
          LOC="$(curl -fsSI -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$API" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^location:[[:space:]]*/,"");print;exit}')"
          test -n "$LOC"
          printf '%s\n' "$LOC" | tee qurani-ibnkathir/text-release-probe-url.txt
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnkathir/text-release-probe-url.txt
          git commit -m 'ci: record text release probe URL' || true
          git push origin HEAD:qurani-ibnkathir-v100
