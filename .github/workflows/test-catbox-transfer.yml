name: Wrap IbnKathir Payload Chunks
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrap persisted base64 at 1000 chars per line
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qurani-ibnkathir/payload-wrapped
          cat qurani-ibnkathir/payload-chunks/delta-[0-9][0-9] | fold -w 1000 > qurani-ibnkathir/payload-wrapped/delta.b64.txt
          cat qurani-ibnkathir/payload-chunks/tools-[0-9][0-9] | fold -w 1000 > qurani-ibnkathir/payload-wrapped/tools.b64.txt
          wc -l -c qurani-ibnkathir/payload-wrapped/*.txt
      - name: Commit wrapped payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnkathir/payload-wrapped
          git commit -m 'ci: wrap payloads for connector transfer'
          git push origin HEAD:qurani-ibnkathir-v100
