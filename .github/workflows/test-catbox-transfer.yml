name: Probe Artifact Quota
on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths: ['.github/workflows/test-catbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make tiny probe
        run: printf 'artifact-quota-probe\n' > /tmp/probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ibn-kathir-quota-probe
          retention-days: 1
          compression-level: 0
          path: /tmp/probe.txt
