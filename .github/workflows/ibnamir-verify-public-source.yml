name: IbnAmir List Drive Source Files

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-verify-public-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'gdown>=5.2,<6'
      - name: List Ibn Amir Google Drive folder without downloading files
        shell: bash
        env:
          DRIVE_FOLDER_ID: 1_3Wj7yc5gUjFHOK0G_6rUJnHh5JohMn5
        run: |
          set -euo pipefail
          python - <<'PY'
          import gdown, os, json
          folder_id=os.environ['DRIVE_FOLDER_ID']
          files=gdown.download_folder(id=folder_id, output='/tmp/ibnamir-list/', quiet=True, remaining_ok=True, skip_download=True)
          rows=[]
          for f in files:
              row={
                  'id': getattr(f,'id',None),
                  'path': getattr(f,'local_path',getattr(f,'path',None)),
                  'name': getattr(f,'name',None),
                  'url': 'https://drive.google.com/uc?id='+getattr(f,'id','') if getattr(f,'id',None) else None,
                  'type': type(f).__name__,
              }
              rows.append(row)
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          print('COUNT=',len(rows))
          PY
