name: IbnAmir Verify Public Source

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-verify-public-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download public candidate and verify exact uploaded source hash
        shell: bash
        run: |
          set -euo pipefail
          url="https://bhr-q.com/media/attachments/qran/04/Qra%27ah-ebn-Ammer.pdf"
          curl -L --fail --retry 3 --connect-timeout 20 "$url" -o /tmp/ibnamir-source.pdf
          ls -lh /tmp/ibnamir-source.pdf
          sha256sum /tmp/ibnamir-source.pdf
          test "$(sha256sum /tmp/ibnamir-source.pdf | awk '{print $1}')" = "3e33b9dd9a8601ded905df385572fa14f7aa6be36d00c0245f714851e96441be"
          test "$(stat -c %s /tmp/ibnamir-source.pdf)" = "135445406"
          pdfinfo /tmp/ibnamir-source.pdf | grep -E '^Pages:[[:space:]]+633$'
          echo EXACT_SOURCE_MATCH=YES
