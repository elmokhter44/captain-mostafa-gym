name: IbnAmir List Drive Source Files

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-verify-public-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'gdown>=5.2,<6'
      - name: List Ibn Amir Google Drive folder without downloading files
        shell: bash
        env:
          DRIVE_FOLDER_ID: 1_3Wj7yc5gUjFHOK0G_6rUJnHh5JohMn5
        run: |
          set -euo pipefail
          gdown --folder "https://drive.google.com/drive/folders/${DRIVE_FOLDER_ID}" --json > /tmp/drive-list.json
          cat /tmp/drive-list.json
