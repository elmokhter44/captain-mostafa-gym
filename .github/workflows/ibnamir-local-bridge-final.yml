name: IbnAmir Local Bridge Final

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-local-bridge-final.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free old Actions artifact storage
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          page=1
          deleted=0
          while :; do
            json="$(gh api "repos/$repo/actions/artifacts?per_page=100&page=$page")"
            count="$(printf '%s' "$json" | jq '.artifacts|length')"
            [ "$count" -eq 0 ] && break
            printf '%s' "$json" | jq -r '.artifacts[].id' | while read -r id; do
              gh api --method DELETE "repos/$repo/actions/artifacts/$id" || true
            done
            page=$((page+1))
          done
          echo 'artifact cleanup requested'
      - name: Download exact Abu Amr master APK and Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bridge
          gh release download abuamr-transfer-v100 --repo "$GITHUB_REPOSITORY" -p 'AbuAmr-skeleton-v1.0.0.apk' -D /tmp/bridge
          gh release download abuamr-transfer-v100 --repo "$GITHUB_REPOSITORY" -p 'android-apk-tools-36.zip' -D /tmp/bridge
          echo '4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181  /tmp/bridge/AbuAmr-skeleton-v1.0.0.apk' | sha256sum -c -
          echo '009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550  /tmp/bridge/android-apk-tools-36.zip' | sha256sum -c -
          ls -lh /tmp/bridge
      - uses: actions/upload-artifact@v4
        with:
          name: IBNAMIR-LOCAL-BRIDGE-FINAL
          compression-level: 0
          retention-days: 1
          overwrite: true
          path: |
            /tmp/bridge/AbuAmr-skeleton-v1.0.0.apk
            /tmp/bridge/android-apk-tools-36.zip
