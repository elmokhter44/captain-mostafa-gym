name: Capture Fresh AbuAmr Transfer URLs
on:
  push:
    branches: [qurani-abuamr-v100]
    paths: ['.github/workflows/abuamr-capture-transfer-urls.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture fresh signed redirects
        shell: bash
        run: |
          set -euo pipefail
          TAG='abuamr-transfer-v100'
          mkdir -p qurani-abuamr
          : > qurani-abuamr/fresh-transfer-urls.txt
          for NAME in AbuAmr-skeleton-v1.0.0.apk android-apk-tools-36.zip; do
            API_URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$NAME\") | .apiUrl")"
            LOC="$(curl -fsSI -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "$API_URL" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^location:[[:space:]]*/,"");print;exit}')"
            test -n "$LOC"
            printf '%s=%s\n' "$NAME" "$LOC" >> qurani-abuamr/fresh-transfer-urls.txt
          done
      - name: Persist URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-abuamr/fresh-transfer-urls.txt
          git commit -m 'ci: capture fresh Abu Amr transfer URLs' || true
          git push origin HEAD:qurani-abuamr-v100
