name: Quran v1.0.3 Inspect Current Source

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v102-inspect.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current Quran source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qurani
          mkdir -p /tmp/qurani
          cat qurani-ci/text/part-* > /tmp/qurani-src.b64
          base64 -d /tmp/qurani-src.b64 > /tmp/qurani-src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/qurani-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/qurani-src.tar.gz -C /tmp/qurani
          cat qurani-v101/overlay/part-* > /tmp/qurani-v101-overlay.b64
          base64 -d /tmp/qurani-v101-overlay.b64 > /tmp/qurani-v101-overlay.tar.gz
          echo 'cbb6b45021274412968d6f6747fa54048d1d46be31e92a6cea31b5d80a2b9d7e  /tmp/qurani-v101-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/qurani-v101-overlay.tar.gz -C /tmp/qurani
      - name: Export source fragments for index/search/navigation debugging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-v103-working
          mkdir -p qurani-v103-working
          files=(
            src/features/home/SectionCard.tsx
            src/features/home/homeModel.ts
            src/features/search/SearchScreen.tsx
            src/features/index/IndexScreen.tsx
            src/features/reader/ReaderScreen.tsx
            src/features/reader/ZoomablePdfPage.tsx
            src/services/VerseSearchService.ts
            src/services/ReaderNavigationService.ts
            src/services/HotspotService.ts
            src/services/SurahService.ts
            src/data/hotspots.ts
            src/data/indexHotspots.ts
            src/data/surahHotspots.ts
            src/data/surahs.ts
            src/data/sections.ts
            src/utils/arabic.ts
          )
          for f in "${files[@]}"; do
            if [ -f "/tmp/qurani/$f" ]; then
              cp "/tmp/qurani/$f" "qurani-v103-working/$(basename "$f")"
            fi
          done
          find /tmp/qurani/src -type f | sort > qurani-v103-working/source-files.txt
          grep -RInE 'hotspot|forSourcePage|sourcePdfPage|mushafStartPage' /tmp/qurani/src > qurani-v103-working/index-navigation-grep.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qurani-v103-working
          if ! git diff --cached --quiet; then
            git commit -m 'ci: inspect Quran v1.0.3 index hotspot implementation'
            git pull --rebase origin qurani-series-v100
            git push origin HEAD:qurani-series-v100
          fi
