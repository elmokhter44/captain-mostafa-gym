name: Quran v1.0.3 Inspect Current Source

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v102-inspect.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export decoded series builder scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qurani-v103-working
          base64 -d qurani-series/build_all_overlays.py.gz.b64 | gzip -dc > qurani-v103-working/build_all_overlays.py
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > qurani-v103-working/apply_series_common.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qurani-v103-working/build_all_overlays.py qurani-v103-working/apply_series_common.py
          if ! git diff --cached --quiet; then
            git commit -m 'ci: export Quran series builder scripts for v1.0.3'
            git pull --rebase origin qurani-series-v100
            git push origin HEAD:qurani-series-v100
          fi
