name: Quran v1.0.2 Inspect Current Source

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v102-inspect.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v1.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qurani
          cat qurani-ci/text/part-* > /tmp/qurani-src.b64
          base64 -d /tmp/qurani-src.b64 > /tmp/qurani-src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/qurani-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/qurani-src.tar.gz -C /tmp/qurani
          cat qurani-v101/overlay/part-* > /tmp/qurani-v101-overlay.b64
          base64 -d /tmp/qurani-v101-overlay.b64 > /tmp/qurani-v101-overlay.tar.gz
          echo 'cbb6b45021274412968d6f6747fa54048d1d46be31e92a6cea31b5d80a2b9d7e  /tmp/qurani-v101-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/qurani-v101-overlay.tar.gz -C /tmp/qurani
      - name: Export small source files needed for v1.0.2 patching
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qurani-v102-working
          cp /tmp/qurani/src/features/home/SectionCard.tsx qurani-v102-working/SectionCard.tsx
          cp /tmp/qurani/src/features/home/homeModel.ts qurani-v102-working/homeModel.ts
          cp /tmp/qurani/src/features/search/SearchScreen.tsx qurani-v102-working/SearchScreen.tsx
          cp /tmp/qurani/src/services/VerseSearchService.ts qurani-v102-working/VerseSearchService.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qurani-v102-working
          if ! git diff --cached --quiet; then
            git commit -m 'ci: export Quran v1.0.2 source fragments for patching'
            git pull --rebase origin qurani-series-v100
            git push origin HEAD:qurani-series-v100
          fi
