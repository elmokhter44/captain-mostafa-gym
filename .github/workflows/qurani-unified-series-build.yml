name: Qurani Unified Series APK
# rebuild after delegate import fix
# Runtime host delegate fix validation
# Dedicated host package registration fix validation

on:
  push:
    branches: [qurani-unified-series-v100]
    paths:
      - '.github/workflows/qurani-unified-series-build.yml'
      - 'qurani-unified/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  UNIFIED_TAG: qurani-unified-series-v1.0.4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Reconstruct proven v1.0.4 source base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-app /tmp/payload
          mkdir -p qurani-app /tmp/payload
          cat qurani-ci/text/part-* > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C qurani-app
          cat qurani-v101/overlay/part-* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.gz
          tar -xzf /tmp/overlay.tar.gz -C qurani-app
          cat .series-generated-v102/parts/payload.part-* > /tmp/v102.tar.gz
          tar -xzf /tmp/v102.tar.gz -C /tmp/payload
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/apply.py
          (cd qurani-app && python3 /tmp/apply.py .)
          cp qurani-v102-fixed/ReaderScreen.tsx qurani-app/src/features/reader/ReaderScreen.tsx
          cp qurani-v103-fixed/ZoomablePdfPage.tsx qurani-app/src/features/reader/ZoomablePdfPage.tsx
          cp qurani-unified/src/features/PdfPageUnified.tsx qurani-app/src/features/reader/PdfPage.tsx
          cp qurani-v103-fixed/IndexScreen.tsx qurani-app/src/features/index/IndexScreen.tsx
          cp qurani-v102-fixed/SectionCard.tsx qurani-app/src/features/home/SectionCard.tsx
          cp qurani-v104-exact-search/SearchScreen.tsx qurani-app/src/features/search/SearchScreen.tsx
          cp qurani-v104-exact-search/VerseSearchService.ts qurani-app/src/services/VerseSearchService.ts
          python3 qurani-v102-complete/apply_complete_patch.py qurani-app
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          import base64
          from PIL import Image
          b64=''.join(p.read_text() for p in sorted(Path('qurani-ci/logo').glob('part-*')))
          Path('/tmp/qurani-logo.jpg').write_bytes(base64.b64decode(b64,validate=True))
          src=Image.open('/tmp/qurani-logo.jpg').convert('RGBA')
          Path('qurani-app/assets/branding').mkdir(parents=True,exist_ok=True)
          src.save('qurani-app/assets/branding/qurani-icon.png',optimize=True)
          res=Path('qurani-app/android/app/src/main/res')
          for folder,size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              d=res/folder; d.mkdir(parents=True,exist_ok=True)
              icon=src.copy(); icon.thumbnail((size,size),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(size,size),(0,0,0,0)); canvas.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
              canvas.save(d/'ic_launcher.png',optimize=True); canvas.save(d/'ic_launcher_round.png',optimize=True)
          PY

      - name: Install dependencies and exact 6236 ayah index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd qurani-app
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @react-native-async-storage/async-storage
          cd ..
          rm -rf /tmp/reference-v104 /tmp/reference-extract-v104
          mkdir -p /tmp/reference-v104 /tmp/reference-extract-v104
          gh release download qurani-v1.0.2-nafi-final --pattern default.apk --dir /tmp/reference-v104
          mv /tmp/reference-v104/default.apk /tmp/reference-v104/reference-nafi.apk
          unzip -q /tmp/reference-v104/reference-nafi.apk assets/index.android.bundle -d /tmp/reference-extract-v104
          python3 qurani-v104-exact-search/extract_reference_verse_index.py /tmp/reference-extract-v104/assets/index.android.bundle --json-out /tmp/verse-index.json --ts-out qurani-app/src/data/verses.generated.ts
          python3 qurani-v104-exact-search/test_exact_search.py /tmp/verse-index.json
          rm -rf /tmp/reference-v104 /tmp/reference-extract-v104

      - name: Wire unified selector to exact 12 mushafs
        shell: bash
        run: |
          set -euo pipefail
          cp qurani-unified/src/app/UnifiedSeriesGate.tsx qurani-app/src/app/UnifiedSeriesGate.tsx
          cp qurani-unified/src/app/mushafs.ts qurani-app/src/app/mushafs.ts
          cp qurani-unified/src/app/ActiveMushaf.ts qurani-app/src/app/ActiveMushaf.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qurani-app/src/app/App.tsx'); s=p.read_text()
          s=s.replace("import {ErrorBoundary} from '../features/common/ErrorBoundary';", "import {ErrorBoundary} from '../features/common/ErrorBoundary';\nimport {UnifiedSeriesGate} from './UnifiedSeriesGate';\nimport {makeMushafEntries} from './mushafs';")
          anchor='const navigationTheme ='
          titles="""const UNIFIED_MUSHAFS = makeMushafEntries([\n  'المصحف المعلم بقراءة الإمام أبي عمرو البصري براوييه السوسي والدوري',\n  'المصحف المعلم بقراءة الإمام ابن عامر الشامي برواية هشام وبالحاشية ما خالفه فيه ابن ذكوان',\n  'المصحف المعلم بقراءة الإمام عبدالله بن كثير براوييه البزي وقنبل',\n  'المصحف المعلم برواية الإمام خلف عن حمزة بوجه السكت على الساكن المفصول',\n  'المصحف المعلم بقراءة الإمام الكسائي براوييه الليث والدوري',\n  'المصحف المعلم برواية الإمام خلاد عن حمزة بوجه ترك السكت مطلقًا',\n  'المصحف المعلم بقراءة الإمام أبي جعفر المدني براوييه ابن وردان وابن جماز',\n  'المصحف المعلم بقراءة الإمام يعقوب الحضرمي براوييه رويس وروح',\n  'المصحف المعلم بقراءة الإمام خلف العاشر البزار براوييه إسحاق وإدريس',\n  'المصحف المعلم بقراءة الإمام عاصم ابن أبي النجود برواية حفص وبالحاشية ما خالفه فيه شعبة',\n  'مصحف ورش عن نافع من طريق الأزرق',\n  'مصحف قالون عن نافع بوجه قصر المنفصل وإسكان ميم الجمع',\n]);\n\n"""
          if anchor not in s: raise SystemExit('THEME_ANCHOR_MISSING')
          s=s.replace(anchor,titles+anchor)
          old='<NavigationContainer theme={navigationTheme}><AppNavigation /></NavigationContainer>'
          new="<UnifiedSeriesGate mushafs={UNIFIED_MUSHAFS}>{(_entry, leave) => (<NavigationContainer theme={navigationTheme}><AppNavigation onExitSeries={leave} /></NavigationContainer>)}</UnifiedSeriesGate>"
          if old not in s: raise SystemExit('APP_NAV_ANCHOR_MISSING')
          p.write_text(s.replace(old,new))
          p=Path('qurani-app/src/app/navigation.tsx'); s=p.read_text(); oldnav='export function AppNavigation(): React.JSX.Element {'
          if oldnav not in s: raise SystemExit('NAV_FUNCTION_ANCHOR_MISSING')
          p.write_text(s.replace(oldnav,"export function AppNavigation({onExitSeries: _onExitSeries}: {onExitSeries?: () => void}): React.JSX.Element {"))
          PY

      - name: Package original content for all 12 mushafs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf qurani-app/android/app/src/main/assets/pdf /tmp/v104-apks /tmp/unpack
          mkdir -p qurani-app/android/app/src/main/assets/pdf /tmp/v104-apks /tmp/unpack
          gh release download quran-series-v1.0.4-exact-ayah-search --pattern '*.apk' --dir /tmp/v104-apks
          cat > /tmp/unified-assets.txt <<'EOF'
          01-AbuAmr-v1.0.4.apk|abuamr
          02-IbnAmir-v1.0.4.apk|ibnamir
          03-IbnKathir-v1.0.4.apk|ibnkathir
          04-Khalaf-Hamza-Sakt-v1.0.4.apk|khalafhamza
          05-AlKisai-v1.0.4.apk|alkisai
          06-Khallad-Hamza-NoSakt-v1.0.4.apk|khalladhamza
          07-AbuJaafar-v1.0.4.apk|abujaafar
          08-Yaqub-v1.0.4.apk|yaqub
          09-Khalaf10-v1.0.4.apk|khalaf10
          10-Asim-v1.0.4.apk|asim
          11-Warsh-Azraq-v1.0.4.apk|warshazraq
          12-Qalun-Qasr-v1.0.4.apk|qalunqasr
          EOF
          count=0
          while IFS='|' read -r apk slug; do
            test -s "/tmp/v104-apks/$apk"
            count=$((count+1))
          done < /tmp/unified-assets.txt
          test "$count" -eq 12
          echo "ALL_12_SOURCE_APKS_PRESENT=1"
          # apply_embedded_bundles.py creates one isolated asset-pack APK per mushaf,
          # preserving the original assets/pdf/... paths. Do not duplicate the PDFs
          # into the unified APK's root assets.
          rm -rf qurani-app/android/app/src/main/assets/pdf
          mkdir -p qurani-app/android/app/src/main/assets/pdf
          echo "ROOT_PDF_ASSETS_DISABLED=1"
          df -h .

      - name: Embed the 12 standalone app UI bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 qurani-unified/apply_embedded_bundles.py qurani-app /tmp/v104-apks
          test "$(find qurani-app/android/app/src/main/assets/mushaf-bundles -mindepth 2 -name index.android.bundle | wc -l)" -eq 12
          test "$(find qurani-app/android/app/src/main/assets/mushaf-packs -maxdepth 1 -name '*.apk' | wc -l)" -eq 12
          for p in qurani-app/android/app/src/main/assets/mushaf-packs/*.apk; do unzip -tq "$p" >/dev/null; unzip -l "$p" | grep -q 'assets/pdf/'; done
          echo 'STANDALONE_UI_BUNDLES_12_OK=1'
          echo 'STANDALONE_ASSET_PACKS_12_OK=1'

      - name: Configure and verify unified Android app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          gp = Path('qurani-app/android/gradle.properties')
          gs = gp.read_text() if gp.exists() else ''
          if re.search(r'^newArchEnabled\s*=', gs, re.M):
              gs = re.sub(r'^newArchEnabled\s*=.*$', 'newArchEnabled=false', gs, flags=re.M)
          else:
              gs += '\nnewArchEnabled=false\n'
          gp.write_text(gs)
          g = Path('qurani-app/android/app/build.gradle')
          gs = g.read_text()
          gs = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.qurani.series"', gs)
          gs = re.sub(r'versionCode\s+\d+', 'versionCode 3', gs)
          gs = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.3"', gs)
          g.write_text(gs)
          strings = Path('qurani-app/android/app/src/main/res/values/strings.xml')
          if strings.exists():
              ss = strings.read_text()
              ss = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">سلسلة قرآني</string>', ss)
              strings.write_text(ss)
          PY
          cd qurani-app
          cat > tsconfig.unified.json <<'EOF'
          {"extends":"./tsconfig.json","exclude":["__tests__","node_modules","android","ios"]}
          EOF
          npx tsc -p tsconfig.unified.json --noEmit
          cd ..
          grep -q "'abuamr'.*'qalunqasr'" qurani-app/src/app/mushafs.ts
          grep -q 'scopedPdfAsset' qurani-app/src/features/reader/PdfPage.tsx
          echo 'UNIFIED_SOURCE_CONTRACT_OK=1'

      - name: Bootstrap Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;27.1.12297006' 'cmake;3.22.1'
          keytool -genkeypair -v -keystore qurani-app/android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Qurani Unified,O=QuranKarem,C=EG' >/dev/null 2>&1 || true
          cd qurani-app/android
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew --version

      - name: Build final unified 12-mushaf APK
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app/android
          ./gradlew assembleRelease --no-daemon
          cd ../..
          mkdir -p final-unified
          APK="$(find qurani-app/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"; test -s "$APK"
          cp "$APK" final-unified/qurani-series-v1.0.4-all-12-mushafs.apk
          ls -lh final-unified
          sha256sum final-unified/qurani-series-v1.0.4-all-12-mushafs.apk | tee final-unified/SHA256SUMS.txt
          echo "=== FINAL APK CONTENT VERIFICATION ==="
          rm -rf /tmp/final-apk-check && mkdir -p /tmp/final-apk-check
          unzip -q final-unified/qurani-series-v1.0.4-all-12-mushafs.apk 'assets/mushaf-packs/*' -d /tmp/final-apk-check
          test "$(find /tmp/final-apk-check/assets/mushaf-packs -maxdepth 1 -name '*.apk' | wc -l)" -eq 12
          for p in /tmp/final-apk-check/assets/mushaf-packs/*.apk; do
            unzip -tq "$p" >/dev/null
            unzip -l "$p" | grep -q 'assets/pdf/'
            unzip -l "$p" | grep -q 'assets/index.android.bundle' || true
          done
          echo "FINAL_APK_12_ISOLATED_ASSET_PACKS_OK=1"

      - name: Verify all 12 mushafs on Android emulator
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-unified.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$PWD/final-unified/qurani-series-v1.0.4-all-12-mushafs.apk"
          adb install -r "$APK" 2>&1 | tee /tmp/install.log
          PKG="com.qurani.series"
          adb shell pm path "$PKG" | grep -q "package:"
          adb shell am force-stop "$PKG" || true
          adb logcat -c
          adb shell monkey -p "$PKG" 1 >/dev/null 2>&1
          sleep 5
          dump_ui(){ adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1; adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1; }
          tap_target(){
            local target="$1"
            for attempt in $(seq 1 15); do
              dump_ui
              if python3 - "$target" <<'PY'
          import sys,xml.etree.ElementTree as ET,re,subprocess
          target=sys.argv[1]
          root=ET.parse('/tmp/window.xml').getroot()
          for n in root.iter('node'):
              vals=(n.attrib.get('text',''),n.attrib.get('resource-id',''),n.attrib.get('content-desc',''))
              if any(target in v for v in vals):
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      x=(int(m.group(1))+int(m.group(3)))//2
                      y=(int(m.group(2))+int(m.group(4)))//2
                      subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
                      print('TAPPED',target,x,y)
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
              then return 0; fi
              adb shell input swipe 540 1850 540 650 500 >/dev/null 2>&1 || true
              sleep 1
            done
            echo "TEXT_OR_ID_NOT_FOUND=$target"
            cat /tmp/window.xml 2>/dev/null || true
            return 1
          }
          for i in 1 2 3; do
            dump_ui
            if grep -q 'ابدأ الآن' /tmp/window.xml; then tap_target 'ابدأ الآن'; elif grep -q 'التالي' /tmp/window.xml; then tap_target 'التالي'; else break; fi
            sleep 2
          done
          declare -a IDS=(abuamr ibnamir ibnkathir khalafhamza alkisai khalladhamza abujaafar yaqub khalaf10 asim warshazraq qalunqasr)
          declare -a TITLES=('المصحف المعلم بقراءة الإمام أبي عمرو' 'المصحف المعلم بقراءة الإمام ابن عامر' 'المصحف المعلم بقراءة الإمام عبدالله بن كثير' 'المصحف المعلم برواية الإمام خلف عن حمزة' 'المصحف المعلم بقراءة الإمام الكسائي' 'المصحف المعلم برواية الإمام خلاد عن حمزة' 'المصحف المعلم بقراءة الإمام أبي جعفر' 'المصحف المعلم بقراءة الإمام يعقوب' 'المصحف المعلم بقراءة الإمام خلف العاشر' 'المصحف المعلم بقراءة الإمام عاصم' 'مصحف ورش عن نافع' 'مصحف قالون عن نافع')
          for i in ${!IDS[@]}; do
            id=${IDS[$i]}
            adb shell am force-stop "$PKG" || true
            adb logcat -c
            adb shell monkey -p "$PKG" 1 >/dev/null 2>&1
            sleep 3
            tap_target "mushaf-card-$id"
            # Allow the deep-link Activity and its selected bundle time to start.
            for attempt in $(seq 1 12); do
              sleep 1
              dump_ui
              if ! grep -q 'اختر المصحف أو القراءة' /tmp/window.xml; then break; fi
            done
            # The selected standalone v1.0.4 UI must replace the series selector.
            if grep -q 'اختر المصحف أو القراءة' /tmp/window.xml; then
              echo "CARD_DID_NOT_OPEN_STANDALONE_UI=$id"
              echo "=== CURRENT ACTIVITY ==="
              adb shell dumpsys activity activities | grep -m 3 -E 'mResumedActivity|mFocusedApp' || true
              echo "=== QURANI LOGCAT ==="
              adb logcat -d -s QURANI:* ReactNativeJS:* AndroidRuntime:E || true
              cat /tmp/window.xml
              exit 1
            fi
            if ! tap_target "فتح المصحف"; then
              echo "QURAN_SECTION_NOT_FOUND=$id"
              cat /tmp/window.xml
              exit 1
            fi
            sleep 10
            dump_ui
            if grep -Eq 'تعذر (عرض|تحميل)|Failed to fetch|تعذر' /tmp/window.xml; then
              echo "READER_UI_ERROR=$id"
              cat /tmp/window.xml
              exit 1
            fi
            adb logcat -d > /tmp/current.log
            grep -q "\[QURANI\] ASSET_PACK_OK=$id" /tmp/current.log
            grep -q "\[QURANI\] ASSET_PDF_OK=$id" /tmp/current.log
            if grep -Eq 'PDF_RENDER_ERROR|ENOENT|FileNotFoundException.*pdf/|Unable to open.*pdf/' /tmp/current.log; then
              echo "PDF_RUNTIME_ERROR=$id"
              cat /tmp/current.log
              exit 1
            fi
            echo "MUSHAF_$((i+1))_$id=PASS"
          done
          echo 'UNIFIED_12_MUSHAF_ANDROID_RUNTIME=PASS'
          BASH
          chmod +x /tmp/verify-unified.sh
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Run 12-mushaf runtime verification on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          script: bash /tmp/verify-unified.sh

      - name: Upload final unified artifact
        uses: actions/upload-artifact@v4
        with:
          name: qurani-unified-series-all-12-mushafs
          path: final-unified/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish unified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$UNIFIED_TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$UNIFIED_TAG" final-unified/qurani-series-v1.0.4-all-12-mushafs.apk final-unified/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'سلسلة قرآني v1.0.4 – 12 مصحف مستقل داخل تطبيق واحد' --notes 'تطبيق سلسلة قرآني الموحد: كل بطاقة مرتبطة بملفات المصحف الأصلية الخاصة بها من إصدارات v1.0.4، مع شاشة اختيار المصحف، onboarding لأول تشغيل، البحث الدقيق بنص الآية، Zoom، RTL، الفهرس والأقسام.'

# Native bundle launch fix merged; force a fresh CI validation.
