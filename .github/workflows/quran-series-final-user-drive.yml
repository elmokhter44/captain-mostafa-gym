name: Quran Series 12 Final - User Drive Sources

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-series-final-user-drive.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_TAG: quran-series-v1.0.0-final
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install finalization tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyMuPDF==1.26.7' 'gdown==5.2.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip jq
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'platform-tools'

      - name: Reconstruct the 12 validated skeleton APKs from base plus overlays
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qseries
          mkdir -p /tmp/qseries/payload /tmp/qseries/skeletons /tmp/qseries/sources /tmp/qseries/splits /tmp/qseries/final /tmp/qseries/reports /tmp/qseries/key
          cat .series-generated/parts/payload.part-* > /tmp/qseries/payload.tar.gz
          tar -xzf /tmp/qseries/payload.tar.gz -C /tmp/qseries/payload
          test -s /tmp/qseries/payload/base.apk
          test -s /tmp/qseries/payload/build-report.json
          python3 - <<'PYCODE'
          import json, zipfile
          from pathlib import Path
          root=Path('/tmp/qseries/payload')
          out=Path('/tmp/qseries/skeletons')
          report=json.load(open(root/'build-report.json',encoding='utf-8'))
          assert len(report)==12
          for app in report:
              slug=app['slug']
              overlay=root/'overlays'/slug/'files'
              replacements={p.relative_to(overlay).as_posix():p.read_bytes() for p in overlay.rglob('*') if p.is_file()}
              assert set(replacements)==set(app['changedEntries']), (slug,set(replacements),set(app['changedEntries']))
              target=out/f'{slug}.apk'
              with zipfile.ZipFile(root/'base.apk','r') as zin, zipfile.ZipFile(target,'w') as zout:
                  for info in zin.infolist():
                      if info.filename.startswith('META-INF/'):
                          continue
                      data=replacements.get(info.filename, zin.read(info.filename))
                      zout.writestr(info,data)
          print('RECONSTRUCTED_12_UNSIGNED_SKELETONS=1')
          PYCODE
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          python3 - <<'PYCODE' > /tmp/qseries/expected-packages.tsv
          import json
          for x in json.load(open('/tmp/qseries/payload/build-report.json',encoding='utf-8')):
              print(x['slug']+'\t'+x['package'])
          PYCODE
          while IFS=$'\t' read -r slug pkg; do
            unzip -t "/tmp/qseries/skeletons/$slug.apk" >/dev/null
            "$AAPT" dump badging "/tmp/qseries/skeletons/$slug.apk" | grep -q "package: name='$pkg' versionCode='1' versionName='1.0.0'"
          done < /tmp/qseries/expected-packages.tsv

      - name: Download only the exact user-provided Google Drive PDFs and verify bytes, SHA-256, and page totals
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qseries/source-config.json <<'JSON'
          [
            {"slug":"abuamr","url":"https://drive.google.com/file/d/1BVoetPB5RCq5cSV1zxaxb0nj98B0faup/view?usp=drivesdk","total":638,"bytes":137991754,"sha256":"a95be4076c733428c88d07a87999f8bf8d467122995d13e12e8b92f93832ef57","file":"01-AbuAmr-v1.0.0.apk"},
            {"slug":"ibnamir","url":"https://drive.google.com/file/d/1zxcrxi4Q2J0jaKZS1hFPQEF3GhNIDlTZ/view?usp=drivesdk","total":633,"bytes":135445406,"sha256":"3e33b9dd9a8601ded905df385572fa14f7aa6be36d00c0245f714851e96441be","file":"02-IbnAmir-v1.0.0.apk"},
            {"slug":"ibnkathir","url":"https://drive.google.com/file/d/1hFgLvZYo_tqrpTn82kzzRy30kr3agtg5/view?usp=drivesdk","total":632,"bytes":131415456,"sha256":"a95070794325c798af8071e568ed33a4623428725c6e26bf04e9373562aa142e","file":"03-IbnKathir-v1.0.0.apk"},
            {"slug":"khalafhamza","url":"https://drive.google.com/file/d/14dV4ewJ75I-feQSTz0oNsMvUSz2vnlPG/view?usp=drivesdk","total":636,"bytes":137313638,"sha256":"d95049235cb2cc186a78c96c0b3fb3039adedded10973b7ddd24c6d4837101e1","file":"04-Khalaf-Hamza-Sakt-v1.0.0.apk"},
            {"slug":"alkisai","url":"https://drive.google.com/file/d/1a2PHF7eHXmKtn8bgd_SHbSKSyc4vp1b3/view?usp=drivesdk","total":633,"bytes":129020600,"sha256":"db44dc8dbf497297759b07c1eb2a56ad4d9b6d4f4be2fd51b30e365b68444ca5","file":"05-AlKisai-v1.0.0.apk"},
            {"slug":"khalladhamza","url":"https://drive.google.com/file/d/1iLjNkH1nB-eovs6xXJmsh0Zd_dBagpWS/view?usp=drivesdk","total":636,"bytes":136567781,"sha256":"9780c61fd038c587774a11dfc13be0a9c7a8b947ebbf9cd485ef4ae9bbb61f09","file":"06-Khallad-Hamza-NoSakt-v1.0.0.apk"},
            {"slug":"abujaafar","url":"https://drive.google.com/file/d/1ka0xEX2tK95HTJos_eU0W_yjtzYVFeKM/view?usp=drivesdk","total":634,"bytes":129529544,"sha256":"eb13b40d97872c71aada1f14f6f0c674112c9101a2035f166f884e2980241120","file":"07-AbuJaafar-v1.0.0.apk"},
            {"slug":"yaqub","url":"https://drive.google.com/file/d/1-HMgAHqQbJz97EQnPUDd7tFmUJ-uHsJu/view?usp=drivesdk","total":630,"bytes":129466830,"sha256":"dbe7e1c26c550b63066920212b352818994b7bedb949f19bd971242cdd0a6340","file":"08-Yaqub-v1.0.0.apk"},
            {"slug":"khalaf10","url":"https://drive.google.com/file/d/1vHJkNHxGLxLqby6pszUoxhGcOP4-wK6F/view?usp=drivesdk","total":628,"bytes":127737232,"sha256":"4d4a3bafe2279fd2a54725a8d6839a24e0a84feadb6a1e0a66a2eabbe759832a","file":"09-Khalaf10-v1.0.0.apk"},
            {"slug":"asim","url":"https://drive.google.com/file/d/1dtHbfD19xNUxc9rPNT2gHuxTTSK8XLBh/view?usp=drivesdk","total":633,"bytes":131227502,"sha256":"ef0e7975e251ddc74f718f0b26c12ccace057378ce77c641019ac50691b98ec4","file":"10-Asim-v1.0.0.apk"},
            {"slug":"warshazraq","url":"https://drive.google.com/file/d/1eZsEfvK2WYERoHXRqdIxgfC8K6hqAcgI/view?usp=drivesdk","total":637,"bytes":132692854,"sha256":"7481a5928e503ad7b37629231283e4123f123461a90723696e298052c9188bb4","file":"11-Warsh-Azraq-v1.0.0.apk"},
            {"slug":"qalunqasr","url":"https://drive.google.com/file/d/1qTjYqpjs9S6v0UM2nZMXvUSsmBXxum3b/view?usp=drivesdk","total":632,"bytes":128662407,"sha256":"d5f06bf757b32cb3e0be67cb4212eab4555e4c5114ce7cecca89b898b7064385","file":"12-Qalun-Qasr-v1.0.0.apk"}
          ]
          JSON
          python3 - <<'PYCODE'
          import json, pathlib, hashlib, fitz, time, gdown
          cfg=json.load(open('/tmp/qseries/source-config.json',encoding='utf-8'))
          dest=pathlib.Path('/tmp/qseries/sources')
          def sha256_file(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()
          rows=[]
          for app in cfg:
              p=dest/(app['slug']+'.pdf')
              last=None
              for attempt in range(4):
                  try:
                      if p.exists(): p.unlink()
                      result=gdown.download(url=app['url'], output=str(p), quiet=False, fuzzy=True)
                      if not result or not p.exists():
                          raise RuntimeError('gdown did not produce the requested file')
                      size=p.stat().st_size
                      if size!=app['bytes']:
                          raise RuntimeError(f"{app['slug']} bytes {size} != expected {app['bytes']}")
                      sha=sha256_file(p)
                      if sha!=app['sha256']:
                          raise RuntimeError(f"{app['slug']} SHA-256 {sha} != expected {app['sha256']}")
                      d=fitz.open(p); pages=d.page_count; d.close()
                      if pages!=app['total']:
                          raise RuntimeError(f"{app['slug']} pages {pages} != expected {app['total']}")
                      row={'slug':app['slug'],'drive_url':app['url'],'pages':pages,'bytes':size,'sha256':sha,'exact_user_source_verified':True}
                      rows.append(row)
                      print('SOURCE_OK', row)
                      break
                  except Exception as e:
                      last=e
                      if p.exists(): p.unlink()
                      if attempt==3: raise
                      time.sleep(5*(attempt+1))
              else:
                  raise last
          assert len(rows)==12
          json.dump(rows,open('/tmp/qseries/reports/source-pdfs.json','w'),ensure_ascii=False,indent=2)
          PYCODE

      - name: Split verified PDFs by approved contiguous ranges without rasterization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, fitz, hashlib
          from pathlib import Path
          cfg=json.load(open('/tmp/qseries/source-config.json',encoding='utf-8'))
          reports=[]
          for app in cfg:
              slug,total=app['slug'],app['total']
              ranges=[('reading.pdf',1,4),('quran.pdf',5,608),('quran_index.pdf',609,610),('dua.pdf',611,611),('waqf_symbols.pdf',612,616),('furati_intro.pdf',617,620),('usul.pdf',621,total)]
              prev=0
              for _,a,b in ranges:
                  assert a==prev+1 and b>=a,(slug,a,b,prev)
                  prev=b
              assert prev==total
              assert sum(b-a+1 for _,a,b in ranges)==total
              src=fitz.open(f'/tmp/qseries/sources/{slug}.pdf')
              assert src.page_count==total
              outdir=Path('/tmp/qseries/splits')/slug; outdir.mkdir(parents=True,exist_ok=True)
              assets=[]
              for name,a,b in ranges:
                  out=fitz.open(); out.insert_pdf(src,from_page=a-1,to_page=b-1)
                  path=outdir/name; out.save(path,garbage=4,deflate=True); out.close()
                  chk=fitz.open(path); assert chk.page_count==b-a+1
                  for j in sorted(set([0,chk.page_count-1])):
                      s=src[a-1+j].get_pixmap(matrix=fitz.Matrix(.35,.35),alpha=False)
                      t=chk[j].get_pixmap(matrix=fitz.Matrix(.35,.35),alpha=False)
                      assert (s.width,s.height,s.samples)==(t.width,t.height,t.samples),(slug,name,j)
                  chk.close()
                  data=path.read_bytes()
                  assets.append({'name':name,'range':[a,b],'pages':b-a+1,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'method':'direct PDF page-object copy; no JPG/raster conversion'})
              src.close()
              reports.append({'slug':slug,'total':total,'ranges':assets,'coverage':f'1-{total}','no_gaps':True,'no_overlaps':True})
          json.dump(reports,open('/tmp/qseries/reports/pdf-splits.json','w'),ensure_ascii=False,indent=2)
          print('PDF_SPLITS_VERIFIED=12')
          PYCODE

      - name: Generate one private signing key for all 12 v1.0.0 APKs
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(python3 - <<'PYCODE'
          import secrets
          print(secrets.token_urlsafe(40))
          PYCODE
          )"
          printf '%s' "$PASS" > /tmp/qseries/key/keystore-password.txt
          keytool -genkeypair -v -keystore /tmp/qseries/key/Quran-Series-v1.keystore -storepass "$PASS" -keypass "$PASS" -alias quran-series-release -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Quran Karem Series,O=QuranKarem,C=EG' >/tmp/qseries/reports/keytool.txt 2>&1
          keytool -list -v -keystore /tmp/qseries/key/Quran-Series-v1.keystore -storepass "$PASS" -alias quran-series-release > /tmp/qseries/reports/signing-certificate.txt
          (cd /tmp/qseries/key && zip -q Quran-Series-signing-backup.zip Quran-Series-v1.keystore keystore-password.txt)
          test -s /tmp/qseries/key/Quran-Series-v1.keystore
          test -s /tmp/qseries/key/Quran-Series-signing-backup.zip

      - name: Encrypt signing-key backup to the offline recovery public key
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qseries/key/recovery-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAo8KThJ3EfVRpWlFe/Iu1
          anTPmufdwELGfheLoJgIs/g3L+AzSgLCZ59+keWpmI3uBpM1obQYa7cUh/E94m+Y
          DigxLHyXb7F1Ne0SpmS55rYCiAsEOEsRs10c5CgBfd0IzarydDShnFEOv7iksPsd
          7HK9PA+Gba3Dn1PZN3OLcl3W2jiYskgqw8szJriCtnuzDWaQGo3m7UPhNQ64VdZ0
          4T1R/7G0Xcy0GJgRpnzxy59sTOuL+eOXADP/3t1Yj+bRw+d5SlnPIc/hGGZYlZvw
          jy0EG53PM1xhfXgUrEtlSi2qzDtttEfwZ2Ow81aTWEyUb+TSiqMex2Y2KmAgKB8M
          BZL0W6QAVGUFgPe3Ch8N4C5NUnh1j7HqDhhhicDYCFKRmzpMAIDC6QQvCFtjQtCk
          aR+Ln+WRHplzb27mG2Bq/wrJyS3EdPws+TDg2SVzyXVEEhCyNSZtq65L4CZ3vLh5
          thagwJy9ekto3U3VPu9UUngJmHnqNCrpvUeSm+QwGR97LdP7xunfjp5qQSG9ey0q
          BIiSIr1nsJSOH6DEaxV5MSD6B+8RhLUd/H26V0/HeVgWRGF8b9tg0qEGP4mfh4zf
          zhjOcKFfmKXaRmrx2vdlAhc021V/AiGr2Z3Jza1wzvrB3PniHJxlH0tijeZk75BN
          0FrODSUsSAE3K7ZGtbpOT9ECAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          openssl rand -out /tmp/qseries/key/backup-aes.key 32
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/qseries/key/Quran-Series-signing-backup.zip -out /tmp/qseries/key/Quran-Series-signing-backup.zip.enc -pass file:/tmp/qseries/key/backup-aes.key
          openssl pkeyutl -encrypt -pubin -inkey /tmp/qseries/key/recovery-public.pem -in /tmp/qseries/key/backup-aes.key -out /tmp/qseries/key/Quran-Series-backup-key.rsa -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          test -s /tmp/qseries/key/Quran-Series-signing-backup.zip.enc
          test -s /tmp/qseries/key/Quran-Series-backup-key.rsa
          rm -f /tmp/qseries/key/Quran-Series-signing-backup.zip /tmp/qseries/key/backup-aes.key

      - name: Inject PDFs, align, sign, and statically verify all 12 APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          PASS="$(cat /tmp/qseries/key/keystore-password.txt)"
          python3 - <<'PYCODE'
          import json, zipfile
          from pathlib import Path
          cfg=json.load(open('/tmp/qseries/source-config.json',encoding='utf-8'))
          for app in cfg:
              slug=app['slug']; src=Path('/tmp/qseries/skeletons')/(slug+'.apk'); out=Path('/tmp/qseries')/(slug+'-unsigned.apk'); split=Path('/tmp/qseries/splits')/slug
              replacements={'assets/pdf/reading.pdf':(split/'reading.pdf').read_bytes(),'assets/pdf/quran.pdf':(split/'quran.pdf').read_bytes(),'assets/pdf/quran_index.pdf':(split/'quran_index.pdf').read_bytes(),'assets/pdf/dua.pdf':(split/'dua.pdf').read_bytes(),'assets/pdf/waqf_symbols.pdf':(split/'waqf_symbols.pdf').read_bytes(),'assets/pdf/furati_intro.pdf':(split/'furati_intro.pdf').read_bytes(),'assets/pdf/usul.pdf':(split/'usul.pdf').read_bytes()}
              seen=set()
              with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
                  for info in zin.infolist():
                      if info.filename.startswith('META-INF/'): continue
                      data=replacements.get(info.filename,zin.read(info.filename))
                      if info.filename in replacements: seen.add(info.filename)
                      zout.writestr(info,data)
              assert seen==set(replacements),(slug,seen,set(replacements))
          PYCODE
          python3 - <<'PYCODE' > /tmp/qseries/final-map.tsv
          import json
          apps={x['slug']:x for x in json.load(open('/tmp/qseries/payload/build-report.json',encoding='utf-8'))}
          for c in json.load(open('/tmp/qseries/source-config.json',encoding='utf-8')):
              a=apps[c['slug']]; print('\t'.join([c['slug'],a['package'],c['file']]))
          PYCODE
          : > /tmp/qseries/reports/apk-verification.txt
          while IFS=$'\t' read -r slug pkg filename; do
            UNSIGNED="/tmp/qseries/$slug-unsigned.apk"; ALIGNED="/tmp/qseries/$slug-aligned.apk"; FINAL="/tmp/qseries/final/$filename"
            "$BT/zipalign" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED" >/tmp/qseries/reports/$slug-zipalign-build.txt
            "$BT/apksigner" sign --ks /tmp/qseries/key/Quran-Series-v1.keystore --ks-key-alias quran-series-release --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL" "$ALIGNED"
            unzip -t "$FINAL" >/tmp/qseries/reports/$slug-unzip.txt
            "$BT/zipalign" -c -P 16 -v 4 "$FINAL" >/tmp/qseries/reports/$slug-zipalign-verify.txt
            "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee /tmp/qseries/reports/$slug-apksigner.txt
            grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/qseries/reports/$slug-apksigner.txt
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/qseries/reports/$slug-apksigner.txt
            "$BT/aapt" dump badging "$FINAL" | tee /tmp/qseries/reports/$slug-badging.txt
            grep -q "package: name='$pkg' versionCode='1' versionName='1.0.0'" /tmp/qseries/reports/$slug-badging.txt
            printf '%s\t%s\t%s\t' "$slug" "$pkg" "$filename" >> /tmp/qseries/reports/apk-verification.txt
            sha256sum "$FINAL" | awk '{print $1}' >> /tmp/qseries/reports/apk-verification.txt
          done < /tmp/qseries/final-map.tsv
          test "$(find /tmp/qseries/final -maxdepth 1 -name '*.apk' | wc -l)" -eq 12

      - name: Verify exact PDF assets, packages, versions, and Khallad blue identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, zipfile, hashlib
          from pathlib import Path
          cfg=json.load(open('/tmp/qseries/source-config.json',encoding='utf-8'))
          build={x['slug']:x for x in json.load(open('/tmp/qseries/payload/build-report.json',encoding='utf-8'))}
          expected_names=['dua.pdf','furati_intro.pdf','quran.pdf','quran_index.pdf','reading.pdf','usul.pdf','waqf_symbols.pdf']
          final=[]
          for app in cfg:
              slug=app['slug']; apk=Path('/tmp/qseries/final')/app['file']; split=Path('/tmp/qseries/splits')/slug
              with zipfile.ZipFile(apk) as z:
                  names=sorted(Path(n).name for n in z.namelist() if n.startswith('assets/pdf/') and n.endswith('.pdf'))
                  assert names==expected_names,(slug,names)
                  for name in expected_names:
                      assert z.read('assets/pdf/'+name)==(split/name).read_bytes(),(slug,name,'embedded PDF differs from verified split')
                  bundle=z.read('assets/index.android.bundle')
                  if slug=='khalladhamza': assert b'#0B5ED7' in bundle or b'#0b5ed7' in bundle, 'Khallad blue brand color missing from bundle'
              final.append({'slug':slug,'package':build[slug]['package'],'versionCode':1,'versionName':'1.0.0','apk':app['file'],'apk_bytes':apk.stat().st_size,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'source_pages':app['total'],'source_sha256':app['sha256'],'source_bytes':app['bytes'],'source_url':app['url'],'ranges':[[1,4],[5,608],[609,610],[611,611],[612,616],[617,620],[621,app['total']]],'zip_sanity':True,'zipalign_16kb':True,'signing_v1':True,'signing_v2':True,'original_pdf_direct_copy':True,'placeholder_pdf':False})
          assert len(final)==12 and len({x['package'] for x in final})==12
          json.dump(final,open('/tmp/qseries/reports/Quran-Series-v1.0.0-verification.json','w'),ensure_ascii=False,indent=2)
          print('FINAL_12_APKS_VERIFIED=1')
          PYCODE
          cat /tmp/qseries/reports/Quran-Series-v1.0.0-verification.json

      - name: Publish 12 fixed GitHub Release APKs - no Actions artifact delivery for APKs
        shell: bash
        run: |
          set -euo pipefail
          NOTES=/tmp/qseries/reports/release-notes.md
          {
            echo '# Quran Karem series v1.0.0 final'
            echo
            echo '12 independent signed Android APKs. Each app uses only the exact user-provided Google Drive PDF verified by SHA-256 and byte size before packaging.'
            echo
            echo 'PDF pages are copied directly into section PDFs; no JPG conversion or rasterized page replacement is used.'
            echo
            echo 'All apps: versionName 1.0.0 / versionCode 1, unique package IDs, offline PDF assets, ZIP sanity, 16 KB zipalign, and v1/v2 signing verification.'
          } > "$NOTES"
          if gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release edit "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" --title 'Quran Karem - 12 Apps v1.0.0 Final' --notes-file "$NOTES"; else gh release create "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" --title 'Quran Karem - 12 Apps v1.0.0 Final' --notes-file "$NOTES"; fi
          gh release upload "$FINAL_TAG" /tmp/qseries/final/*.apk /tmp/qseries/reports/Quran-Series-v1.0.0-verification.json /tmp/qseries/reports/signing-certificate.txt /tmp/qseries/key/Quran-Series-signing-backup.zip.enc /tmp/qseries/key/Quran-Series-backup-key.rsa --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,url:.url,size:.size}]}' | tee /tmp/qseries/reports/release-assets.json
          test "$(jq '.assets | map(select(.name|endswith(".apk"))) | length' /tmp/qseries/reports/release-assets.json)" -eq 12
