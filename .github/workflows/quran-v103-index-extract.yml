name: Quran v1.0.3 Extract Index Geometry

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v103-index-extract.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download user AbuAmr PDF and persist index renders
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'gdown==5.2.0' 'PyMuPDF==1.26.4'
          python3 -m gdown '1BVoetPB5RCq5cSV1zxaxb0nj98B0faup' -O /tmp/source.pdf --quiet
          mkdir -p /tmp/index-pages qurani-v103-working/index-renders
          python3 - <<'PY'
          import fitz,json,base64
          from pathlib import Path
          doc=fitz.open('/tmp/source.pdf')
          assert doc.page_count==638,doc.page_count
          out={}
          for pno in (609,610):
              p=doc[pno-1]
              rect=p.rect
              pix=p.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
              png=pix.tobytes('png')
              Path(f'qurani-v103-working/index-renders/page-{pno}.png.b64').write_text(base64.b64encode(png).decode('ascii'),encoding='ascii')
              out[str(pno)]={'width':rect.width,'height':rect.height,'text':p.get_text('text')}
          Path('qurani-v103-working/index-words.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qurani-v103-working/index-words.json qurani-v103-working/index-renders
          git commit -m 'ci: persist Quran index renders from user PDF' || true
          git pull --rebase origin qurani-series-v100
          git push origin HEAD:qurani-series-v100
