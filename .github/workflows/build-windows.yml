name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - BUILD_TRIGGER.txt

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run logic tests
        shell: pwsh
        run: npm test

      - name: Build NSIS Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $marker = Join-Path $env:TEMP 'captain-mostafa-gym-smoke-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD 'dist\win-unpacked\Captain Mostafa Gym.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test','--enable-logging' -PassThru
          if (-not $p.WaitForExit(30000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw 'Packaged application did not exit after smoke test.'
          }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if (-not (Test-Path $marker)) {
            throw "Packaged application failed smoke test. Exit code: $($p.ExitCode)"
          }
          Write-Host 'Packaged Electron + Realm startup smoke test passed.'

      - name: Install setup and test installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found.' }
          Write-Host "Installing: $($installer.FullName)"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }

          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcut = Join-Path $desktop 'Captain Mostafa Gym.lnk'
          if (-not (Test-Path $shortcut)) { throw "Desktop shortcut was not created: $shortcut" }

          $ws = New-Object -ComObject WScript.Shell
          $lnk = $ws.CreateShortcut($shortcut)
          $installedExe = $lnk.TargetPath
          Write-Host "Shortcut target: $installedExe"
          if (-not (Test-Path $installedExe)) { throw 'Installed executable target does not exist.' }

          $marker = Join-Path $env:TEMP 'captain-mostafa-gym-smoke-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test','--enable-logging' -PassThru
          if (-not $p.WaitForExit(30000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw 'Installed application did not exit after smoke test.'
          }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if (-not (Test-Path $marker)) {
            throw "Installed application failed smoke test. Exit code: $($p.ExitCode)"
          }
          Write-Host 'Installed app + Realm + desktop shortcut smoke test passed.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Mostafa-Gym-Windows-Installer-v1.0.1
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 30
