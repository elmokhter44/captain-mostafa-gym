name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - BUILD_TRIGGER.txt

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/login-preload.js
          node --check src/auth.js
          node --check src/db-pro.js
          node --check src/renderer.js

      - name: Run logic tests
        shell: pwsh
        run: npm test

      - name: Build NSIS Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Test mandatory login credentials and reset
        shell: pwsh
        run: |
          $authDir = Join-Path $env:TEMP 'captain-mostafa-gym-auth-test'
          $marker = Join-Path $env:TEMP 'captain-mostafa-gym-auth-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $authDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $authDir | Out-Null
          $env:GYM_TEST_USER_DATA = $authDir
          $exe = Join-Path $PWD 'dist\win-unpacked\Captain Mostafa Gym.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--auth-smoke-test' -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Authentication smoke test timed out.' }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw "Authentication smoke test failed: $($p.ExitCode)" }
          Remove-Item Env:GYM_TEST_USER_DATA -ErrorAction SilentlyContinue
          Write-Host 'Default Admin/Admin + wrong-password rejection + credential change + reset test passed.'

      - name: Test mandatory login screen before main app
        shell: pwsh
        run: |
          $loginDir = Join-Path $env:TEMP 'captain-mostafa-gym-login-ui-test'
          $marker = Join-Path $env:TEMP 'captain-mostafa-gym-login-ui-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $loginDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $loginDir | Out-Null
          $env:GYM_TEST_USER_DATA = $loginDir
          $exe = Join-Path $PWD 'dist\win-unpacked\Captain Mostafa Gym.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--login-ui-smoke-test' -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Login UI smoke test timed out.' }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw "Login UI smoke test failed: $($p.ExitCode)" }
          Get-Content $marker
          Remove-Item Env:GYM_TEST_USER_DATA -ErrorAction SilentlyContinue
          Write-Host 'Login window loaded and main application remained blocked before authentication.'

      - name: Smoke test packaged UI and Realm
        shell: pwsh
        run: |
          $marker = Join-Path $env:TEMP 'captain-mostafa-gym-smoke-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD 'dist\win-unpacked\Captain Mostafa Gym.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test','--enable-logging' -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; if (Test-Path $startupLog) { Get-Content $startupLog }; throw 'Packaged UI smoke test timed out.' }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw "Packaged UI smoke test failed: $($p.ExitCode)" }
          Get-Content $marker
          Write-Host 'Existing packaged UI + Electron + Realm smoke test passed unchanged.'

      - name: Test full CRUD, plans, payments, reports and CSV data
        shell: pwsh
        run: |
          $featureDir = Join-Path $env:TEMP 'captain-mostafa-gym-feature-test'
          $marker = Join-Path $env:TEMP 'captain-mostafa-gym-feature-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $featureDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $featureDir | Out-Null
          $env:GYM_TEST_USER_DATA = $featureDir
          $exe = Join-Path $PWD 'dist\win-unpacked\Captain Mostafa Gym.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--feature-smoke-test' -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Full feature smoke test timed out.' }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw "Full feature smoke test failed: $($p.ExitCode)" }
          Remove-Item Env:GYM_TEST_USER_DATA -ErrorAction SilentlyContinue
          Write-Host 'Existing CRUD + plan + trainee edit + subscription edit + payment + reports + CSV + archive features passed unchanged.'

      - name: Test migration from v1.0.0 Realm database
        shell: pwsh
        run: |
          $legacyDir = Join-Path $env:TEMP 'captain-mostafa-gym-legacy-fixture'
          $migrationMarker = Join-Path $env:TEMP 'captain-mostafa-gym-migration-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $legacyDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $migrationMarker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $legacyDir | Out-Null
          $env:GYM_TEST_USER_DATA = $legacyDir
          $exe = Join-Path $PWD 'dist\win-unpacked\Captain Mostafa Gym.exe'
          $seed = Start-Process -FilePath $exe -ArgumentList '--create-legacy-fixture' -PassThru
          if (-not $seed.WaitForExit(30000)) { Stop-Process -Id $seed.Id -Force -ErrorAction SilentlyContinue; throw 'Legacy fixture creation timed out.' }
          if ($seed.ExitCode -ne 0) { if (Test-Path $startupLog) { Get-Content $startupLog }; throw "Legacy fixture creation failed: $($seed.ExitCode)" }
          $verify = Start-Process -FilePath $exe -ArgumentList '--verify-legacy-migration' -PassThru
          if (-not $verify.WaitForExit(30000)) { Stop-Process -Id $verify.Id -Force -ErrorAction SilentlyContinue; throw 'Legacy migration verification timed out.' }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($verify.ExitCode -ne 0 -or -not (Test-Path $migrationMarker)) { throw "Legacy migration test failed: $($verify.ExitCode)" }
          Remove-Item Env:GYM_TEST_USER_DATA -ErrorAction SilentlyContinue
          Write-Host 'v1.0.0 Realm data migrated and verified successfully.'

      - name: Install setup and test installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found.' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcut = Join-Path $desktop 'Captain Mostafa Gym.lnk'
          if (-not (Test-Path $shortcut)) { throw "Desktop shortcut was not created: $shortcut" }
          $ws = New-Object -ComObject WScript.Shell
          $lnk = $ws.CreateShortcut($shortcut)
          $installedExe = $lnk.TargetPath
          if (-not (Test-Path $installedExe)) { throw 'Installed executable target does not exist.' }

          $installedTestDir = Join-Path $env:TEMP 'captain-mostafa-gym-installed-auth-test'
          New-Item -ItemType Directory -Force -Path $installedTestDir | Out-Null
          $env:GYM_TEST_USER_DATA = $installedTestDir

          $authMarker = Join-Path $env:TEMP 'captain-mostafa-gym-auth-ok.txt'
          Remove-Item $authMarker -Force -ErrorAction SilentlyContinue
          $a = Start-Process -FilePath $installedExe -ArgumentList '--auth-smoke-test' -PassThru
          if (-not $a.WaitForExit(30000)) { Stop-Process -Id $a.Id -Force -ErrorAction SilentlyContinue; throw 'Installed authentication test timed out.' }
          if ($a.ExitCode -ne 0 -or -not (Test-Path $authMarker)) { throw "Installed authentication test failed: $($a.ExitCode)" }

          $loginMarker = Join-Path $env:TEMP 'captain-mostafa-gym-login-ui-ok.txt'
          Remove-Item $loginMarker -Force -ErrorAction SilentlyContinue
          $l = Start-Process -FilePath $installedExe -ArgumentList '--login-ui-smoke-test' -PassThru
          if (-not $l.WaitForExit(30000)) { Stop-Process -Id $l.Id -Force -ErrorAction SilentlyContinue; throw 'Installed login UI test timed out.' }
          if ($l.ExitCode -ne 0 -or -not (Test-Path $loginMarker)) { throw "Installed login UI test failed: $($l.ExitCode)" }
          Remove-Item Env:GYM_TEST_USER_DATA -ErrorAction SilentlyContinue

          $marker = Join-Path $env:TEMP 'captain-mostafa-gym-smoke-ok.txt'
          $startupLog = Join-Path $env:TEMP 'captain-mostafa-gym-startup.log'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test','--enable-logging' -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; if (Test-Path $startupLog) { Get-Content $startupLog }; throw 'Installed application smoke test timed out.' }
          if (Test-Path $startupLog) { Get-Content $startupLog }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw "Installed application failed UI smoke test: $($p.ExitCode)" }
          Write-Host 'Installed Setup + mandatory login + existing full UI + Realm + desktop shortcut tests passed.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Mostafa-Gym-Windows-Installer-v1.1.1
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 30
