name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract application source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-src | Out-Null
          tar -xf project.zip -C build-src
          Test-Path build-src/captain-mostafa-gym/package.json

      - name: Install dependencies
        shell: pwsh
        working-directory: build-src/captain-mostafa-gym
        run: npm install --no-audit --no-fund

      - name: Run logic tests
        shell: pwsh
        working-directory: build-src/captain-mostafa-gym
        run: npm test

      - name: Build NSIS Windows installer
        shell: pwsh
        working-directory: build-src/captain-mostafa-gym
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Mostafa-Gym-Windows-Installer
          path: |
            build-src/captain-mostafa-gym/dist/*.exe
            build-src/captain-mostafa-gym/dist/*.yml
          if-no-files-found: error
          retention-days: 30
