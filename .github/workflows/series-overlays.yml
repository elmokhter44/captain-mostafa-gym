name: Quran Series v1.0.0 Overlay Builder

on:
  push:
    branches: [qurani-series-v100]
    paths:
      - '.github/workflows/series-overlays.yml'
      - 'qurani-series/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REALM_DISABLE_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Restore verified master source and base APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35100431525 --repo "$GITHUB_REPOSITORY" -n QURANI-FINAL-v1.0.1-R2-1 -D /tmp/master
          test -s /tmp/master/final-delivery/Qurani-source-v1.0.1.zip
          test -s /tmp/master/final-delivery/Qurani-v1.0.1.apk
          echo '2a6ce96c24a49f2865784817739d581589fb78ee6679339acd0e6d96cd112e69  /tmp/master/final-delivery/Qurani-v1.0.1.apk' | sha256sum -c -
          mkdir -p qurani-app
          unzip -q /tmp/master/final-delivery/Qurani-source-v1.0.1.zip -d qurani-app

      - name: Reproduce Ibn Kathir v1.0.0 master template
        shell: bash
        run: |
          set -euo pipefail
          base64 -d qurani-ibnkathir/ibnkathir-code.patch.gz.b64 | gzip -dc > /tmp/ibnkathir.patch
          cd qurani-app
          patch --batch -p1 < /tmp/ibnkathir.patch
          patch --batch -p1 < ../qurani-ibnkathir/approved-additions-code.patch

      - name: Decode series build scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/quran-series-scripts
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/quran-series-scripts/apply_series_common.py
          base64 -d qurani-series/build_all_overlays.py.gz.b64 | gzip -dc > /tmp/quran-series-scripts/build_all_overlays.py
          python3 -m py_compile /tmp/quran-series-scripts/apply_series_common.py /tmp/quran-series-scripts/build_all_overlays.py

      - name: RED - prove the requested reader behavior is absent before implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > qurani-app/__tests__/series-reader-contract.node.test.ts <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';

          test('reader uses one-page horizontal swipe and tap bottom menu', () => {
            const reader = readFileSync('src/features/reader/ReaderScreen.tsx', 'utf8');
            assert.match(reader, /horizontal/);
            assert.match(reader, /pagingEnabled/);
            assert.match(reader, /contentOffset\.x/);
            assert.doesNotMatch(reader, /contentOffset\.y/);
            for (const label of ['البحث','حفظ علامة','الانتقال إلى العلامة','الفهرس','المزيد']) assert.ok(reader.includes(label));
            assert.doesNotMatch(reader, /التالي|السابق/);
          });

          test('section cards have no subtitles', () => {
            const card = readFileSync('src/features/home/SectionCard.tsx', 'utf8');
            assert.doesNotMatch(card, /section\.subtitle/);
          });

          test('reader theme can be persisted', () => {
            const settings = readFileSync('src/repositories/SettingsRepository.ts', 'utf8');
            assert.match(settings, /setTheme/);
          });
          EOF
          cd qurani-app
          if node --experimental-strip-types --test __tests__/series-reader-contract.node.test.ts >/tmp/red.txt 2>&1; then
            cat /tmp/red.txt
            echo 'ERROR: RED test unexpectedly passed before implementation'
            exit 1
          fi
          cat /tmp/red.txt
          echo 'RED phase confirmed'

      - name: Apply approved common series UI and reader behavior
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          python3 /tmp/quran-series-scripts/apply_series_common.py .

      - name: GREEN - reader contract and typecheck
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          npm install --no-audit --no-fund
          node --experimental-strip-types --test __tests__/series-reader-contract.node.test.ts | tee /tmp/green.txt
          grep -q '# fail 0' /tmp/green.txt
          npm run typecheck

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Prepare Gradle and build-only PDF placeholders
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyMuPDF==1.26.4'
          cd qurani-app
          keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Series Skeleton,O=QuranKarem,C=EG' >/dev/null 2>&1 || true
          cd android
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          cd ../..
          rm -rf qurani-app/android/app/src/main/assets/pdf
          mkdir -p qurani-app/android/app/src/main/assets/pdf
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          out=Path('qurani-app/android/app/src/main/assets/pdf')
          for name,count in {'reading.pdf':4,'quran.pdf':604,'quran_index.pdf':2,'dua.pdf':1,'waqf_symbols.pdf':5,'furati_intro.pdf':4,'usul.pdf':18}.items():
              d=fitz.open(); [d.new_page(width=512.402,height=652.68) for _ in range(count)]; d.save(out/name); d.close()
          PY

      - name: Build 12 skeleton variants and extract byte overlays
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          python3 /tmp/quran-series-scripts/build_all_overlays.py . /tmp/master/final-delivery/Qurani-v1.0.1.apk ../qurani-series/apps.json ../series-output

      - name: Package finalization tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p series-output/tools/android-apk-tools/lib
          cp "$BT/apksigner" "$BT/zipalign" "$BT/aapt" "$BT/aapt2" series-output/tools/android-apk-tools/
          cp "$BT/lib/apksigner.jar" series-output/tools/android-apk-tools/lib/
          sha256sum series-output/tools/android-apk-tools/* series-output/tools/android-apk-tools/lib/apksigner.jar > series-output/tools/SHA256SUMS.txt

      - name: Validate overlay package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find series-output/overlays -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 12
          test -s series-output/build-report.json
          python3 - <<'PY'
          import json, pathlib
          r=json.load(open('series-output/build-report.json'))
          assert len(r)==12
          for x in r:
              assert x['badgingOk'] is True
              assert x['nativeLibsIdenticalToBase'] is True
              assert x['overlayReconstructsSkeleton'] is True
              assert x['versionCode']==1 and x['versionName']=='1.0.0'
              assert x['changedEntries']
          print('overlay validation passed for 12 apps')
          PY
          du -sh series-output

      - name: Upload compact overlays and Android tools
        uses: actions/upload-artifact@v4
        with:
          name: quran-series-v100-overlays
          path: series-output
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
