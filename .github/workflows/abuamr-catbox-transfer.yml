name: AbuAmr Public Transfer

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-catbox-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact latest skeleton and tools from private release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/abuamr-transfer
          gh release download abuamr-transfer-v100 --repo "$GITHUB_REPOSITORY" \
            -p 'AbuAmr-skeleton-v1.0.0.apk' \
            -p 'android-apk-tools-36.zip' \
            -D /tmp/abuamr-transfer
          echo '4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181  /tmp/abuamr-transfer/AbuAmr-skeleton-v1.0.0.apk' | sha256sum -c -
          echo '009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550  /tmp/abuamr-transfer/android-apk-tools-36.zip' | sha256sum -c -
      - name: Upload to tmpfiles.org
        shell: bash
        run: |
          set -euo pipefail
          APK_JSON="$(curl -fsS --retry 5 -F 'file=@/tmp/abuamr-transfer/AbuAmr-skeleton-v1.0.0.apk' https://tmpfiles.org/api/v1/upload)"
          TOOLS_JSON="$(curl -fsS --retry 5 -F 'file=@/tmp/abuamr-transfer/android-apk-tools-36.zip' https://tmpfiles.org/api/v1/upload)"
          echo "APK_RESPONSE=$APK_JSON"
          echo "TOOLS_RESPONSE=$TOOLS_JSON"
          APK_PAGE="$(printf '%s' "$APK_JSON" | jq -r '.data.url // empty')"
          TOOLS_PAGE="$(printf '%s' "$TOOLS_JSON" | jq -r '.data.url // empty')"
          test -n "$APK_PAGE"
          test -n "$TOOLS_PAGE"
          APK_URL="${APK_PAGE/https:\/\/tmpfiles.org\//https:\/\/tmpfiles.org\/dl\/}"
          TOOLS_URL="${TOOLS_PAGE/https:\/\/tmpfiles.org\//https:\/\/tmpfiles.org\/dl\/}"
          {
            echo "APK_URL=$APK_URL"
            echo "TOOLS_URL=$TOOLS_URL"
            echo 'APK_SHA256=4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181'
            echo 'TOOLS_SHA256=009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550'
          } | tee qurani-abuamr/public-transfer-urls.txt
      - name: Persist transfer URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-abuamr/public-transfer-urls.txt
          git commit -m 'ci: record accessible Abu Amr finalization URLs'
          git push origin HEAD:qurani-abuamr-v100
