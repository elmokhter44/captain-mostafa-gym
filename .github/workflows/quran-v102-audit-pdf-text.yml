name: Audit Quran PDF Text Layer
on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v102-audit-pdf-text.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect text layer from approved AbuAmr PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'gdown==5.2.0' 'PyMuPDF==1.26.4'
          python3 -m gdown '1BVoetPB5RCq5cSV1zxaxb0nj98B0faup' -O /tmp/source.pdf --quiet
          python3 - <<'PY'
          import fitz,re
          d=fitz.open('/tmp/source.pdf')
          print('PAGE_COUNT=',d.page_count)
          assert d.page_count==638
          total_chars=0
          nonempty=0
          for pno in range(5,609):
              t=d[pno-1].get_text('text')
              total_chars += len(t)
              nonempty += bool(t.strip())
          print('QURAN_TEXT_TOTAL_CHARS=',total_chars)
          print('QURAN_NONEMPTY_PAGES=',nonempty)
          for pno in [5,6,7,8,9,10,100,300,607,608]:
              t=d[pno-1].get_text('text')
              clean=' '.join(t.split())
              print(f'PAGE_{pno}_CHARS={len(t)}')
              print(f'PAGE_{pno}_TEXT={clean[:1800]}')
          d.close()
          PY
