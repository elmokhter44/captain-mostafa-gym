name: Export Qurani v1.0.3 APK

on:
  push:
    branches: [qurani-build-temp]
    paths:
      - '.github/workflows/export-v103-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v1.0.3 release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download qurani-v1.0.3-nafi-final --repo "$GITHUB_REPOSITORY" -p 'al-mushaf-al-muallam-nafi-v1.0.3.apk' -D out
          test -s out/al-mushaf-al-muallam-nafi-v1.0.3.apk
          sha256sum out/al-mushaf-al-muallam-nafi-v1.0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qurani-v103-export
          path: out/al-mushaf-al-muallam-nafi-v1.0.3.apk
          if-no-files-found: error
          retention-days: 2
