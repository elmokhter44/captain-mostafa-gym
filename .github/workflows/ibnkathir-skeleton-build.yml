name: IbnKathir Android Skeleton Build

on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths:
      - '.github/workflows/ibnkathir-skeleton-build.yml'
      - 'qurani-ibnkathir/ibnkathir-code.patch.gz.b64'
      - 'qurani-ibnkathir/approved-additions-tests.patch'
      - 'qurani-ibnkathir/approved-additions-code.patch'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALM_DISABLE_ANALYTICS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Restore verified Nafi master-template source only
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35100431525 --repo "$GITHUB_REPOSITORY" -n QURANI-FINAL-v1.0.1-R2-1 -D /tmp/master
          test -s /tmp/master/final-delivery/Qurani-source-v1.0.1.zip
          test -s /tmp/master/final-delivery/Qurani-v1.0.1.apk
          mkdir -p qurani-app
          unzip -q /tmp/master/final-delivery/Qurani-source-v1.0.1.zip -d qurani-app
          test -f qurani-app/package.json
          test -f qurani-app/android/app/build.gradle

      - name: Apply isolated Ibn Kathir base patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d qurani-ibnkathir/ibnkathir-code.patch.gz.b64 | gzip -dc > /tmp/ibnkathir.patch
          cd qurani-app
          patch --batch -p1 < /tmp/ibnkathir.patch
          grep -q 'applicationId "com.qurani.ibnkathir"' android/app/build.gradle
          test -f android/app/src/main/java/com/qurani/ibnkathir/MainActivity.kt
          test ! -f android/app/src/main/java/com/qurani/app/MainActivity.kt

      - name: Red test - approved additions must fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          patch --batch -p1 < ../qurani-ibnkathir/approved-additions-tests.patch
          set +e
          node --experimental-strip-types --test \
            __tests__/ibnkathirConfig.node.test.ts \
            __tests__/sections.node.test.ts \
            __tests__/navigationModels.node.test.ts \
            > ci/ibnkathir-approved-additions-red.txt 2>&1
          STATUS=$?
          set -e
          cat ci/ibnkathir-approved-additions-red.txt
          if [ "$STATUS" -eq 0 ]; then
            echo 'Expected approved-additions tests to fail before implementation' >&2
            exit 1
          fi
          grep -Eq '# fail [1-9][0-9]*' ci/ibnkathir-approved-additions-red.txt
          echo 'RED_PHASE_CONFIRMED=1'

      - name: Apply only the three approved Ibn Kathir additions
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          patch --batch -p1 < ../qurani-ibnkathir/approved-additions-code.patch
          grep -q "قراءة عبدالله بن كثير برواية البزي وقنبل" src/data/sections.ts
          grep -q "شرح أصول قراءة الامام بن كثير المكي برواية البزي وقنبل" src/data/sections.ts
          grep -q "المصحف المعلم بقراءة الامام بن كثير برواية البزي وقنبل" src/features/home/HomeScreen.tsx

      - name: Create tiny build-only PDF placeholders with approved page counts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyMuPDF==1.26.4'
          rm -rf qurani-app/android/app/src/main/assets/pdf
          mkdir -p qurani-app/android/app/src/main/assets/pdf
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          out=Path('qurani-app/android/app/src/main/assets/pdf')
          specs={
            'quran.pdf':604,
            'ibn_kathir_reading.pdf':4,
            'quran_index.pdf':2,
            'dua.pdf':1,
            'waqf_symbols.pdf':5,
            'furati_intro.pdf':4,
            'ibn_kathir_usul.pdf':12,
          }
          for name,count in specs.items():
              d=fitz.open()
              for _ in range(count): d.new_page(width=595.32,height=841.92)
              d.save(out/name,garbage=4,deflate=True)
              d.close()
              chk=fitz.open(out/name)
              assert chk.page_count==count,(name,chk.page_count,count)
              chk.close()
          print('BUILD_ONLY_PLACEHOLDERS_OK=1')
          PY

      - name: Green test - run all business tests and TypeScript check
        working-directory: qurani-app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --experimental-strip-types --test __tests__/*.node.test.ts | tee ci/ibnkathir-business-tests.txt
          grep -q '# fail 0' ci/ibnkathir-business-tests.txt
          grep -q '# tests 25' ci/ibnkathir-business-tests.txt
          cat > tsconfig.app.json <<'EOF'
          {"extends":"./tsconfig.json","exclude":["node_modules","android","__tests__","**/*.node.test.ts"]}
          EOF
          npx tsc --noEmit -p tsconfig.app.json | tee ci/ibnkathir-typecheck.txt
          echo 'GREEN_PHASE_CONFIRMED=1'

      - name: Install Android SDK 36, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' \
            'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Generate temporary build key and build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          cd android
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          rm -rf app/.cxx .cxx
          ./gradlew assembleRelease --stacktrace | tee ../ci/ibnkathir-gradle-build.txt

      - name: Verify skeleton identity and runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          APK='android/app/build/outputs/apk/release/app-release.apk'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee ci/ibnkathir-apk-badging.txt
          grep -q "package: name='com.qurani.ibnkathir' versionCode='1' versionName='1.0.0'" ci/ibnkathir-apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee ci/ibnkathir-skeleton-apksigner.txt
          unzip -l "$APK" > ci/ibnkathir-apk-contents.txt
          grep -q 'assets/pdf/ibn_kathir_reading.pdf' ci/ibnkathir-apk-contents.txt
          grep -q 'lib/arm64-v8a/librealm.so' ci/ibnkathir-apk-contents.txt
          grep -q 'lib/armeabi-v7a/librealm.so' ci/ibnkathir-apk-contents.txt
          grep -q 'lib/x86_64/librealm.so' ci/ibnkathir-apk-contents.txt
          cp "$APK" IbnKathir-skeleton-v1.0.0.apk
          sha256sum IbnKathir-skeleton-v1.0.0.apk | tee ci/ibnkathir-skeleton-sha256.txt

      - name: Package compact signing tools for local finalization
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          rm -rf /tmp/android-sign-tools
          mkdir -p /tmp/android-sign-tools/lib
          cp "$BT/apksigner" /tmp/android-sign-tools/
          cp "$BT/zipalign" /tmp/android-sign-tools/
          cp "$BT/lib/apksigner.jar" /tmp/android-sign-tools/lib/
          chmod +x /tmp/android-sign-tools/apksigner /tmp/android-sign-tools/zipalign
          cd /tmp
          zip -qr android-sign-tools-36.zip android-sign-tools
          sha256sum android-sign-tools-36.zip

      - name: Build compact verified delta and text transport payloads
        shell: bash
        run: |
          set -euo pipefail
          OLD=/tmp/master/final-delivery/Qurani-v1.0.1.apk
          NEW=qurani-app/IbnKathir-skeleton-v1.0.0.apk
          rm -rf /tmp/delta-old /tmp/delta-new /tmp/ibnkathir-delta
          mkdir -p /tmp/delta-old /tmp/delta-new /tmp/ibnkathir-delta/patches /tmp/ibnkathir-delta/raw
          unzip -q "$OLD" -d /tmp/delta-old
          unzip -q "$NEW" -d /tmp/delta-new
          rm -rf /tmp/delta-old/META-INF /tmp/delta-new/META-INF /tmp/delta-old/assets/pdf /tmp/delta-new/assets/pdf
          python3 -m pip install --quiet bsdiff4
          python3 - <<'PY'
          import hashlib, pathlib, bsdiff4, json, shutil
          old=pathlib.Path('/tmp/delta-old'); new=pathlib.Path('/tmp/delta-new'); out=pathlib.Path('/tmp/ibnkathir-delta')
          old_files={str(p.relative_to(old)):p for p in old.rglob('*') if p.is_file()}
          new_files={str(p.relative_to(new)):p for p in new.rglob('*') if p.is_file()}
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          changed=[]; added=[]
          for name,p in sorted(new_files.items()):
              if name not in old_files:
                  dst=out/'raw'/name; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dst)
                  added.append([name,p.stat().st_size,sha(p)])
              elif sha(p)!=sha(old_files[name]):
                  data=bsdiff4.diff(old_files[name].read_bytes(),p.read_bytes())
                  dst=out/'patches'/(name+'.bsdiff'); dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
                  changed.append([name,old_files[name].stat().st_size,p.stat().st_size,len(data),sha(p)])
          deleted=sorted(set(old_files)-set(new_files))
          (out/'deleted.txt').write_text('\n'.join(deleted)+'\n')
          (out/'manifest.json').write_text(json.dumps({'changed':changed,'added':added,'deleted':deleted},ensure_ascii=False,indent=2))
          PY
          tar -C /tmp/ibnkathir-delta -czf /tmp/ibnkathir-skeleton-delta.tar.gz .
          DELTA_SIZE="$(stat -c%s /tmp/ibnkathir-skeleton-delta.tar.gz)"
          TOOLS_SIZE="$(stat -c%s /tmp/android-sign-tools-36.zip)"
          {
            echo "SKELETON_SHA256=$(sha256sum "$NEW" | awk '{print $1}')"
            echo "DELTA_SIZE=$DELTA_SIZE"
            echo "DELTA_SHA256=$(sha256sum /tmp/ibnkathir-skeleton-delta.tar.gz | awk '{print $1}')"
            echo "TOOLS_SIZE=$TOOLS_SIZE"
            echo "TOOLS_SHA256=$(sha256sum /tmp/android-sign-tools-36.zip | awk '{print $1}')"
            echo '---MANIFEST---'
            cat /tmp/ibnkathir-delta/manifest.json
          } | tee qurani-ibnkathir/local-transport-report.txt
          test "$DELTA_SIZE" -le 15000000
          test "$TOOLS_SIZE" -le 15000000
          base64 -w 76 /tmp/ibnkathir-skeleton-delta.tar.gz > qurani-ibnkathir/skeleton-delta.tar.gz.b64
          base64 -w 76 /tmp/android-sign-tools-36.zip > qurani-ibnkathir/android-sign-tools-36.zip.b64

      - name: Publish persistent skeleton and tools as private release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG='ibnkathir-transfer-v100'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target qurani-ibnkathir-v100 \
              --title 'Ibn Kathir transfer' --notes 'Build transport assets for the isolated Ibn Kathir app.'
          gh release upload "$TAG" qurani-app/IbnKathir-skeleton-v1.0.0.apk /tmp/android-sign-tools-36.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload fresh temporary mirrors
        shell: bash
        run: |
          set -euo pipefail
          upload_tmpfiles() {
            local file="$1"
            local json url
            json="$(curl -fsS --retry 3 --retry-delay 2 -F "file=@${file}" https://tmpfiles.org/api/v1/upload)"
            url="$(python3 -c 'import json,sys; u=json.loads(sys.argv[1])["data"]["url"]; print(u.replace("https://tmpfiles.org/","https://tmpfiles.org/dl/",1))' "$json")"
            test -n "$url"
            printf '%s' "$url"
          }
          APK_URL="$(upload_tmpfiles qurani-app/IbnKathir-skeleton-v1.0.0.apk)"
          TOOLS_URL="$(upload_tmpfiles /tmp/android-sign-tools-36.zip)"
          {
            echo "APK_URL=$APK_URL"
            echo "TOOLS_URL=$TOOLS_URL"
            echo "APK_SHA256=$(sha256sum qurani-app/IbnKathir-skeleton-v1.0.0.apk | awk '{print $1}')"
            echo "TOOLS_SHA256=$(sha256sum /tmp/android-sign-tools-36.zip | awk '{print $1}')"
          } | tee qurani-ibnkathir/fresh-transfer-urls.txt

      - name: Persist transport payloads and fresh URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin qurani-ibnkathir-v100
          git add \
            qurani-ibnkathir/fresh-transfer-urls.txt \
            qurani-ibnkathir/local-transport-report.txt \
            qurani-ibnkathir/skeleton-delta.tar.gz.b64 \
            qurani-ibnkathir/android-sign-tools-36.zip.b64
          git commit -m 'ci: persist final Ibn Kathir local transport payloads' || true
          git push origin HEAD:qurani-ibnkathir-v100
