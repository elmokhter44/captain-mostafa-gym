name: IbnKathir Android Skeleton Build

on:
  push:
    branches: [qurani-ibnkathir-v100]
    paths:
      - '.github/workflows/ibnkathir-skeleton-build.yml'
      - 'qurani-ibnkathir/ibnkathir-code.patch.gz.b64'
      - 'qurani-ibnkathir/approved-additions-tests.patch'
      - 'qurani-ibnkathir/approved-additions-code.patch'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALM_DISABLE_ANALYTICS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: true

      - name: Restore verified Nafi master-template source only
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35100431525 --repo "$GITHUB_REPOSITORY" -n QURANI-FINAL-v1.0.1-R2-1 -D /tmp/master
          test -s /tmp/master/final-delivery/Qurani-source-v1.0.1.zip
          mkdir -p qurani-app
          unzip -q /tmp/master/final-delivery/Qurani-source-v1.0.1.zip -d qurani-app
          test -f qurani-app/package.json
          test -f qurani-app/android/app/build.gradle

      - name: Apply isolated Ibn Kathir base patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d qurani-ibnkathir/ibnkathir-code.patch.gz.b64 | gzip -dc > /tmp/ibnkathir.patch
          cd qurani-app
          patch --batch -p1 < /tmp/ibnkathir.patch
          grep -q 'applicationId "com.qurani.ibnkathir"' android/app/build.gradle
          test -f android/app/src/main/java/com/qurani/ibnkathir/MainActivity.kt
          test ! -f android/app/src/main/java/com/qurani/app/MainActivity.kt

      - name: Red test - approved additions must fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          patch --batch -p1 < ../qurani-ibnkathir/approved-additions-tests.patch
          set +e
          node --experimental-strip-types --test \
            __tests__/ibnkathirConfig.node.test.ts \
            __tests__/sections.node.test.ts \
            __tests__/navigationModels.node.test.ts \
            > ci/ibnkathir-approved-additions-red.txt 2>&1
          STATUS=$?
          set -e
          cat ci/ibnkathir-approved-additions-red.txt
          if [ "$STATUS" -eq 0 ]; then
            echo 'Expected approved-additions tests to fail before implementation' >&2
            exit 1
          fi
          grep -Eq '# fail [1-9][0-9]*' ci/ibnkathir-approved-additions-red.txt
          echo 'RED_PHASE_CONFIRMED=1'

      - name: Apply only the three approved Ibn Kathir additions
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          patch --batch -p1 < ../qurani-ibnkathir/approved-additions-code.patch
          grep -q "قراءة عبدالله بن كثير برواية البزي وقنبل" src/data/sections.ts
          grep -q "شرح أصول قراءة الامام بن كثير المكي برواية البزي وقنبل" src/data/sections.ts
          grep -q "المصحف المعلم بقراءة الامام بن كثير برواية البزي وقنبل" src/features/home/HomeScreen.tsx

      - name: Create tiny build-only PDF placeholders with approved page counts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyMuPDF==1.26.4'
          rm -rf qurani-app/android/app/src/main/assets/pdf
          mkdir -p qurani-app/android/app/src/main/assets/pdf
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          out=Path('qurani-app/android/app/src/main/assets/pdf')
          specs={
            'quran.pdf':604,
            'ibn_kathir_reading.pdf':4,
            'quran_index.pdf':2,
            'dua.pdf':1,
            'waqf_symbols.pdf':5,
            'furati_intro.pdf':4,
            'ibn_kathir_usul.pdf':12,
          }
          for name,count in specs.items():
              d=fitz.open()
              for _ in range(count): d.new_page(width=595.32,height=841.92)
              d.save(out/name,garbage=4,deflate=True)
              d.close()
              chk=fitz.open(out/name)
              assert chk.page_count==count,(name,chk.page_count,count)
              chk.close()
          print('BUILD_ONLY_PLACEHOLDERS_OK=1')
          PY

      - name: Green test - run all business tests and TypeScript check
        working-directory: qurani-app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --experimental-strip-types --test __tests__/*.node.test.ts | tee ci/ibnkathir-business-tests.txt
          grep -q '# fail 0' ci/ibnkathir-business-tests.txt
          grep -q '# tests 25' ci/ibnkathir-business-tests.txt
          cat > tsconfig.app.json <<'EOF'
          {"extends":"./tsconfig.json","exclude":["node_modules","android","__tests__","**/*.node.test.ts"]}
          EOF
          npx tsc --noEmit -p tsconfig.app.json | tee ci/ibnkathir-typecheck.txt
          echo 'GREEN_PHASE_CONFIRMED=1'

      - name: Install Android SDK 36, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' \
            'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Generate temporary build key and build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1
          cd android
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          rm -rf app/.cxx .cxx
          ./gradlew clean assembleRelease --stacktrace | tee ../ci/ibnkathir-gradle-build.txt

      - name: Verify skeleton identity and runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          APK='android/app/build/outputs/apk/release/app-release.apk'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee ci/ibnkathir-apk-badging.txt
          grep -q "package: name='com.qurani.ibnkathir' versionCode='1' versionName='1.0.0'" ci/ibnkathir-apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee ci/ibnkathir-skeleton-apksigner.txt
          unzip -l "$APK" > ci/ibnkathir-apk-contents.txt
          grep -q 'assets/pdf/ibn_kathir_reading.pdf' ci/ibnkathir-apk-contents.txt
          grep -q 'lib/arm64-v8a/librealm.so' ci/ibnkathir-apk-contents.txt
          grep -q 'lib/armeabi-v7a/librealm.so' ci/ibnkathir-apk-contents.txt
          grep -q 'lib/x86_64/librealm.so' ci/ibnkathir-apk-contents.txt
          cp "$APK" IbnKathir-skeleton-v1.0.0.apk
          sha256sum IbnKathir-skeleton-v1.0.0.apk | tee ci/ibnkathir-skeleton-sha256.txt

      - name: Package minimal Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p /tmp/android-build-tools-36/lib
          cp "$BT/apksigner" /tmp/android-build-tools-36/
          cp "$BT/zipalign" /tmp/android-build-tools-36/
          cp "$BT/aapt" /tmp/android-build-tools-36/
          cp "$BT/lib/apksigner.jar" /tmp/android-build-tools-36/lib/
          chmod +x /tmp/android-build-tools-36/apksigner /tmp/android-build-tools-36/zipalign /tmp/android-build-tools-36/aapt
          cd /tmp
          zip -qr android-build-tools-36-minimal.zip android-build-tools-36
          sha256sum android-build-tools-36-minimal.zip

      - name: Stage local-finalization payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ibnkathir-local-finalization
          cp qurani-app/IbnKathir-skeleton-v1.0.0.apk /tmp/ibnkathir-local-finalization/
          cp /tmp/android-build-tools-36-minimal.zip /tmp/ibnkathir-local-finalization/
          cp qurani-app/ci/ibnkathir-*.txt /tmp/ibnkathir-local-finalization/

      - name: Upload local-finalization payload
        uses: actions/upload-artifact@v4
        with:
          name: ibnkathir-local-finalization-v1.0.0
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
          path: /tmp/ibnkathir-local-finalization/
