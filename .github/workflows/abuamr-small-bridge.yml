name: AbuAmr Small Local Bridge

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-small-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compact bridge inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s qurani-abuamr/local-binaries/abuamr-overlay.zip
          test -s qurani-abuamr/local-binaries/android-sign-tools-36.zip
          sha256sum qurani-abuamr/local-binaries/abuamr-overlay.zip qurani-abuamr/local-binaries/android-sign-tools-36.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ABUAMR-SMALL-LOCAL-BRIDGE
          path: |
            qurani-abuamr/local-binaries/abuamr-overlay.zip
            qurani-abuamr/local-binaries/android-sign-tools-36.zip
            qurani-abuamr/local-binaries/manifest.json
          compression-level: 0
          retention-days: 1
