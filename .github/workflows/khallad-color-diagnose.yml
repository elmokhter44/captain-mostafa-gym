name: Khallad Color Diagnose
on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/khallad-color-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Khallad-specific build logic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kd
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/kd/apply.py
          base64 -d qurani-series/build_all_overlays.py.gz.b64 | gzip -dc > /tmp/kd/build.py
          echo '=== COMMON ==='
          grep -ni -C 8 -E 'khallad|خلاد|blue|2196|0B5E|1565|1976|2563|2962' /tmp/kd/apply.py || true
          echo '=== OVERLAY BUILDER ==='
          grep -ni -C 12 -E 'khallad|خلاد|blue|2196|0B5E|1565|1976|2563|2962' /tmp/kd/build.py || true
          echo '=== APP-SPEC KHALLAD ==='
          grep -Rni -C 5 -E 'khallad|خلاد|أزرق|blue' qurani-series qurani-abuamr 2>/dev/null | head -300 || true
