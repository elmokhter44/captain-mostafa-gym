name: Khallad Color Diagnose
on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/khallad-color-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Khallad color constants with Abu Amr and builder source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kd && mkdir -p /tmp/kd/payload
          cat .series-generated/parts/payload.part-* > /tmp/kd/payload.tar.gz
          tar -xzf /tmp/kd/payload.tar.gz -C /tmp/kd/payload
          python3 - <<'PY'
          import json,zipfile,re
          from pathlib import Path
          root=Path('/tmp/kd/payload'); report=json.load(open(root/'build-report.json'))
          def bundle(slug):
              app=[x for x in report if x['slug']==slug][0]
              ov=root/'overlays'/slug/'files'; repl={p.relative_to(ov).as_posix():p.read_bytes() for p in ov.rglob('*') if p.is_file()}
              out=Path('/tmp/kd')/(slug+'.apk')
              with zipfile.ZipFile(root/'base.apk') as zin, zipfile.ZipFile(out,'w') as zout:
                  for info in zin.infolist():
                      if info.filename.startswith('META-INF/'): continue
                      zout.writestr(info,repl.get(info.filename,zin.read(info.filename)))
              with zipfile.ZipFile(out) as z: return z.read('assets/index.android.bundle')
          def colors(b): return set(re.findall(rb'#[0-9A-Fa-f]{6,8}',b))
          kb=bundle('khalladhamza'); ab=bundle('abuamr'); kc=colors(kb); ac=colors(ab)
          print('KHALLAD_ONLY_COLORS=',sorted(x.decode() for x in kc-ac))
          print('ABUAMR_ONLY_COLORS=',sorted(x.decode() for x in ac-kc))
          print('KHALLAD_HAS_2196F3_PREFIX=',b'#2196F3' in kb)
          print('KHALLAD_BUNDLE_SHA256=',__import__('hashlib').sha256(kb).hexdigest())
          print('ABUAMR_BUNDLE_SHA256=',__import__('hashlib').sha256(ab).hexdigest())
          PY
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/kd/apply.py
          echo '=== KHALLAD BUILDER SOURCE ==='
          grep -ni -C 5 -E 'khallad|خلاد|blue|2196|0B5E|1565|1976' /tmp/kd/apply.py || true
