name: Khallad Color Diagnose
on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/khallad-color-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct master and print theme palette
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kd qurani-app && mkdir -p /tmp/kd qurani-app
          cat qurani-ci/text/part-* > /tmp/kd/src.b64
          base64 -d /tmp/kd/src.b64 > /tmp/kd/src.tar.gz
          tar -xzf /tmp/kd/src.tar.gz -C qurani-app
          cat qurani-v101/overlay/part-* > /tmp/kd/overlay.b64
          base64 -d /tmp/kd/overlay.b64 > /tmp/kd/overlay.tar.gz
          tar -xzf /tmp/kd/overlay.tar.gz -C qurani-app
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/kd/apply.py
          base64 -d qurani-series/build_all_overlays.py.gz.b64 | gzip -dc > /tmp/kd/build.py
          cd qurani-app
          python3 /tmp/kd/apply.py .
          echo '=== THEME ==='
          cat src/app/theme.ts
          echo '=== HOME GENERATED GREEN LITERALS ==='
          grep -nE 'emerald|#[0-9A-Fa-f]{6,8}' src/features/home/HomeScreen.tsx || true
          echo '=== OTHER EMERALD USES ==='
          grep -Rni -E 'COLORS\.emerald|#[0-9A-Fa-f]{6,8}' src/features src/app | head -500 || true
