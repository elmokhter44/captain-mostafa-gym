name: Qurani v1.0.4 PDF Render Fix

on:
  push:
    branches: [qurani-build-temp]
    paths:
      - '.github/workflows/qurani-v104-render-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      REALM_DISABLE_ANALYTICS: '1'
      GH_TOKEN: ${{ github.token }}
      FINAL_NAME: 'al-mushaf-al-muallam-nafi-v1.0.4.apk'
      RELEASE_TAG: 'qurani-v1.0.4-nafi-render-fix'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: true

      - name: Restore verified source and release signing key
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35100431525 --repo "$GITHUB_REPOSITORY" -n QURANI-FINAL-v1.0.1-R2-1 -D /tmp/v101
          test -s /tmp/v101/final-delivery/Qurani-source-v1.0.1.zip
          test -s /tmp/v101/final-delivery/Qurani-signing-backup-v1.0.1.zip
          mkdir -p qurani-app /tmp/signing
          unzip -q /tmp/v101/final-delivery/Qurani-source-v1.0.1.zip -d qurani-app
          unzip -q /tmp/v101/final-delivery/Qurani-signing-backup-v1.0.1.zip -d /tmp/signing
          cp /tmp/signing/qurani-release.keystore qurani-app/android/app/qurani-release.keystore
          STORE_PASSWORD="$(sed -n 's/^Store password: //p' /tmp/signing/signing-credentials.txt)"
          KEY_PASSWORD="$(sed -n 's/^Key password: //p' /tmp/signing/signing-credentials.txt)"
          cat > qurani-app/android/keystore.properties <<EOF
          storeFile=qurani-release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=qurani-release
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 qurani-app/android/keystore.properties qurani-app/android/app/qurani-release.keystore
          gh release download qurani-v1.0.3-nafi-final --repo "$GITHUB_REPOSITORY" -p '*.apk' -D /tmp/v103
          test -s /tmp/v103/al-mushaf-al-muallam-nafi-v1.0.3.apk

      - name: Apply only approved v1.0.4 changes
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          npm version 1.0.4 --no-git-tag-version --allow-same-version
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing expected text in {path}: {old[:100]}')
              p.write_text(s.replace(old,new))
          replace('android/app/build.gradle','versionCode 2\n        versionName "1.0.1"','versionCode 5\n        versionName "1.0.4"')
          Path('android/app/src/main/res/values/strings.xml').write_text('<resources><string name="app_name">المصحف المعلم\\nبقراءة الامام نافع</string></resources>\n')
          Path('app.json').write_text('{"name":"Qurani","displayName":"المصحف المعلم بقراءة الامام نافع"}\n')
          replace('src/data/sections.ts',"{id: 'warsh-summary', title: 'شرح مختصر أصول الإمام ورش', subtitle: 'ملخص مبسط لأصول القراءة', sourceStartPage: 6, sourceEndPage: 9, assetName: 'warsh_summary.pdf'},","{id: 'warsh-summary', title: 'شرح مختصر أصول الإمام ورش', subtitle: 'ملخص مبسط لأصول القراءة', sourceStartPage: 6, sourceEndPage: 9, assetName: 'warsh_summary_v104.pdf'},")
          replace('src/data/sections.ts',"{id: 'warsh-usul', title: 'أصول قراءة الإمام نافع برواية ورش', subtitle: 'الأصول كما وردت في المصدر',","{id: 'warsh-usul', title: 'أصول قراءة الإمام نافع برواية ورش', subtitle: 'الأصول كما وردت في مصاحف السلسلة الفراتية',")
          replace('src/data/sections.ts',"{id: 'qalun-usul', title: 'أصول قراءة الإمام نافع برواية قالون', subtitle: 'يشمل الصفحات 639 إلى 649',","{id: 'qalun-usul', title: 'أصول قراءة الإمام نافع برواية قالون', subtitle: 'الأصول كما وردت في مصاحف السلسلة الفراتية',")
          replace('src/data/sections.ts',"{id: 'handwritten', title: 'أصول وفروش ورش وقالون بخط اليد', subtitle: 'أصول وفروش قراءة الإمام نافع المدني',","{id: 'handwritten', title: 'أصول وفروش قراءة الامام نافع المدني برواية (ورش وقالون) بخط الايد', subtitle: '',")
          p=Path('src/features/home/SectionCard.tsx'); s=p.read_text()
          s=s.replace("export function SectionCard({section, width, onPress}: {section: SectionSeed; width: number; onPress: () => void}): React.JSX.Element {\n  return (","export function SectionCard({section, width, onPress}: {section: SectionSeed; width: number; onPress: () => void}): React.JSX.Element {\n  const isHandwritten = section.id === 'handwritten';\n  return (")
          s=s.replace("style={({pressed}) => [styles.card, {width}, pressed && styles.pressed]}","style={({pressed}) => [styles.card, {width}, isHandwritten && styles.handwrittenCard, pressed && styles.pressed]}")
          s=s.replace("<Text style={styles.title}>{section.title}</Text>\n        <Text style={styles.subtitle} numberOfLines={2}>{section.subtitle}</Text>","<Text style={[styles.title, isHandwritten && styles.handwrittenTitle]}>{section.title}</Text>\n        {section.subtitle ? <Text style={styles.subtitle} numberOfLines={2}>{section.subtitle}</Text> : null}")
          s=s.replace("  pressed: {opacity: 0.82","  handwrittenCard: {minHeight: 168},\n  pressed: {opacity: 0.82")
          s=s.replace("  subtitle: {fontSize: 12","  handwrittenTitle: {fontSize: 17, lineHeight: 27},\n  subtitle: {fontSize: 12")
          p.write_text(s)
          p=Path('src/features/index/IndexScreen.tsx'); s=p.read_text()
          s=s.replace("import React, {useMemo} from 'react';","import React, {useMemo, useState} from 'react';")
          s=s.replace("import {PdfPage} from '../reader/PdfPage';","import {ZoomablePdfPage} from '../reader/ZoomablePdfPage';\nimport {pageWidthForScreen} from '../reader/zoomModel';")
          s=s.replace("  const {width: screenWidth} = useWindowDimensions();\n  const pageWidth = Math.max(280, screenWidth - SPACING.md * 2);","  const {width: screenWidth} = useWindowDimensions();\n  const [pageZoomed, setPageZoomed] = useState(false);\n  const pageWidth = pageWidthForScreen(screenWidth);")
          s=s.replace('<PdfPage assetName="quran_index.pdf" pageIndex={index} width={pageWidth} overlay={overlaysFor(item)} />','<ZoomablePdfPage assetName="quran_index.pdf" pageIndex={index} width={pageWidth} overlay={overlaysFor(item)} onZoomStateChange={setPageZoomed} />')
          s=s.replace("        windowSize={4}\n        contentContainerStyle","        windowSize={4}\n        scrollEnabled={!pageZoomed}\n        contentContainerStyle")
          p.write_text(s)
          PY

      - name: Create renderer-safe real PDF page 9
        shell: bash
        run: |
          set -euo pipefail
          test -s .ci-assets/q9.jpg
          python3 -m venv /tmp/pdfvenv
          /tmp/pdfvenv/bin/pip install --quiet 'PyMuPDF==1.26.4' 'Pillow==11.3.0'
          /tmp/pdfvenv/bin/python - <<'PY'
          import fitz, hashlib
          from pathlib import Path
          from PIL import Image
          src=Path('qurani-app/android/app/src/main/assets/pdf/warsh_summary.pdf')
          dst=Path('qurani-app/android/app/src/main/assets/pdf/warsh_summary_v104.pdf')
          source_img=Path('.ci-assets/q9.jpg')
          work=Path('/tmp/q9-v104'); work.mkdir(exist_ok=True)
          baseline=work/'q9-baseline-rgb.jpg'; pillow_pdf=work/'q9-device-rgb.pdf'; a4_page=work/'q9-device-rgb-a4.pdf'
          with Image.open(source_img) as im:
              assert im.width >= 1000 and im.height >= 1400, (im.width, im.height)
              im.convert('RGB').save(baseline,'JPEG',quality=95,subsampling=0,progressive=False,optimize=False,icc_profile=None)
          with Image.open(baseline) as im: im.save(pillow_pdf,'PDF',resolution=127.5,quality=95,subsampling=0)
          old=fitz.open(src); assert old.page_count==4; rect=old[3].rect
          before=[hashlib.sha256(old[i].get_pixmap(alpha=False).samples).hexdigest() for i in range(3)]
          source=fitz.open(pillow_pdf); single=fitz.open(); p=single.new_page(width=rect.width,height=rect.height)
          p.show_pdf_page(p.rect,source,0,keep_proportion=False); single.save(a4_page,garbage=4,deflate=True); single.close(); source.close()
          safe=fitz.open(a4_page); meta=safe[0].get_images(full=True); assert len(meta)==1 and meta[0][5]=='DeviceRGB' and meta[0][8]=='DCTDecode', meta
          out=fitz.open(); out.insert_pdf(old,from_page=0,to_page=2); out.insert_pdf(safe,from_page=0,to_page=0); out.save(dst,garbage=4,deflate=True); out.close(); safe.close()
          chk=fitz.open(dst); assert chk.page_count==4
          after=[hashlib.sha256(chk[i].get_pixmap(alpha=False).samples).hexdigest() for i in range(3)]; assert before==after
          imeta=chk[3].get_images(full=True); assert len(imeta)==1 and imeta[0][5]=='DeviceRGB' and imeta[0][8]=='DCTDecode', imeta
          chk[3].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save('/tmp/page9-v104-reference.png')
          chk.close(); old.close(); print('RENDERER_SAFE_REAL_PDF_PAGE_9=1')
          PY
          file /tmp/q9-v104/q9-baseline-rgb.jpg | grep -q 'baseline'

      - name: Add Android PdfRenderer regression test
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle'); s=p.read_text()
          s=s.replace('targetSdkVersion rootProject.ext.targetSdkVersion\n        versionCode 5','targetSdkVersion rootProject.ext.targetSdkVersion\n        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"\n        versionCode 5')
          s=s.replace('dependencies {\n    implementation("com.facebook.react:react-android")','dependencies {\n    androidTestImplementation("androidx.test:runner:1.6.2")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")\n    androidTestImplementation("junit:junit:4.13.2")\n    implementation("com.facebook.react:react-android")')
          p.write_text(s)
          test=Path('android/app/src/androidTest/java/com/qurani/app/PdfPageRenderTest.kt'); test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text(r'''package com.qurani.app
import android.graphics.Bitmap
import android.graphics.Color
import android.graphics.pdf.PdfRenderer
import android.os.ParcelFileDescriptor
import androidx.test.ext.junit.runners.AndroidJUnit4
import androidx.test.platform.app.InstrumentationRegistry
import org.junit.Assert.assertTrue
import org.junit.Test
import org.junit.runner.RunWith
import java.io.File
import java.io.FileOutputStream
import kotlin.math.abs
@RunWith(AndroidJUnit4::class)
class PdfPageRenderTest {
  @Test fun replacementPageRendersAsContentNotGrayPlaceholder() {
    val context=InstrumentationRegistry.getInstrumentation().targetContext
    val file=File(context.cacheDir,"warsh_summary_v104-test.pdf")
    context.assets.open("pdf/warsh_summary_v104.pdf").use { input -> FileOutputStream(file).use { output -> input.copyTo(output) } }
    val fd=ParcelFileDescriptor.open(file,ParcelFileDescriptor.MODE_READ_ONLY); val renderer=PdfRenderer(fd); val page=renderer.openPage(3)
    val width=900; val height=(page.height*(width.toFloat()/page.width)).toInt().coerceAtLeast(1)
    val bitmap=Bitmap.createBitmap(width,height,Bitmap.Config.ARGB_8888); bitmap.eraseColor(Color.WHITE)
    page.render(bitmap,null,null,PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY); page.close(); renderer.close(); fd.close()
    var sumR=0L; var sumG=0L; var sumB=0L; var count=0L; var gray128=0L; var dark=0L
    var y=height/2
    while(y<height){ var x=0; while(x<width){ val c=bitmap.getPixel(x,y); val r=Color.red(c); val g=Color.green(c); val b=Color.blue(c); sumR+=r;sumG+=g;sumB+=b;count++; if(abs(r-128)<10&&abs(g-128)<10&&abs(b-128)<10)gray128++; if((r+g+b)/3<90)dark++; x+=6 }; y+=6 }
    bitmap.recycle(); val meanR=sumR.toDouble()/count; val meanG=sumG.toDouble()/count; val meanB=sumB.toDouble()/count; val grayFraction=gray128.toDouble()/count; val darkFraction=dark.toDouble()/count
    assertTrue("paper mean $meanR,$meanG,$meanB",meanR>190&&meanG>175&&meanB>155)
    assertTrue("gray placeholder $grayFraction",grayFraction<0.10)
    assertTrue("real dark text $darkFraction",darkFraction>0.01)
  }
}
''')
          PY
          keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1

      - name: Tests and typecheck
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/data/sections.ts').read_text(); assert "assetName: 'warsh_summary_v104.pdf'" in s; assert s.count('الأصول كما وردت في مصاحف السلسلة الفراتية')==2; assert "أصول وفروش قراءة الامام نافع المدني برواية (ورش وقالون) بخط الايد" in s
          idx=Path('src/features/index/IndexScreen.tsx').read_text(); assert 'ZoomablePdfPage' in idx and 'scrollEnabled={!pageZoomed}' in idx
          gradle=Path('android/app/build.gradle').read_text(); assert 'versionCode 5' in gradle and 'versionName "1.0.4"' in gradle
          PY
          npm install --no-audit --no-fund
          cat > __tests__/v104Regression.node.test.ts <<'EOF'
          import test from 'node:test'; import assert from 'node:assert/strict'; import {SECTIONS} from '../src/data/sections.ts';
          test('warsh summary uses fresh v104 PDF asset',()=>{ const section=SECTIONS.find(item=>item.id==='warsh-summary'); assert.equal(section?.assetName,'warsh_summary_v104.pdf'); });
          EOF
          node --experimental-strip-types --test __tests__/*.node.test.ts | tee ci/business-tests-v104.txt
          grep -q '# fail 0' ci/business-tests-v104.txt
          cat > tsconfig.app.json <<'EOF'
          {"extends":"./tsconfig.json","exclude":["node_modules","android","__tests__","**/*.node.test.ts"]}
          EOF
          npx tsc --noEmit -p tsconfig.app.json

      - name: Build and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;27.1.12297006' 'cmake;3.22.1'
          rm -rf android/app/.cxx android/.cxx
          cd android && chmod +x gradlew && ./gradlew clean assembleRelease --stacktrace && cd ..
          APK=android/app/build/outputs/apk/release/app-release.apk; AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"; APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"; "$AAPT" dump badging "$APK" | tee ci/apk-badging-v104.txt; grep -q "package: name='com.qurani.app' versionCode='5' versionName='1.0.4'" ci/apk-badging-v104.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee ci/apksigner-v104.txt; "$APKSIGNER" verify --print-certs /tmp/v103/al-mushaf-al-muallam-nafi-v1.0.3.apk > /tmp/oldcert.txt
          test "$(grep 'Signer #1 certificate SHA-256 digest:' /tmp/oldcert.txt | sed 's/.*: //')" = "$(grep 'Signer #1 certificate SHA-256 digest:' ci/apksigner-v104.txt | sed 's/.*: //')"
          unzip -l "$APK" | grep -q 'assets/pdf/warsh_summary_v104.pdf'; unzip -p "$APK" assets/pdf/warsh_summary_v104.pdf > /tmp/warsh_summary_v104_from_apk.pdf
          /tmp/pdfvenv/bin/python - <<'PY'
          import fitz
          p=fitz.open('/tmp/warsh_summary_v104_from_apk.pdf'); assert p.page_count==4; im=p[3].get_images(full=True); assert len(im)==1 and im[0][5]=='DeviceRGB' and im[0][8]=='DCTDecode', im; print('APK_PAGE9_DEVICE_RGB=1')
          PY
          mkdir -p /tmp/final; cp "$APK" "/tmp/final/$FINAL_NAME"; sha256sum "/tmp/final/$FINAL_NAME" | tee ci/apk-sha256-v104.txt

      - name: Free space for emulator
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake /opt/ghc /usr/share/dotnet || true
          rm -rf ~/.gradle/caches || true
          df -h /

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: Android 15 PdfRenderer regression and update test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            cd qurani-app/android
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb uninstall com.qurani.app || true
            adb install /tmp/v103/al-mushaf-al-muallam-nafi-v1.0.3.apk
            adb shell am start -W -n com.qurani.app/.MainActivity
            sleep 5
            adb shell am force-stop com.qurani.app
            adb install -r "/tmp/final/$FINAL_NAME"
            adb logcat -c
            adb shell am start -W -n com.qurani.app/.MainActivity
            sleep 10
            test -n "$(adb shell pidof com.qurani.app | tr -d '\r')"
            adb shell dumpsys package com.qurani.app | grep -q 'versionName=1.0.4'
            adb shell dumpsys package com.qurani.app | grep -q 'versionCode=5'
            adb shell am force-stop com.qurani.app
            adb shell am start -W -n com.qurani.app/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.qurani.app | tr -d '\r')"
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*com.qurani.app|Process: com.qurani.app.*FATAL EXCEPTION'

      - name: Publish APK as GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" "/tmp/final/$FINAL_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'المصحف المعلم بقراءة الامام نافع v1.0.4' --notes 'Fixes Android PdfRenderer compatibility for corrected source PDF page 9. Direct Android PdfRenderer regression test plus update install, launch and relaunch passed.'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
