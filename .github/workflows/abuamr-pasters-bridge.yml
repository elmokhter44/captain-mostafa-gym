name: AbuAmr PasteRS Local Bridge

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-pasters-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish compact binaries as small base64 text pastes
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY='qurani-abuamr/local-binaries/abuamr-overlay.zip'
          TOOLS='qurani-abuamr/local-binaries/android-sign-tools-36.zip'
          test -s "$OVERLAY" && test -s "$TOOLS"
          rm -rf /tmp/prs && mkdir -p /tmp/prs/overlay /tmp/prs/tools
          base64 -w 0 "$OVERLAY" | split -b 500000 -d -a 2 --additional-suffix=.txt - /tmp/prs/overlay/part-
          base64 -w 0 "$TOOLS"   | split -b 500000 -d -a 2 --additional-suffix=.txt - /tmp/prs/tools/part-
          upload_one() {
            local f="$1" tag="$2" body hdr code u
            body="/tmp/${tag}.body"; hdr="/tmp/${tag}.hdr"
            code="$(curl -sS --retry 8 --retry-delay 3 --retry-all-errors -D "$hdr" -o "$body" -w '%{http_code}' --data-binary "@$f" https://paste.rs/)"
            if [ "$code" != 201 ] && [ "$code" != 200 ]; then
              echo "$tag HTTP=$code" >&2; cat "$body" >&2 || true; return 1
            fi
            u="$(tr -d '\r\n' < "$body")"
            if [ -z "$u" ]; then
              u="$(tr -d '\r' < "$hdr" | awk 'BEGIN{IGNORECASE=1} /^location: /{sub(/^location: /,""); print; exit}')"
            fi
            case "$u" in https://paste.rs/*) printf '%s' "$u";; *) echo "bad URL $u" >&2; return 1;; esac
          }
          : > /tmp/overlay.urls
          : > /tmp/tools.urls
          i=0
          for f in /tmp/prs/overlay/part-*.txt; do
            u="$(upload_one "$f" "overlay-$i")"; echo "$u" >> /tmp/overlay.urls; i=$((i+1)); sleep 2
          done
          i=0
          for f in /tmp/prs/tools/part-*.txt; do
            u="$(upload_one "$f" "tools-$i")"; echo "$u" >> /tmp/tools.urls; i=$((i+1)); sleep 2
          done
          {
            echo "OVERLAY_SHA256=$(sha256sum "$OVERLAY" | awk '{print $1}')"
            echo "TOOLS_SHA256=$(sha256sum "$TOOLS" | awk '{print $1}')"
            echo "OVERLAY_PARTS=$(wc -l < /tmp/overlay.urls)"
            echo "TOOLS_PARTS=$(wc -l < /tmp/tools.urls)"
            echo '---OVERLAY_URLS---'
            cat /tmp/overlay.urls
            echo '---TOOLS_URLS---'
            cat /tmp/tools.urls
          } | tee qurani-abuamr/pasters-bridge.txt
      - name: Persist paste URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-abuamr/pasters-bridge.txt
          git commit -m 'ci: record chunked Abu Amr paste.rs bridge URLs'
          git pull --rebase origin qurani-abuamr-v100
          git push origin HEAD:qurani-abuamr-v100
# retry 2026-09-19
