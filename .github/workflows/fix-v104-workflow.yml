name: Fix Qurani v1.0.4 workflow typo

on:
  push:
    branches: [qurani-build-temp]
    paths:
      - '.github/workflows/fix-v104-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qurani-build-temp
          fetch-depth: 0
      - name: Fix missing JSX brace and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/qurani-v104-verified-release.yml')
          s=p.read_text()
          bad='s=s.replace("style={({pressed}) => [styles.card, {width}, pressed && styles.pressed]}","style={({pressed}) => [styles.card, {width}, isHandwritten && styles.handwrittenCard, pressed && styles.pressed]")'
          good='s=s.replace("style={({pressed}) => [styles.card, {width}, pressed && styles.pressed]}","style={({pressed}) => [styles.card, {width}, isHandwritten && styles.handwrittenCard, pressed && styles.pressed]}")'
          if bad not in s:
              raise SystemExit('expected bad replacement not found')
          p.write_text(s.replace(bad,good))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/qurani-v104-verified-release.yml
          git commit -m 'ci: fix v1.0.4 JSX replacement'
          git push origin HEAD:qurani-build-temp
