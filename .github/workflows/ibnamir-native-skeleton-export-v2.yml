name: IbnAmir Native Skeleton Export V2
on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-native-skeleton-export-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate compact app shell from the reviewed exporter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          wf=yaml.safe_load(Path('.github/workflows/ibnamir-native-skeleton-export.yml').read_text())
          steps=wf['jobs']['build']['steps']
          st=next(x for x in steps if x.get('name','').startswith('Create small native Android shell'))
          s=st['run']
          a="const {SURAHS}=await import('./src/data/surahs.ts');"
          b="const {VERSE_INDEX}=await import('./src/data/verses.generated.ts');"
          assert a in s and b in s and 'cd /tmp/qsrc' in s
          s=s.replace(a,"const {SURAH_INDEX:SURAHS}=await import('./src/data/surahs.ts');")
          inject="""cd /tmp/qsrc
          cp \"$GITHUB_WORKSPACE/qurani-v101/generate-verse-index.py\" scripts/generate-verse-index.py
          curl -fsSL --retry 5 --retry-all-errors 'https://api.alquran.cloud/v1/quran/quran-uthmani' -o /tmp/quran-uthmani.json
          python3 scripts/generate-verse-index.py /tmp/quran-uthmani.json src/data/verses.generated.ts | tee /tmp/verse-index-report.txt
          grep -q 'Generated 6236 ayahs' /tmp/verse-index-report.txt
          grep -q 'all 114 surah start pages match' /tmp/verse-index-report.txt"""
          s=s.replace('cd /tmp/qsrc',inject,1)
          Path('/tmp/generate.sh').write_text(s)
          PY
          bash /tmp/generate.sh
      - name: Verify exact approved identity sections mapping and search corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/ibnamir-native')
          main=(root/'app/src/main/java/com/qurani/ibnamr/MainActivity.java').read_text()
          sec=(root/'app/src/main/java/com/qurani/ibnamr/Section.java').read_text()
          grad=(root/'app/build.gradle').read_text()
          man=(root/'app/src/main/AndroidManifest.xml').read_text()
          exact='المصحف المعلم بقراءة الإمام بن عامر الشامي برواية هشام وبالحاشية ما خالفه فيه بن ذكوان'
          assert exact in main and exact in man
          assert "applicationId 'com.qurani.ibnamr'" in grad and "namespace 'com.qurani.ibnamr'" in grad
          assert 'versionCode 1' in grad and 'versionName "1.0.0"' in grad
          expected=[
          ('quran.pdf',5,608,'المصحف'),
          ('ibn_amir_reading.pdf',1,4,'قراءة  بن عامر الشامي برواية هشام وبالحاشية ما خالفه فيه بن ذكوان'),
          ('quran_index.pdf',609,610,'الفهرس'),('dua.pdf',611,611,'الدعاء'),
          ('waqf_symbols.pdf',612,616,'علامات الوقف ومصطلحات الضبط ودلالات الرمز والترميز اللوني للقراءات العشر في مصاحف السلسلة الفراتية'),
          ('furati_intro.pdf',617,620,'من بين يدي السلسلة الفراتية'),
          ('ibn_amir_usul.pdf',621,633,'شرح أصول قراءة الامام بن عامر الشامي برواية هشام وبالحاشية ما خالفه فيه بن ذكوان')]
          for f,a,b,t in expected:
              assert f in sec and f'\"{f}\",{a},{b}' in sec and t in sec,(f,a,b)
          sur=json.loads((root/'app/src/main/assets/surahs.json').read_text())
          ver=json.loads((root/'app/src/main/assets/verses.json').read_text())
          assert len(sur)==114 and len(ver)==6236,(len(sur),len(ver))
          pages=[p for _,a,b,_ in expected for p in range(a,b+1)]
          assert sorted(pages)==list(range(1,634)) and len(pages)==633
          assert 1+4==5 and 604+4==608
          print('IBNAMIR_GREEN_CONTRACT_OK=1')
          PY
      - name: Build and export compact shell plus local signing tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          wf=yaml.safe_load(Path('.github/workflows/ibnamir-native-skeleton-export.yml').read_text())
          steps=wf['jobs']['build']['steps']
          s=next(x for x in steps if x.get('name','').startswith('Build compact unsigned release shell'))['run']
          Path('/tmp/build.sh').write_text(s)
          PY
          bash /tmp/build.sh
      - name: Persist export on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnamir/native-export
          git commit -m 'build: export compact Ibn Amir shell and signing tools'
          git pull --rebase origin qurani-ibnamir-v100
          git push origin HEAD:qurani-ibnamir-v100
