name: Quran Series v1.0.3 Zoom Search Final 12 APKs

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-series-v103-build-release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: quran-series-v1.0.3-zoom-search

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Reconstruct app source and stable APK skeleton
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-app series-output-v103 final-apks /tmp/payload /tmp/sources /tmp/sections /tmp/apkwork
          mkdir -p qurani-app /tmp/payload /tmp/sources /tmp/sections /tmp/apkwork final-apks
          cat qurani-ci/text/part-* > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C qurani-app
          cat qurani-v101/overlay/part-* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.gz
          echo 'cbb6b45021274412968d6f6747fa54048d1d46be31e92a6cea31b5d80a2b9d7e  /tmp/overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/overlay.tar.gz -C qurani-app
          cat .series-generated-v102/parts/payload.part-* > /tmp/v102.tar.gz
          expected="$(awk 'NR==1{print $1}' .series-generated-v102/SHA256SUMS.txt)"
          echo "$expected  /tmp/v102.tar.gz" | sha256sum -c -
          tar -tzf /tmp/v102.tar.gz >/dev/null
          tar -xzf /tmp/v102.tar.gz -C /tmp/payload
          test -s /tmp/payload/base.apk
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/apply.py
          cp qurani-v103-working/build_all_overlays.py /tmp/build.py
          (cd qurani-app && python3 /tmp/apply.py .)

      - name: Install build and OCR dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara >/dev/null
          python3 -m pip install --quiet 'gdown==5.2.0' 'PyMuPDF==1.26.4' pillow
          cd qurani-app && npm install --no-audit --no-fund && cd ..
          python3 - <<'PY'
          from pathlib import Path
          import base64
          from PIL import Image
          b64=''.join(p.read_text() for p in sorted(Path('qurani-ci/logo').glob('part-*')))
          src_path=Path('/tmp/qurani-logo.jpg')
          src_path.write_bytes(base64.b64decode(b64,validate=True))
          src=Image.open(src_path).convert('RGBA')
          Path('qurani-app/assets/branding').mkdir(parents=True,exist_ok=True)
          src.save('qurani-app/assets/branding/qurani-icon.png',optimize=True)
          base=Path('qurani-app/android/app/src/main/res')
          for folder,size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              d=base/folder; d.mkdir(parents=True,exist_ok=True)
              icon=src.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
          PY
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;27.1.12297006' 'cmake;3.22.1'
          keytool -genkeypair -v -keystore qurani-app/android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Series Build,O=QuranKarem,C=EG' >/dev/null 2>&1 || true
          cd qurani-app/android && gradle wrapper --gradle-version 9.3.1 && chmod +x gradlew && cd ../..

      - name: Apply zoom and visible Quran search-result fixes
        shell: bash
        run: |
          set -euo pipefail
          cp qurani-v102-fixed/ReaderScreen.tsx qurani-app/src/features/reader/ReaderScreen.tsx
          cp qurani-v103-fixed/ZoomablePdfPage.tsx qurani-app/src/features/reader/ZoomablePdfPage.tsx
          cp qurani-v101-fixed/PdfPage.tsx qurani-app/src/features/reader/PdfPage.tsx
          cp qurani-v103-fixed/IndexScreen.tsx qurani-app/src/features/index/IndexScreen.tsx
          cp qurani-v102-fixed/SectionCard.tsx qurani-app/src/features/home/SectionCard.tsx
          cp qurani-v102-complete/SearchScreen.tsx qurani-app/src/features/search/SearchScreen.tsx
          cp qurani-v102-complete/VerseSearchService.ts qurani-app/src/services/VerseSearchService.ts
          python3 qurani-v102-complete/apply_complete_patch.py qurani-app

      - name: Generate offline search text only from the approved user PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m gdown '1BVoetPB5RCq5cSV1zxaxb0nj98B0faup' -O /tmp/approved-abuamr.pdf --quiet
          python3 - <<'PY'
          import fitz, subprocess, os, json
          from pathlib import Path
          from concurrent.futures import ProcessPoolExecutor
          PDF='/tmp/approved-abuamr.pdf'
          doc=fitz.open(PDF); assert doc.page_count==638,doc.page_count; doc.close()
          def one(logical_page:int):
              source_page=logical_page+4
              d=fitz.open(PDF)
              p=d[source_page-1]
              pix=p.get_pixmap(matrix=fitz.Matrix(2.4,2.4),alpha=False,colorspace=fitz.csGRAY)
              img=Path(f'/tmp/quran-ocr-{logical_page}.png')
              pix.save(img); d.close()
              try:
                  r=subprocess.run(['tesseract',str(img),'stdout','-l','ara','--psm','6'],text=True,capture_output=True,check=True)
                  text=' '.join(r.stdout.split())
              finally:
                  img.unlink(missing_ok=True)
              return logical_page,text
          workers=max(1,min(2,os.cpu_count() or 1))
          with ProcessPoolExecutor(max_workers=workers) as ex:
              rows=list(ex.map(one,range(1,605),chunksize=1))
          rows.sort()
          nonempty=sum(bool(t.strip()) for _,t in rows)
          chars=sum(len(t) for _,t in rows)
          assert len(rows)==604
          assert nonempty>=595,(nonempty,chars)
          assert chars>=150000,(nonempty,chars)
          out=Path('qurani-app/src/data/verses.generated.ts')
          payload=[{'mushafPage':p,'text':t} for p,t in rows]
          body=json.dumps(payload,ensure_ascii=False,separators=(',',':'))
          out.write_text("import type {VerseSearchEntry} from '../services/VerseSearchService';\n\nexport const VERSE_INDEX: readonly VerseSearchEntry[] = "+body+' as const;\n',encoding='utf-8')
          print('OCR_INDEX_SOURCE=USER_APPROVED_PDF_ONLY')
          print('OCR_INDEX_PAGES=',len(rows),'NONEMPTY=',nonempty,'CHARS=',chars)
          PY

      - name: Configure v1.0.3 code 4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/build.py')
          s=p.read_text(encoding='utf-8')
          for a,b in [
            ("'versionCode 1'","'versionCode 4'"),
            ("'versionName \"1.0.0\"'","'versionName \"1.0.3\"'"),
            ("VERSION_NAME = '1.0.0'","VERSION_NAME = '1.0.3'"),
            ("VERSION_CODE = 1","VERSION_CODE = 4"),
            ("versionCode='1' versionName='1.0.0'","versionCode='4' versionName='1.0.3'"),
            ("'versionCode':1,'versionName':'1.0.0'","'versionCode':4,'versionName':'1.0.3'"),
            ("title: 'من بين يدي السلسلة الفراتية'","title: 'بين يدي السلسلة الفراتية'"),
          ]:
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          assert "versionCode='4' versionName='1.0.3'" in s
          PY

      - name: GREEN - TypeScript and requested behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('qurani-app')
          reader=(root/'src/features/reader/ReaderScreen.tsx').read_text(encoding='utf-8')
          index=(root/'src/features/index/IndexScreen.tsx').read_text(encoding='utf-8')
          zoom=(root/'src/features/reader/ZoomablePdfPage.tsx').read_text(encoding='utf-8')
          search=(root/'src/features/search/SearchScreen.tsx').read_text(encoding='utf-8')
          service=(root/'src/services/VerseSearchService.ts').read_text(encoding='utf-8')
          app=(root/'src/app/App.tsx').read_text(encoding='utf-8')
          verses=(root/'src/data/verses.generated.ts').read_text(encoding='utf-8')
          checks={
            'rtl_reader':'horizontal inverted pagingEnabled' in reader,
            'all_reader_sections_zoom':'<ZoomablePdfPage' in reader and 'scrollEnabled={!pageZoomed}' in reader and 'onTouchStart={handlePageTouchStart}' in reader and '<Pressable accessibilityLabel={`صفحة ${item} من ${total}`}' not in reader,
            'pinch_zoom':'MAX_ZOOM = 4.5' in zoom and 'PanResponder.create' in zoom and 'touchDistance' in zoom,
            'index_zoom':'ZoomablePdfPage' in index and 'scrollEnabled={!pageZoomed}' in index,
            'dark_only':"const dark=true;" in reader and "key:'theme'" not in reader and 'toggleTheme' not in reader,
            'splash_contain':'resizeMode="contain"' in app,
            'search_visible_text':'<Text style={styles.ayahText}' in search and '{item.text}' in search and 'surahNameForPage' in search,
            'search_no_generic':'نتيجة مطابقة لنص البحث' not in search and 'اضغط للانتقال إلى الصفحة مباشرة' not in search and 'البحث النصي يعمل دون إنترنت ويفتح الصفحة المطابقة مباشرة' not in search,
            'search_excerpt':'buildMatchExcerpt' in service,
            'ocr_604':verses.count('"mushafPage":')==604,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('V103_GREEN_FAIL='+','.join(failed))
          print('V103_GREEN_CONTRACT_OK=1')
          PY
          cd qurani-app
          cat > tsconfig.series.json <<'EOF'
          {"extends":"./tsconfig.json","exclude":["node_modules","android","__tests__","**/*.node.test.ts"]}
          EOF
          npx tsc --noEmit -p tsconfig.series.json
          echo 'TYPESCRIPT_OK=1'
          cd ..

      - name: Build 12 v1.0.3 overlays
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-app/android/app/src/main/assets/pdf series-output-v103
          mkdir -p qurani-app/android/app/src/main/assets/pdf
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          out=Path('qurani-app/android/app/src/main/assets/pdf')
          for name,count in {'reading.pdf':4,'quran.pdf':604,'quran_index.pdf':2,'dua.pdf':1,'waqf_symbols.pdf':5,'furati_intro.pdf':4,'usul.pdf':18}.items():
              d=fitz.open()
              for _ in range(count): d.new_page(width=512.402,height=652.68)
              d.save(out/name); d.close()
          PY
          cd qurani-app && python3 /tmp/build.py . /tmp/payload/base.apk ../qurani-series/apps.json ../series-output-v103 && cd ..
          python3 - <<'PY'
          import json
          r=json.load(open('series-output-v103/build-report.json'))
          assert len(r)==12
          packages=set()
          for x in r:
              assert x['badgingOk'] and x['nativeLibsIdenticalToBase'] and x['overlayReconstructsSkeleton'],x['slug']
              assert x['versionCode']==4 and x['versionName']=='1.0.3',x
              packages.add(x['package'])
          assert len(packages)==12
          print('ALL_12_V103_OVERLAYS_OK=1')
          PY

      - name: Build sign and verify final 12 APKs from approved PDFs
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/quran-v103.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Quran Karem Series,O=QuranKarem,C=EG' >/dev/null 2>&1
          cat > /tmp/apps.txt <<'EOF'
          01|abuamr|com.qurani.series.abuamr|638|1BVoetPB5RCq5cSV1zxaxb0nj98B0faup|01-AbuAmr-v1.0.3.apk
          02|ibnamir|com.qurani.series.ibnamir|633|1zxcrxi4Q2J0jaKZS1hFPQEF3GhNIDlTZ|02-IbnAmir-v1.0.3.apk
          03|ibnkathir|com.qurani.series.ibnkathir|632|1hFgLvZYo_tqrpTn82kzzRy30kr3agtg5|03-IbnKathir-v1.0.3.apk
          04|khalafhamza|com.qurani.series.khalafhamza|636|14dV4ewJ75I-feQSTz0oNsMvUSz2vnlPG|04-Khalaf-Hamza-Sakt-v1.0.3.apk
          05|alkisai|com.qurani.series.alkisai|633|1a2PHF7eHXmKtn8bgd_SHbSKSyc4vp1b3|05-AlKisai-v1.0.3.apk
          06|khalladhamza|com.qurani.series.khalladhamza|636|1iLjNkH1nB-eovs6xXJmsh0Zd_dBagpWS|06-Khallad-Hamza-NoSakt-v1.0.3.apk
          07|abujaafar|com.qurani.series.abujaafar|634|1ka0xEX2tK95HTJos_eU0W_yjtzYVFeKM|07-AbuJaafar-v1.0.3.apk
          08|yaqub|com.qurani.series.yaqub|630|1-HMgAHqQbJz97EQnPUDd7tFmUJ-uHsJu|08-Yaqub-v1.0.3.apk
          09|khalaf10|com.qurani.series.khalaf10|628|1vHJkNHxGLxLqby6pszUoxhGcOP4-wK6F|09-Khalaf10-v1.0.3.apk
          10|asim|com.qurani.series.asim|633|1dtHbfD19xNUxc9rPNT2gHuxTTSK8XLBh|10-Asim-v1.0.3.apk
          11|warshazraq|com.qurani.series.warshazraq|637|1eZsEfvK2WYERoHXRqdIxgfC8K6hqAcgI|11-Warsh-Azraq-v1.0.3.apk
          12|qalunqasr|com.qurani.series.qalunqasr|632|1qTjYqpjs9S6v0UM2nZMXvUSsmBXxum3b|12-Qalun-Qasr-v1.0.3.apk
          EOF
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BT/aapt"; ZIPALIGN="$BT/zipalign"; APKSIGNER="$BT/apksigner"
          count=0
          while IFS='|' read -r num slug package pages drive_id filename; do
            count=$((count+1))
            echo "===== $num $slug ====="
            src="/tmp/sources/$slug.pdf"
            if [[ "$slug" == "abuamr" ]]; then cp /tmp/approved-abuamr.pdf "$src"; else python3 -m gdown "$drive_id" -O "$src" --quiet; fi
            test -s "$src"
            python3 - "$src" "$pages" "$slug" <<'PY'
          import sys,fitz
          from pathlib import Path
          src_path,expected,slug=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          src=fitz.open(src_path); assert src.page_count==expected,(slug,src.page_count,expected)
          outdir=Path('/tmp/sections')/slug; outdir.mkdir(parents=True,exist_ok=True)
          ranges={'reading.pdf':(1,4),'quran.pdf':(5,608),'quran_index.pdf':(609,610),'dua.pdf':(611,611),'waqf_symbols.pdf':(612,616),'furati_intro.pdf':(617,620),'usul.pdf':(621,expected)}
          for name,(start,end) in ranges.items():
              d=fitz.open(); d.insert_pdf(src,from_page=start-1,to_page=end-1); d.save(outdir/name,garbage=0,deflate=False); assert d.page_count==end-start+1; d.close()
          src.close()
          PY
            workdir="/tmp/apkwork/$slug"; rm -rf "$workdir"; mkdir -p "$workdir/stage/assets/pdf" "$workdir/stage/assets"
            cp /tmp/payload/base.apk "$workdir/unsigned.apk"
            (zip -q -d "$workdir/unsigned.apk" 'META-INF/*' 'AndroidManifest.xml' 'resources.arsc' 'assets/index.android.bundle' 'assets/pdf/*' || true)
            cp "series-output-v103/overlays/$slug/files/AndroidManifest.xml" "$workdir/stage/AndroidManifest.xml"
            cp "series-output-v103/overlays/$slug/files/resources.arsc" "$workdir/stage/resources.arsc"
            cp "series-output-v103/overlays/$slug/files/assets/index.android.bundle" "$workdir/stage/assets/index.android.bundle"
            cp "/tmp/sections/$slug/"*.pdf "$workdir/stage/assets/pdf/"
            (cd "$workdir/stage" && zip -q -0 "$workdir/unsigned.apk" AndroidManifest.xml resources.arsc assets/index.android.bundle assets/pdf/*.pdf)
            "$ZIPALIGN" -f -P 16 4 "$workdir/unsigned.apk" "$workdir/aligned.apk"
            "$APKSIGNER" sign --ks /tmp/quran-v103.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "final-apks/$filename" "$workdir/aligned.apk"
            unzip -t "final-apks/$filename" >/dev/null
            "$ZIPALIGN" -c -P 16 4 "final-apks/$filename"
            "$APKSIGNER" verify --verbose --min-sdk-version 21 "final-apks/$filename" | tee "$workdir/signing.txt"
            grep -q 'Verified using v1 scheme (JAR signing): true' "$workdir/signing.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$workdir/signing.txt"
            "$AAPT" dump badging "final-apks/$filename" | tee "$workdir/badging.txt"
            grep -q "package: name='$package' versionCode='4' versionName='1.0.3'" "$workdir/badging.txt"
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/quran.pdf'
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/quran_index.pdf'
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/usul.pdf'
            echo "APK_VERIFIED=$filename|$package|v1=true|v2=true"
          done < /tmp/apps.txt
          test "$count" -eq 12
          test "$(find final-apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 12
          sha256sum final-apks/*.apk | tee final-apks/SHA256SUMS.txt

      - name: Publish v1.0.3 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" final-apks/*.apk final-apks/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Quran Series v1.0.3 – Zoom + Search Fixes' --notes '12 updated APKs built only from the user-provided PDFs. Pinch zoom is enabled in the Quran, explanations and all reader sections using the same zoom component as the index. Offline search now displays the matching OCR-derived Quran text and surah/page context instead of generic technical/instructional result cards. All APKs passed unzip, 16K zipalign, APK signature v1/v2 verification, unique package ID, versionCode 4 and versionName 1.0.3 checks.'
