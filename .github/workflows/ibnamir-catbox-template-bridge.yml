name: IbnAmir Catbox Template Bridge

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths:
      - '.github/workflows/ibnamir-catbox-template-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: abuamr-transfer-v100
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Abu Amr master skeleton and Android tools
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'AbuAmr-skeleton-v1.0.0.apk' \
            --pattern 'android-apk-tools-36.zip'
          echo '4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181  AbuAmr-skeleton-v1.0.0.apk' | sha256sum -c -
          echo '009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550  android-apk-tools-36.zip' | sha256sum -c -
      - name: Upload verified transfer files to catbox
        shell: bash
        run: |
          set -euo pipefail
          upload() {
            local f="$1"
            local u
            u="$(curl -fsS --retry 6 --retry-delay 3 --retry-all-errors \
              -F 'reqtype=fileupload' -F "fileToUpload=@${f}" \
              https://catbox.moe/user/api.php)"
            case "$u" in https://files.catbox.moe/*) printf '%s' "$u";; *) echo "Unexpected response: $u" >&2; return 1;; esac
          }
          mkdir -p qurani-ibnamir
          APK_URL="$(upload AbuAmr-skeleton-v1.0.0.apk)"
          TOOLS_URL="$(upload android-apk-tools-36.zip)"
          {
            echo "APK_URL=$APK_URL"
            echo "TOOLS_URL=$TOOLS_URL"
            echo 'APK_SHA256=4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181'
            echo 'TOOLS_SHA256=009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550'
          } > qurani-ibnamir/catbox-template-urls.txt
      - name: Persist transfer URLs on isolated Ibn Amir branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-ibnamir/catbox-template-urls.txt
          git commit -m 'ci: record Ibn Amir catbox template URLs'
          git pull --rebase origin qurani-ibnamir-v100
          git push origin HEAD:qurani-ibnamir-v100
