name: Quran v1.0.1 Source Inspect

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v101-source-inspect.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct master source + v1.0.1 overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qapp qurani-series/v101-debug
          mkdir -p /tmp/qapp qurani-series/v101-debug
          cat qurani-ci/text/part-* > /tmp/qsrc.b64
          base64 -d /tmp/qsrc.b64 > /tmp/qsrc.tar.gz
          tar -xzf /tmp/qsrc.tar.gz -C /tmp/qapp
          cat qurani-v101/overlay/part-* > /tmp/qoverlay.b64
          base64 -d /tmp/qoverlay.b64 > /tmp/qoverlay.tar.gz
          tar -xzf /tmp/qoverlay.tar.gz -C /tmp/qapp
          cp qurani-v101/ZoomablePdfPage.tsx /tmp/qapp/src/features/reader/ZoomablePdfPage.tsx
      - name: Persist focused source snapshot
        shell: bash
        run: |
          set -euo pipefail
          OUT=qurani-series/v101-debug/source-snapshot.txt
          : > "$OUT"
          for f in \
            /tmp/qapp/src/features/reader/ReaderScreen.tsx \
            /tmp/qapp/src/features/reader/ZoomablePdfPage.tsx \
            /tmp/qapp/src/features/home/HomeScreen.tsx \
            /tmp/qapp/src/features/home/SectionCard.tsx \
            /tmp/qapp/src/repositories/SettingsRepository.ts \
            /tmp/qapp/android/app/build.gradle \
            /tmp/qapp/package.json; do
              if [ -f "$f" ]; then
                echo "===== FILE: ${f#/tmp/qapp/} =====" >> "$OUT"
                cat "$f" >> "$OUT"
                printf '\n\n' >> "$OUT"
              fi
          done
          echo '===== FILE TREE: reader/home =====' >> "$OUT"
          find /tmp/qapp/src/features/reader /tmp/qapp/src/features/home -maxdepth 2 -type f -print | sed 's#/tmp/qapp/##' | sort >> "$OUT"
          echo '===== GREP: section/pdf/index routing =====' >> "$OUT"
          grep -RniE "quran_index|reading\.pdf|dua\.pdf|waqf_symbols|furati_intro|usul\.pdf|openSection|section.*pdf|Pdf" /tmp/qapp/src/features /tmp/qapp/src/navigation /tmp/qapp/src/repositories 2>/dev/null | head -n 1000 | sed 's#/tmp/qapp/##' >> "$OUT" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qurani-series/v101-debug/source-snapshot.txt
          git commit -m 'ci: persist v1.0.1 source snapshot' || true
          git push origin HEAD:qurani-series-v100
