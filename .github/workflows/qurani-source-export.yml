name: Qurani Source Export

on:
  push:
    branches: [qurani-build-temp]
    paths:
      - '.github/workflows/qurani-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qurani-app
          cat qurani-ci/text/part-* > /tmp/qurani-src.b64
          base64 -d /tmp/qurani-src.b64 > /tmp/qurani-src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/qurani-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/qurani-src.tar.gz -C qurani-app
          tar -czf qurani-source-export.tar.gz -C qurani-app .
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: qurani-source-export
          retention-days: 7
          if-no-files-found: error
          path: qurani-source-export.tar.gz
