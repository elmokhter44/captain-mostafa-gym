name: AbuAmr FileIO Text Transfer Bridge

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-fileio-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: abuamr-transfer-v100
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'AbuAmr-skeleton-v1.0.0.apk' \
            --pattern 'android-apk-tools-36.zip'
          echo '4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181  AbuAmr-skeleton-v1.0.0.apk' | sha256sum -c -
          echo '009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550  android-apk-tools-36.zip' | sha256sum -c -
      - name: Encode binaries as text and upload to file.io
        shell: bash
        run: |
          set -euo pipefail
          base64 -w 76 AbuAmr-skeleton-v1.0.0.apk > AbuAmr-skeleton-v1.0.0.apk.b64.txt
          base64 -w 76 android-apk-tools-36.zip > android-apk-tools-36.zip.b64.txt
          upload() {
            local f="$1" j
            j="$(curl -fsS --retry 6 --retry-delay 3 --retry-all-errors \
              -F "file=@${f}" -F 'expires=1d' -F 'maxDownloads=3' \
              https://file.io)"
            printf '%s' "$j"
          }
          A="$(upload AbuAmr-skeleton-v1.0.0.apk.b64.txt)"
          T="$(upload android-apk-tools-36.zip.b64.txt)"
          {
            echo "APK_B64_URL=$(printf '%s' "$A" | jq -r '.link')"
            echo "APK_MAX_DOWNLOADS=$(printf '%s' "$A" | jq -r '.maxDownloads')"
            echo "APK_AUTODELETE=$(printf '%s' "$A" | jq -r '.autoDelete')"
            echo "TOOLS_B64_URL=$(printf '%s' "$T" | jq -r '.link')"
            echo "TOOLS_MAX_DOWNLOADS=$(printf '%s' "$T" | jq -r '.maxDownloads')"
            echo "TOOLS_AUTODELETE=$(printf '%s' "$T" | jq -r '.autoDelete')"
            echo 'APK_SHA256=4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181'
            echo 'TOOLS_SHA256=009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550'
          } | tee qurani-abuamr/fileio-bridge.txt
      - name: Persist transfer URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-abuamr/fileio-bridge.txt
          git commit -m 'ci: record Abu Amr file.io transfer URLs'
          git pull --rebase origin qurani-abuamr-v100
          git push origin HEAD:qurani-abuamr-v100
