name: IbnAmir Inspect Shell

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shell contents
        shell: bash
        run: |
          set -euo pipefail
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/shell.apk
          echo '=== ZIPLIST ==='
          unzip -l /tmp/shell.apk
          echo '=== ASSET JSON SIZES ==='
          unzip -p /tmp/shell.apk assets/surahs.json | wc -c || true
          unzip -p /tmp/shell.apk assets/verses.json | wc -c || true
          echo '=== SURAH HEAD ==='
          unzip -p /tmp/shell.apk assets/surahs.json | head -c 1200 || true
          echo
          echo '=== VERSES HEAD ==='
          unzip -p /tmp/shell.apk assets/verses.json | head -c 1500 || true
          echo
