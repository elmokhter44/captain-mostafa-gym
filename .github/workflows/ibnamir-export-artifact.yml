name: IbnAmir TinyURL Bridge

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Filebin and shorten
        shell: bash
        run: |
          set -euo pipefail
          FILEBIN='https://filebin.net/ibnamir-zip-1789915252-35517225108/ibnamir-shell.zip'
          EFFECTIVE=$(curl -sS -L -o /dev/null -w '%{url_effective}' "$FILEBIN")
          echo "EFFECTIVE=$EFFECTIVE"
          SHORT=$(curl -sS --get --data-urlencode "url=$EFFECTIVE" 'https://tinyurl.com/api-create.php')
          echo "SHORT=$SHORT"
