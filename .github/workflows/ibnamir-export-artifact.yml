name: IbnAmir Export Shell Tools

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Mirror existing Uguu base64 payloads to Catbox
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CATBOX_SHELL_TEXT ==='
          curl --fail --silent --show-error -A 'Mozilla/5.0' \
            -F 'reqtype=urlupload' \
            -F 'url=https://n.uguu.se/coUtpufD.txt' \
            https://catbox.moe/user/api.php
          echo
          echo '=== CATBOX_TOOLS_TEXT ==='
          curl --fail --silent --show-error -A 'Mozilla/5.0' \
            -F 'reqtype=urlupload' \
            -F 'url=https://d.uguu.se/fBpzSiJF.txt' \
            https://catbox.moe/user/api.php
          echo
