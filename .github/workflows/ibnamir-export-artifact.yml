name: IbnAmir Resolve Filebin

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Filebin download redirect
        shell: bash
        run: |
          set -x
          URL='https://filebin.net/ibnamir-zip-1789915252-35517225108/ibnamir-shell.zip'
          rm -f /tmp/cj /tmp/h1 /tmp/h2 /tmp/body
          curl -sS -c /tmp/cj -D /tmp/h1 -o /tmp/body "$URL" || true
          echo '=== FIRST_HEADERS ==='; cat /tmp/h1 || true
          echo '=== COOKIES ==='; cat /tmp/cj || true
          curl -sS -b /tmp/cj -D /tmp/h2 -o /dev/null "$URL" || true
          echo '=== SECOND_HEADERS ==='; cat /tmp/h2 || true
          echo '=== EFFECTIVE ==='
          curl -sS -b /tmp/cj -L -o /dev/null -w '%{url_effective}\n%{http_code}\n' "$URL" || true
