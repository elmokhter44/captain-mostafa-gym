name: IbnAmir Public Bridge

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct shell
        shell: bash
        run: |
          set -euo pipefail
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/ibnamir-shell.apk
          echo '3f2da2463e14e5fde52446e594b82febcb09889f9b4457e8da2b1a2aba55546a  /tmp/ibnamir-shell.apk' | sha256sum -c -
      - name: Try public mirrors
        shell: bash
        run: |
          set +e
          echo '=== CATBOX ==='
          curl -L --connect-timeout 10 --max-time 60 -fsS -F 'reqtype=fileupload' -F 'fileToUpload=@/tmp/ibnamir-shell.apk' https://catbox.moe/user/api.php || true
          echo
          echo '=== LITTERBOX ==='
          curl -L --connect-timeout 10 --max-time 60 -fsS -F 'reqtype=fileupload' -F 'time=1h' -F 'fileToUpload=@/tmp/ibnamir-shell.apk' https://litterbox.catbox.moe/resources/internals/api.php || true
          echo
          echo '=== UGUU ==='
          curl -L --connect-timeout 10 --max-time 60 -fsS -F 'files[]=@/tmp/ibnamir-shell.apk' https://uguu.se/upload.php || true
          echo
          echo '=== PIXELDRAIN ==='
          curl -L --connect-timeout 10 --max-time 60 -fsS -T /tmp/ibnamir-shell.apk https://pixeldrain.com/api/file/ || true
          echo
          echo '=== BASHUPLOAD ==='
          curl -L --connect-timeout 10 --max-time 60 -fsS -T /tmp/ibnamir-shell.apk https://bashupload.com/ibnamir-shell.apk || true
          echo
