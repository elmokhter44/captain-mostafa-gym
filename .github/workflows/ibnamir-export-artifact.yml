name: IbnAmir Export Shell Tools

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified shell and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bridge
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/bridge/ibnamir-shell.apk
          cat qurani-ibnamir/native-export/tools/part-* | base64 -d > /tmp/bridge/ibnamir-sign-tools.zip
          echo '3f2da2463e14e5fde52446e594b82febcb09889f9b4457e8da2b1a2aba55546a  /tmp/bridge/ibnamir-shell.apk' | sha256sum -c -
          echo 'eed35a6c7e594564f7cb30fbd3a870e7f84054825de2ea5bb84217adf855c0a3  /tmp/bridge/ibnamir-sign-tools.zip' | sha256sum -c -
      - name: Publish bridge mirrors
        shell: bash
        run: |
          set +e
          echo '=== CATBOX_SHELL ==='
          curl -fsS -F 'reqtype=fileupload' -F 'fileToUpload=@/tmp/bridge/ibnamir-shell.apk' https://catbox.moe/user/api.php || true
          echo
          echo '=== CATBOX_TOOLS ==='
          curl -fsS -F 'reqtype=fileupload' -F 'fileToUpload=@/tmp/bridge/ibnamir-sign-tools.zip' https://catbox.moe/user/api.php || true
          echo
          echo '=== UGUU_SHELL ==='
          curl -fsS -F 'files[]=@/tmp/bridge/ibnamir-shell.apk' https://uguu.se/upload.php || true
          echo
          echo '=== UGUU_TOOLS ==='
          curl -fsS -F 'files[]=@/tmp/bridge/ibnamir-sign-tools.zip' https://uguu.se/upload.php || true
          echo
