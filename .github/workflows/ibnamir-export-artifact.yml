name: IbnAmir Filebin Bridge

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct shell
        shell: bash
        run: |
          set -euo pipefail
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/ibnamir-shell.apk
          echo '3f2da2463e14e5fde52446e594b82febcb09889f9b4457e8da2b1a2aba55546a  /tmp/ibnamir-shell.apk' | sha256sum -c -
      - name: Upload to Filebin
        shell: bash
        run: |
          set -euo pipefail
          BIN="ibnamir-$(date +%s)-${GITHUB_RUN_ID}"
          URL="https://filebin.net/${BIN}/ibnamir-shell.apk"
          echo "FILEBIN_URL=${URL}"
          curl --fail --silent --show-error -X POST --data-binary @/tmp/ibnamir-shell.apk -H 'Content-Type: application/vnd.android.package-archive' "$URL"
          echo
          curl --fail --silent --show-error -I "$URL" | head -20
