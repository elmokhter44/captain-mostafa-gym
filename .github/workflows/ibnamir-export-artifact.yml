name: IbnAmir Export Shell Tools

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified shell and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bridge
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/bridge/ibnamir-shell.apk
          cat qurani-ibnamir/native-export/tools/part-* | base64 -d > /tmp/bridge/ibnamir-sign-tools.zip
          echo '3f2da2463e14e5fde52446e594b82febcb09889f9b4457e8da2b1a2aba55546a  /tmp/bridge/ibnamir-shell.apk' | sha256sum -c -
          echo 'eed35a6c7e594564f7cb30fbd3a870e7f84054825de2ea5bb84217adf855c0a3  /tmp/bridge/ibnamir-sign-tools.zip' | sha256sum -c -
      - name: Publish temporary download mirrors
        shell: bash
        run: |
          set +e
          echo '=== TMPFILES SHELL ==='
          curl -fsS -F 'file=@/tmp/bridge/ibnamir-shell.apk' https://tmpfiles.org/api/v1/upload || true
          echo
          echo '=== TMPFILES TOOLS ==='
          curl -fsS -F 'file=@/tmp/bridge/ibnamir-sign-tools.zip' https://tmpfiles.org/api/v1/upload || true
          echo
          echo '=== TRANSFER SHELL ==='
          curl -fsS --upload-file /tmp/bridge/ibnamir-shell.apk https://transfer.sh/ibnamir-shell.apk || true
          echo
          echo '=== TRANSFER TOOLS ==='
          curl -fsS --upload-file /tmp/bridge/ibnamir-sign-tools.zip https://transfer.sh/ibnamir-sign-tools.zip || true
          echo
          echo '=== 0X0 SHELL ==='
          curl -fsS -F 'file=@/tmp/bridge/ibnamir-shell.apk' https://0x0.st || true
          echo
          echo '=== 0X0 TOOLS ==='
          curl -fsS -F 'file=@/tmp/bridge/ibnamir-sign-tools.zip' https://0x0.st || true
          echo
          echo '=== TEMP.SH SHELL ==='
          curl -fsS -T /tmp/bridge/ibnamir-shell.apk https://temp.sh/ibnamir-shell.apk || true
          echo
          echo '=== TEMP.SH TOOLS ==='
          curl -fsS -T /tmp/bridge/ibnamir-sign-tools.zip https://temp.sh/ibnamir-sign-tools.zip || true
          echo
