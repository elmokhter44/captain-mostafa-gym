name: IbnAmir Wrapped Bridge

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and commit wrapped base64
        shell: bash
        run: |
          set -euo pipefail
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/ibnamir-shell.apk
          echo '3f2da2463e14e5fde52446e594b82febcb09889f9b4457e8da2b1a2aba55546a  /tmp/ibnamir-shell.apk' | sha256sum -c -
          mkdir -p qurani-ibnamir/bridge
          base64 -w 1000 /tmp/ibnamir-shell.apk > qurani-ibnamir/bridge/shell.b64
          echo "LINES=$(wc -l < qurani-ibnamir/bridge/shell.b64)"
          echo "BYTES=$(wc -c < qurani-ibnamir/bridge/shell.b64)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qurani-ibnamir/bridge/shell.b64
          git commit -m 'ci: add wrapped Ibn Amir shell bridge'
          git push origin HEAD:qurani-ibnamir-v100
