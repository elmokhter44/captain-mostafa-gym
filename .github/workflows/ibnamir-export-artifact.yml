name: IbnAmir Export Shell Tools

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified shell and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bridge
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/bridge/ibnamir-shell.apk
          cat qurani-ibnamir/native-export/tools/part-* | base64 -d > /tmp/bridge/ibnamir-sign-tools.zip
          echo '3f2da2463e14e5fde52446e594b82febcb09889f9b4457e8da2b1a2aba55546a  /tmp/bridge/ibnamir-shell.apk' | sha256sum -c -
          echo 'eed35a6c7e594564f7cb30fbd3a870e7f84054825de2ea5bb84217adf855c0a3  /tmp/bridge/ibnamir-sign-tools.zip' | sha256sum -c -
      - name: Publish bridge as text files on tmpfiles
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 /tmp/bridge/ibnamir-shell.apk > /tmp/bridge/ibnamir-shell.b64.txt
          base64 -w0 /tmp/bridge/ibnamir-sign-tools.zip > /tmp/bridge/ibnamir-tools.b64.txt
          echo '=== TMPFILES_SHELL_TEXT ==='
          curl --fail --silent --show-error -F 'file=@/tmp/bridge/ibnamir-shell.b64.txt' https://tmpfiles.org/api/v1/upload
          echo
          echo '=== TMPFILES_TOOLS_TEXT ==='
          curl --fail --silent --show-error -F 'file=@/tmp/bridge/ibnamir-tools.b64.txt' https://tmpfiles.org/api/v1/upload
          echo
