name: IbnAmir Export Shell Tools

on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-export-artifact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified shell and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bridge
          cat qurani-ibnamir/native-export/apk/part-* | base64 -d > /tmp/bridge/ibnamir-shell.apk
          cat qurani-ibnamir/native-export/tools/part-* | base64 -d > /tmp/bridge/ibnamir-sign-tools.zip
          echo '3f2da2463e14e5fde52446e594b82febcb09889f9b4457e8da2b1a2aba55546a  /tmp/bridge/ibnamir-shell.apk' | sha256sum -c -
          echo 'eed35a6c7e594564f7cb30fbd3a870e7f84054825de2ea5bb84217adf855c0a3  /tmp/bridge/ibnamir-sign-tools.zip' | sha256sum -c -
      - name: Publish bridge through Filebin
        shell: bash
        env:
          BIN: ibnamir-20260920-7f3a9c
        run: |
          set -euo pipefail
          echo '=== FILEBIN_SHELL ==='
          curl --fail --silent --show-error -X POST --data-binary '@/tmp/bridge/ibnamir-shell.apk' "https://filebin.net/${BIN}/ibnamir-shell.apk"
          echo
          echo '=== FILEBIN_TOOLS ==='
          curl --fail --silent --show-error -X POST --data-binary '@/tmp/bridge/ibnamir-sign-tools.zip' "https://filebin.net/${BIN}/ibnamir-sign-tools.zip"
          echo
          echo "BIN_URL=https://filebin.net/${BIN}"
          curl --fail --silent --show-error "https://filebin.net/${BIN}.txt"
