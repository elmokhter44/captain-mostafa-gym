name: Quran Series Fixed APKs – Zoom Index Verse Search

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-series-v103-final-fixed.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Inspect existing offline verse index
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quran-index-check && mkdir -p /tmp/quran-index-check
          cat qurani-ci/text/part-* > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/quran-index-check
          cat qurani-v101/overlay/part-* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.gz
          tar -xzf /tmp/overlay.tar.gz -C /tmp/quran-index-check
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('/tmp/quran-index-check/src/data/verses.generated.ts')
          s=p.read_text(encoding='utf-8')
          print('VERSE_FILE_BYTES=',len(s.encode('utf-8')))
          print('SURAH_KEY_COUNT=',s.count('surahNumber'))
          print('AYAH_KEY_COUNT=',s.count('ayahNumber'))
          print('PAGE_KEY_COUNT=',s.count('mushafPage'))
          print('HEAD=',s[:300])
          m=re.search(r'export const VERSE_INDEX[^=]*=\s*(\[.*\]);\s*$',s,re.S)
          if m:
              data=json.loads(m.group(1))
              print('PARSED_VERSES=',len(data))
              print('MIN_PAGE=',min(x['mushafPage'] for x in data),'MAX_PAGE=',max(x['mushafPage'] for x in data))
          else:
              print('PARSE_PATTERN_NOT_FOUND=1')
          PY
      - name: Build, verify, and publish all 12 fixed APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qurani-v103-final/run.sh
