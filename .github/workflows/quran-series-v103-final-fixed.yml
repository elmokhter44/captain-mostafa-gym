name: Quran Series Fixed APKs – Zoom Index Verse Search

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-series-v103-final-fixed.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Build, verify, and publish all 12 fixed APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash qurani-v103-final/run.sh
