name: Quran Series Fixed APKs – Zoom Index Verse Search

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-series-v103-final-fixed.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: quran-series-v1.0.2-fixed-index-search-zoom

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Reconstruct app source and v1.0.2 overlay payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-app /tmp/payload /tmp/v103-bundles /tmp/v103-assets
          mkdir -p qurani-app /tmp/payload /tmp/v103-bundles /tmp/v103-assets

          cat qurani-ci/text/part-* > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C qurani-app

          cat qurani-v101/overlay/part-* > /tmp/source-overlay.b64
          base64 -d /tmp/source-overlay.b64 > /tmp/source-overlay.tar.gz
          echo 'cbb6b45021274412968d6f6747fa54048d1d46be31e92a6cea31b5d80a2b9d7e  /tmp/source-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/source-overlay.tar.gz -C qurani-app

          cat .series-generated-v102/parts/payload.part-* > /tmp/v102.tar.gz
          echo 'bbd714921a1a4fb4f38416247fbaae91651a965acdb702ea643e22e717788732  /tmp/v102.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v102.tar.gz -C /tmp/payload
          test -s /tmp/payload/base.apk
          test -d /tmp/payload/overlays

          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/apply_series_common.py
          python3 - <<'PY'
          from pathlib import Path
          import base64
          b64=''.join(p.read_text() for p in sorted(Path('qurani-ci/logo').glob('part-*')))
          Path('/tmp/qurani-logo.jpg').write_bytes(base64.b64decode(b64,validate=True))
          PY
          echo '4c8d65a11c77539831be3a791e54b9eb984375cea878262fd1972ed3acf58cae  /tmp/qurani-logo.jpg' | sha256sum -c -

      - name: Install JS/PDF/Android tools
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          npm install --no-audit --no-fund
          cd ..
          python3 -m pip install --quiet 'gdown==5.2.0' 'PyMuPDF==1.26.4' pillow
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          mkdir -p qurani-app/assets/branding
          python3 - <<'PY'
          from PIL import Image
          Image.open('/tmp/qurani-logo.jpg').convert('RGBA').save('qurani-app/assets/branding/qurani-icon.png',optimize=True)
          PY
          test -s qurani-app/assets/branding/qurani-icon.png

      - name: RED – confirm old source misses this requested contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v103_contract.py <<'PY'
          from pathlib import Path
          import sys,re
          root=Path(sys.argv[1])
          card=(root/'src/features/home/SectionCard.tsx').read_text(encoding='utf-8')
          reader=(root/'src/features/reader/ReaderScreen.tsx').read_text(encoding='utf-8')
          zoom=(root/'src/features/reader/ZoomablePdfPage.tsx').read_text(encoding='utf-8') if (root/'src/features/reader/ZoomablePdfPage.tsx').exists() else ''
          index=(root/'src/features/index/IndexScreen.tsx').read_text(encoding='utf-8')
          search=(root/'src/features/search/SearchScreen.tsx').read_text(encoding='utf-8')
          verse_service=(root/'src/services/VerseSearchService.ts').read_text(encoding='utf-8') if (root/'src/services/VerseSearchService.ts').exists() else ''
          verse_index=(root/'src/data/verses.generated.ts').read_text(encoding='utf-8')
          checks={
            'uniform_card_icon': '◆' in card and 'section.subtitle' not in card,
            'reader_zoom': 'ZoomablePdfPage' in reader and 'scrollEnabled={!pageZoomed}' in reader,
            'all_section_icons_uniform': "const SECTION_GLYPH='◆'" in reader,
            'pinch_zoom': 'PanResponder.create' in zoom and 'touchDistance' in zoom,
            'index_no_notice': '609–610' not in index and 'ScreenHeader' not in index and 'noticeText' not in index,
            'index_fullscreen': 'width={screenWidth}' in index and 'height={screenHeight}' in index,
            'index_zoom': 'ZoomablePdfPage' in index and 'scrollEnabled={!pageZoomed}' in index,
            'index_exact_ranges': all(x in index for x in ['start: 1, end: 28','start: 29, end: 56','start: 57, end: 85','start: 86, end: 114','top: 0.149','bottom: 0.961']),
            'index_exact_navigation': "navigation.push('Reader', toSurahTarget(surah))" in index,
            'all_verse_matches': 'searchVerses(query, VERSE_INDEX)' in search and '.slice(0, 50)' not in search and 'limit' not in verse_service,
            'verse_index_complete': verse_index.count('surahNumber:')==6236,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              print('CONTRACT_FAIL='+','.join(failed))
              raise SystemExit(1)
          print('CONTRACT_OK=1')
          PY
          set +e
          python3 /tmp/v103_contract.py qurani-app
          rc=$?
          set -e
          test "$rc" -ne 0
          echo 'RED_CONFIRMED=1'

      - name: Apply requested fixed UI/search behavior
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          python3 /tmp/apply_series_common.py .
          cd ..
          cp qurani-v103-fixed/ReaderScreen.tsx qurani-app/src/features/reader/ReaderScreen.tsx
          cp qurani-v103-fixed/ZoomablePdfPage.tsx qurani-app/src/features/reader/ZoomablePdfPage.tsx
          cp qurani-v101-fixed/PdfPage.tsx qurani-app/src/features/reader/PdfPage.tsx
          cp qurani-v103-fixed/IndexScreen.tsx qurani-app/src/features/index/IndexScreen.tsx
          cp qurani-v103-fixed/SearchScreen.tsx qurani-app/src/features/search/SearchScreen.tsx
          cp qurani-v103-fixed/VerseSearchService.ts qurani-app/src/services/VerseSearchService.ts
          cp qurani-v103-fixed/SectionCard.tsx qurani-app/src/features/home/SectionCard.tsx

      - name: GREEN – TypeScript and requirement verification
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v103_contract.py qurani-app
          cd qurani-app
          cat > tsconfig.series.json <<'EOF'
          {"extends":"./tsconfig.json","exclude":["node_modules","android","__tests__","**/*.node.test.ts"]}
          EOF
          npx tsc --noEmit -p tsconfig.series.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          v=Path('src/data/verses.generated.ts').read_text(encoding='utf-8')
          assert v.count('surahNumber:')==6236
          assert v.count('ayahNumber:')==6236
          pages=[int(x) for x in re.findall(r'mushafPage:\s*(\d+)',v)]
          assert len(pages)==6236 and min(pages)==1 and max(pages)==604
          print('VERSE_INDEX_6236_OK=1')
          PY
          cd ..

      - name: Generate app-specific Hermes bundles for all 12 apps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys,json,subprocess,shutil
          root=Path('qurani-app').resolve()
          apps_path=Path('qurani-series/apps.json').resolve()
          builder_path=Path('qurani-v103-working/build_all_overlays.py')
          code=builder_path.read_text(encoding='utf-8')
          prefix=code.split('\ndef zmap(',1)[0]
          old_argv=sys.argv[:]
          sys.argv=['builder',str(root),'/tmp/not-used.apk',str(apps_path),'/tmp/not-used-out']
          ns={}
          exec(compile(prefix,str(builder_path),'exec'),ns)
          sys.argv=old_argv
          apply_app=ns['apply_app']
          apps=json.loads(apps_path.read_text(encoding='utf-8'))
          hermesc_candidates=list((root/'node_modules').glob('**/hermesc/linux64-bin/hermesc'))
          if not hermesc_candidates:
              raise SystemExit('hermesc not found')
          hermesc=hermesc_candidates[0]
          hermesc.chmod(0o755)
          for i,a in enumerate(apps,1):
              print(f'BUNDLE {i}/12 {a["slug"]}',flush=True)
              apply_app(a)
              sec=root/'src/data/sections.ts'
              s=sec.read_text(encoding='utf-8').replace("title: 'من بين يدي السلسلة الفراتية'","title: 'بين يدي السلسلة الفراتية'")
              sec.write_text(s,encoding='utf-8')
              constants=root/'src/app/constants.ts'
              c=constants.read_text(encoding='utf-8').replace("VERSION_NAME = '1.0.0'","VERSION_NAME = '1.0.2'").replace('VERSION_CODE = 1','VERSION_CODE = 3')
              constants.write_text(c,encoding='utf-8')
              outdir=Path('/tmp/v103-bundles')/a['slug']; outdir.mkdir(parents=True,exist_ok=True)
              assets=Path('/tmp/v103-assets')/a['slug']; assets.mkdir(parents=True,exist_ok=True)
              js=outdir/'index.android.js'
              subprocess.run(['npx','react-native','bundle','--platform','android','--dev','false','--entry-file','index.js','--bundle-output',str(js),'--assets-dest',str(assets),'--reset-cache'],cwd=root,check=True)
              hbc=outdir/'index.android.bundle'
              subprocess.run([str(hermesc),'-O','-emit-binary','-out',str(hbc),str(js)],cwd=root,check=True)
              assert hbc.stat().st_size>100000,(a['slug'],hbc.stat().st_size)
              magic=hbc.read_bytes()[:8].hex()
              assert magic=='c61fbc03c103191f',(a['slug'],magic)
              js.unlink()
          print('ALL_12_HERMES_BUNDLES_OK=1')
          PY
          test "$(find /tmp/v103-bundles -name index.android.bundle | wc -l)" -eq 12

      - name: Build, sign, and verify the 12 final APKs from user PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-apks /tmp/sources /tmp/sections /tmp/apkwork
          keytool -genkeypair -v -keystore /tmp/quran-fixed.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Quran Karem Series,O=QuranKarem,C=EG' >/dev/null 2>&1

          cat > /tmp/apps.tsv <<'EOF'
          01	abuamr	com.qurani.series.abuamr	638	1BVoetPB5RCq5cSV1zxaxb0nj98B0faup	01-AbuAmr-v1.0.2-fixed.apk
          02	ibnamir	com.qurani.series.ibnamir	633	1zxcrxi4Q2J0jaKZS1hFPQEF3GhNIDlTZ	02-IbnAmir-v1.0.2-fixed.apk
          03	ibnkathir	com.qurani.series.ibnkathir	632	1hFgLvZYo_tqrpTn82kzzRy30kr3agtg5	03-IbnKathir-v1.0.2-fixed.apk
          04	khalafhamza	com.qurani.series.khalafhamza	636	14dV4ewJ75I-feQSTz0oNsMvUSz2vnlPG	04-Khalaf-Hamza-Sakt-v1.0.2-fixed.apk
          05	alkisai	com.qurani.series.alkisai	633	1a2PHF7eHXmKtn8bgd_SHbSKSyc4vp1b3	05-AlKisai-v1.0.2-fixed.apk
          06	khalladhamza	com.qurani.series.khalladhamza	636	1iLjNkH1nB-eovs6xXJmsh0Zd_dBagpWS	06-Khallad-Hamza-NoSakt-v1.0.2-fixed.apk
          07	abujaafar	com.qurani.series.abujaafar	634	1ka0xEX2tK95HTJos_eU0W_yjtzYVFeKM	07-AbuJaafar-v1.0.2-fixed.apk
          08	yaqub	com.qurani.series.yaqub	630	1-HMgAHqQbJz97EQnPUDd7tFmUJ-uHsJu	08-Yaqub-v1.0.2-fixed.apk
          09	khalaf10	com.qurani.series.khalaf10	628	1vHJkNHxGLxLqby6pszUoxhGcOP4-wK6F	09-Khalaf10-v1.0.2-fixed.apk
          10	asim	com.qurani.series.asim	633	1dtHbfD19xNUxc9rPNT2gHuxTTSK8XLBh	10-Asim-v1.0.2-fixed.apk
          11	warshazraq	com.qurani.series.warshazraq	637	1eZsEfvK2WYERoHXRqdIxgfC8K6hqAcgI	11-Warsh-Azraq-v1.0.2-fixed.apk
          12	qalunqasr	com.qurani.series.qalunqasr	632	1qTjYqpjs9S6v0UM2nZMXvUSsmBXxum3b	12-Qalun-Qasr-v1.0.2-fixed.apk
          EOF

          BT="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BT/aapt"
          ZIPALIGN="$BT/zipalign"
          APKSIGNER="$BT/apksigner"
          KEYSTORE=/tmp/quran-fixed.keystore

          while IFS=$'\t' read -r num slug package pages drive_id filename; do
            echo "===== FINAL $num $slug ====="
            src="/tmp/sources/$slug.pdf"
            python3 -m gdown "$drive_id" -O "$src" --quiet
            test -s "$src"

            python3 - "$src" "$pages" "$slug" <<'PY'
          import sys,fitz
          from pathlib import Path
          src_path,expected,slug=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          src=fitz.open(src_path)
          assert src.page_count==expected,(slug,src.page_count,expected)
          outdir=Path('/tmp/sections')/slug
          outdir.mkdir(parents=True,exist_ok=True)
          ranges={'reading.pdf':(1,4),'quran.pdf':(5,608),'quran_index.pdf':(609,610),'dua.pdf':(611,611),'waqf_symbols.pdf':(612,616),'furati_intro.pdf':(617,620),'usul.pdf':(621,expected)}
          expected_start=1
          for name,(start,end) in ranges.items():
              assert start==expected_start,(slug,name,start,expected_start)
              d=fitz.open(); d.insert_pdf(src,from_page=start-1,to_page=end-1)
              d.save(outdir/name,garbage=0,deflate=False)
              assert d.page_count==end-start+1,(slug,name,d.page_count,end-start+1)
              d.close(); expected_start=end+1
          assert expected_start==expected+1,(slug,expected_start,expected)
          src.close()
          PY

            workdir="/tmp/apkwork/$slug"
            rm -rf "$workdir" && mkdir -p "$workdir/stage/assets/pdf" "$workdir/stage/assets"
            cp /tmp/payload/base.apk "$workdir/unsigned.apk"
            (zip -q -d "$workdir/unsigned.apk" 'META-INF/*' 'AndroidManifest.xml' 'resources.arsc' 'assets/index.android.bundle' 'assets/pdf/*' || true)
            cp "/tmp/payload/overlays/$slug/files/AndroidManifest.xml" "$workdir/stage/AndroidManifest.xml"
            cp "/tmp/payload/overlays/$slug/files/resources.arsc" "$workdir/stage/resources.arsc"
            cp "/tmp/v103-bundles/$slug/index.android.bundle" "$workdir/stage/assets/index.android.bundle"
            cp "/tmp/sections/$slug/"*.pdf "$workdir/stage/assets/pdf/"
            (cd "$workdir/stage" && zip -q -0 "$workdir/unsigned.apk" AndroidManifest.xml resources.arsc assets/index.android.bundle assets/pdf/*.pdf)

            "$ZIPALIGN" -f -P 16 4 "$workdir/unsigned.apk" "$workdir/aligned.apk"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "final-apks/$filename" "$workdir/aligned.apk"

            unzip -t "final-apks/$filename" >/dev/null
            "$ZIPALIGN" -c -P 16 4 "final-apks/$filename"
            "$APKSIGNER" verify --verbose --min-sdk-version 21 "final-apks/$filename" | tee "$workdir/signing.txt"
            grep -q 'Verified using v1 scheme (JAR signing): true' "$workdir/signing.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$workdir/signing.txt"
            "$AAPT" dump badging "final-apks/$filename" | tee "$workdir/badging.txt"
            grep -q "package: name='$package' versionCode='3' versionName='1.0.2'" "$workdir/badging.txt"
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/quran.pdf'
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/quran_index.pdf'
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/usul.pdf'

            python3 - "final-apks/$filename" "$pages" <<'PY'
          import sys,zipfile,fitz,tempfile,os
          apk=sys.argv[1]; expected=int(sys.argv[2])
          ranges={'assets/pdf/reading.pdf':4,'assets/pdf/quran.pdf':604,'assets/pdf/quran_index.pdf':2,'assets/pdf/dua.pdf':1,'assets/pdf/waqf_symbols.pdf':5,'assets/pdf/furati_intro.pdf':4,'assets/pdf/usul.pdf':expected-620}
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert set(ranges).issubset(names)
              bundle=z.read('assets/index.android.bundle')
              assert bundle[:8].hex()=='c61fbc03c103191f'
              for name,count in ranges.items():
                  data=z.read(name)
                  fd,path=tempfile.mkstemp(suffix='.pdf'); os.close(fd)
                  try:
                      open(path,'wb').write(data)
                      d=fitz.open(path); assert d.page_count==count,(name,d.page_count,count); d.close()
                  finally: os.unlink(path)
          PY
            rm -f "$src"
            rm -rf "/tmp/sections/$slug"
          done < /tmp/apps.tsv

          test "$(find final-apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 12
          sha256sum final-apks/*.apk | sort | tee final-apks/SHA256SUMS.txt

      - name: Publish fixed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" final-apks/*.apk final-apks/SHA256SUMS.txt \
            --title 'Quran Series – Fixed Zoom, Exact Index, Full Verse Search' \
            --notes '12 final APKs using only the user-provided PDF sources. Quran and all section pages support pinch zoom. Index is full-screen without the 609–610 notice and uses exact clickable rows for all 114 surahs. Verse search uses the complete 6236-ayah offline index and returns all matching ayahs. Section cards use one uniform icon style.'
