name: AbuAmr Uguu Text Transfer Bridge

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-uguu-text-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: abuamr-transfer-v100
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'AbuAmr-skeleton-v1.0.0.apk' \
            --pattern 'android-apk-tools-36.zip'
          echo '4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181  AbuAmr-skeleton-v1.0.0.apk' | sha256sum -c -
          echo '009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550  android-apk-tools-36.zip' | sha256sum -c -
      - name: Upload base64 text files to Uguu
        shell: bash
        run: |
          set -euo pipefail
          base64 -w 76 AbuAmr-skeleton-v1.0.0.apk > /tmp/abuamr-apk.b64.txt
          base64 -w 76 android-apk-tools-36.zip > /tmp/android-tools.b64.txt
          curl -fsS --retry 4 --retry-delay 2 -F 'files[]=@/tmp/abuamr-apk.b64.txt;type=text/plain' https://uguu.se/upload > /tmp/apk.json
          curl -fsS --retry 4 --retry-delay 2 -F 'files[]=@/tmp/android-tools.b64.txt;type=text/plain' https://uguu.se/upload > /tmp/tools.json
          APK_URL="$(jq -r '.files[0].url' /tmp/apk.json)"
          TOOLS_URL="$(jq -r '.files[0].url' /tmp/tools.json)"
          test -n "$APK_URL" && test "$APK_URL" != null
          test -n "$TOOLS_URL" && test "$TOOLS_URL" != null
          {
            echo "APK_B64_URL=$APK_URL"
            echo "TOOLS_B64_URL=$TOOLS_URL"
            echo 'APK_SHA256=4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181'
            echo 'TOOLS_SHA256=009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550'
            echo "APK_B64_BYTES=$(stat -c%s /tmp/abuamr-apk.b64.txt)"
            echo "TOOLS_B64_BYTES=$(stat -c%s /tmp/android-tools.b64.txt)"
          } | tee qurani-abuamr/uguu-text-bridge.txt
      - name: Persist transfer URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-abuamr/uguu-text-bridge.txt
          git commit -m 'ci: record Abu Amr Uguu text transfer URLs'
          git pull --rebase origin qurani-abuamr-v100
          git push origin HEAD:qurani-abuamr-v100
