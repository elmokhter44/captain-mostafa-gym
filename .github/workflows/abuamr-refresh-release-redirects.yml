name: AbuAmr Refresh Release Redirects

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-refresh-release-redirects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve fresh signed release asset redirects
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            local id="$1"
            curl -fsSI \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location: /{sub(/^location: /,""); print; exit}'
          }
          APK_URL="$(resolve 574949170)"
          TOOLS_URL="$(resolve 574949167)"
          test -n "$APK_URL"
          test -n "$TOOLS_URL"
          {
            echo "APK_URL=$APK_URL"
            echo "TOOLS_URL=$TOOLS_URL"
            echo 'APK_SHA256=4c979705e9c25607122f5a9e476d9cfe51ccb346da8ae9b8004379e8462c2181'
            echo 'TOOLS_SHA256=009421949da0e28cc7682a4e84f1f497bcbd36ad6b1743c5e50dfaaf389d0550'
          } > qurani-abuamr/fresh-signed-redirects.txt
      - name: Persist fresh redirects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-abuamr/fresh-signed-redirects.txt
          git commit -m 'ci: refresh Abu Amr signed release redirects' || true
          git pull --rebase origin qurani-abuamr-v100
          git push origin HEAD:qurani-abuamr-v100
# refresh-20260920-ibnamir-finalization
