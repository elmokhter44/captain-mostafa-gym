name: Qurani Native Single APK
on:
  push:
    branches: [qurani-native-single-apk-v1]
    paths: ['qurani-native/**','.github/workflows/qurani-native-single-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Retrieve all twelve original standalone APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-apks
          gh release download quran-series-v1.0.4-exact-ayah-search --pattern '*.apk' --dir /tmp/original-apks
          test "$(find /tmp/original-apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 12
      - name: Embed original PDFs without recompression or conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          app=Path('qurani-native/app/src/main/assets')
          pdf_root=Path('/tmp/qurani-native-pdfs')
          maps=[
          ('01-AbuAmr-v1.0.4.apk','abuamr','المصحف المعلم بقراءة الإمام أبي عمرو البصري براوييه السوسي والدوري'),
          ('02-IbnAmir-v1.0.4.apk','ibnamir','المصحف المعلم بقراءة الإمام ابن عامر الشامي'),
          ('03-IbnKathir-v1.0.4.apk','ibnkathir','المصحف المعلم بقراءة الإمام عبدالله بن كثير'),
          ('04-Khalaf-Hamza-Sakt-v1.0.4.apk','khalafhamza','المصحف المعلم برواية خلف عن حمزة'),
          ('05-AlKisai-v1.0.4.apk','alkisai','المصحف المعلم بقراءة الإمام الكسائي'),
          ('06-Khallad-Hamza-NoSakt-v1.0.4.apk','khalladhamza','المصحف المعلم برواية خلاد عن حمزة'),
          ('07-AbuJaafar-v1.0.4.apk','abujaafar','المصحف المعلم بقراءة الإمام أبي جعفر'),
          ('08-Yaqub-v1.0.4.apk','yaqub','المصحف المعلم بقراءة الإمام يعقوب'),
          ('09-Khalaf10-v1.0.4.apk','khalaf10','المصحف المعلم بقراءة الإمام خلف العاشر'),
          ('10-Asim-v1.0.4.apk','asim','المصحف المعلم بقراءة الإمام عاصم'),
          ('11-Warsh-Azraq-v1.0.4.apk','warshazraq','مصحف ورش عن نافع من طريق الأزرق'),
          ('12-Qalun-Qasr-v1.0.4.apk','qalunqasr','مصحف قالون عن نافع')]
          app.mkdir(parents=True,exist_ok=True)
          with (app/'catalog.tsv').open('w',encoding='utf-8') as out:
              for filename,slug,title in maps:
                  original=Path('/tmp/original-apks')/filename
                  assert original.is_file(),original
                  out.write(slug+'\t'+title+'\n')
                  with zipfile.ZipFile(original) as z:
                      pdfs=[n for n in z.namelist() if n.startswith('assets/pdf/') and n.lower().endswith('.pdf')]
                      assert 'assets/pdf/reading.pdf' in pdfs,(slug,pdfs)
                      for name in pdfs:
                          dest=pdf_root/slug/Path(name).relative_to('assets/pdf')
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(z.read(name))
                          assert dest.read_bytes()[:5]==b'%PDF-',dest
                      print('SOURCE_PDFS_OK',slug,len(pdfs))
          assert len(list(pdf_root.glob('*/reading.pdf')))==12
          for directory in sorted(pdf_root.iterdir()):
              assert len(list(directory.glob('*.pdf'))) >= 2, ('MISSING_SECTIONS',directory)
              print('SECTIONS_READY',directory.name,len(list(directory.glob('*.pdf'))))
          PY
      - name: Build one native application APK
        run: |
          set -euo pipefail
          # Avoid AGP compressDebugAssets loading the twelve huge PDFs into JVM heap.
          # Build the code/ordinary assets first; stream original PDF bytes into the APK
          # as ZIP_STORED, then align and sign the completed single APK.
          GRADLE_OPTS='-Xmx3g' gradle -p qurani-native :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' --max-workers=2
          mkdir -p deliverable
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          apk=Path('qurani-native/app/build/outputs/apk/debug/app-debug.apk')
          pdf_root=Path('/tmp/qurani-native-pdfs')
          files=sorted(pdf_root.rglob('*.pdf'))
          assert len(files)>=24, len(files)
          with ZipFile(apk,'a',allowZip64=True) as z:
              for pdf in files:
                  dest='assets/pdf/'+pdf.relative_to(pdf_root).as_posix()
                  with pdf.open('rb') as src, z.open(dest,'w',force_zip64=True) as out:
                      while True:
                          block=src.read(1024*1024)
                          if not block: break
                          out.write(block)
                  assert z.getinfo(dest).compress_type==ZIP_STORED
              print('EMBEDDED_NATIVE_PDFS',len(files))
          PY
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 qurani-native/app/build/outputs/apk/debug/app-debug.apk deliverable/qurani-series-single.apk
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Qurani Unified,O=QuranKarem,C=EG"
          fi
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android deliverable/qurani-series-single.apk
          "$BUILD_TOOLS/apksigner" verify deliverable/qurani-series-single.apk
          unzip -tq deliverable/qurani-series-single.apk
          unzip -l deliverable/qurani-series-single.apk | grep 'assets/pdf/abuamr/reading.pdf'
          sha256sum deliverable/qurani-series-single.apk > deliverable/SHA256SUMS.txt
      - name: Verify native PDF reader with emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r deliverable/qurani-series-single.apk
            adb shell am start -n com.qurani.nativeunified/.MainActivity
            sleep 4
            adb shell uiautomator dump /sdcard/hierarchy.xml
            adb pull /sdcard/hierarchy.xml /tmp/hierarchy.xml
            grep -q 'mushaf-card-abuamr' /tmp/hierarchy.xml
            for slug in abuamr ibnamir ibnkathir khalafhamza alkisai khalladhamza abujaafar yaqub khalaf10 asim warshazraq qalunqasr; do
              adb shell am force-stop com.qurani.nativeunified
              adb logcat -c
              adb shell am start -n com.qurani.nativeunified/.MainActivity --es verify_slug "$slug"
              sleep 9
              adb logcat -d -s QURANI:I AndroidRuntime:E > "/tmp/$slug.log"
              cat "/tmp/$slug.log"
              grep -F "PDF_RENDER_OK=pdf/$slug/reading.pdf page=0" "/tmp/$slug.log"
              echo "NATIVE_READING_$slug=PASS"
            done
            echo "ALL_12_NATIVE_READING_PDFS=PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qurani-native-single-apk
          path: deliverable/
          retention-days: 30
