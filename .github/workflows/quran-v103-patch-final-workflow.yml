name: Patch Quran Fixed Final Workflow

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v103-patch-final-workflow.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compact-index verification and rerun final workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/quran-series-v103-final-fixed.yml')
          s=p.read_text(encoding='utf-8')
          replacements={
            "'all_section_icons_uniform': \"const SECTION_GLYPH='◆'\" in reader,": "'all_section_icons_uniform': 'const GLYPHS:Record<string,string>' in reader and reader.count(\"'◈'\") >= 6,",
            "'verse_index_complete': verse_index.count('surahNumber:')==6236,": "'verse_index_complete': verse_index.count('\\\"surahNumber\\\":')==6236,",
            "assert v.count('surahNumber:')==6236": "assert v.count('\\\"surahNumber\\\":')==6236",
            "assert v.count('ayahNumber:')==6236": "assert v.count('\\\"ayahNumber\\\":')==6236",
            "re.findall(r'mushafPage:\\\\s*(\\\\d+)',v)": "re.findall(r'\\\"mushafPage\\\":(\\\\d+)',v)",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing pattern: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/quran-series-v103-final-fixed.yml
          git commit -m 'fix: verify compact Quran verse index correctly'
          git pull --rebase origin qurani-series-v100
          git push origin HEAD:qurani-series-v100
