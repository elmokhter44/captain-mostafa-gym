name: Quran v1.0.2 Final Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/quran-v102-release-main.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qurani-series-v100
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          python3 -m pip install --quiet 'gdown==5.2.0' 'PyMuPDF==1.26.4'
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Build and verify all 12 APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed '/^TAG=quran-series-v1.0.2-final12/,$d' qurani-v102-release-v2.sh > /tmp/build-only.sh
          bash /tmp/build-only.sh
      - name: Publish all 12 APKs with unique release names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=quran-series-v1.0.2-final12-all
          : > final-apks/ARABIC-FILENAMES.txt
          while IFS=$'\t' read -r num slug package pages drive_id filename; do
            asset="${num}-${slug}-v1.0.2.apk"
            printf '%s\t%s\n' "$asset" "$filename" >> final-apks/ARABIC-FILENAMES.txt
            mv "final-apks/$filename" "final-apks/$asset"
          done < /tmp/apps.tsv
          test "$(find final-apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 12
          rm -rf /tmp/sources /tmp/sections /tmp/apkwork /tmp/payload
          gh release create "$TAG" --target main --title 'Quran Series v1.0.2 – Final 12 APKs' --notes 'Final 12 verified APKs from the user-provided PDFs only. Zoom works in the Quran and all sections/explanations. Paging is right-to-left with Al-Fatiha first. Verse-text search is enabled. Arabic titles and wording were corrected.'
          gh release upload "$TAG" final-apks/*.apk final-apks/SHA256SUMS.txt final-apks/ARABIC-FILENAMES.txt
