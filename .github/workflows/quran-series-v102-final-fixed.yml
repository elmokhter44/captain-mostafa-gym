name: Quran Series v1.0.2 Final 12 APKs Fixed

on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-series-v102-final-fixed.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: quran-series-v1.0.2-final12

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.0.2 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/payload
          cat .series-generated-v102/parts/payload.part-* > /tmp/v102.tar.gz
          echo '2bf541633ad480dd28862abfd01a6fb982f4351bfa6973237d82efd1d461b362  /tmp/v102.tar.gz' | sha256sum -c -
          tar -tzf /tmp/v102.tar.gz >/dev/null
          tar -xzf /tmp/v102.tar.gz -C /tmp/payload
          test -s /tmp/payload/base.apk
          test -d /tmp/payload/overlays
          test "$(find /tmp/payload/overlays -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 12
          keytool -genkeypair -v -keystore /tmp/quran-v102.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Quran Karem Series,O=QuranKarem,C=EG' >/dev/null 2>&1

      - name: Install PDF and Android tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'gdown==5.2.0' 'PyMuPDF==1.26.4'
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'

      - name: Build, sign, and verify 12 APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-apks /tmp/sources /tmp/sections /tmp/apkwork
          cat > /tmp/apps.txt <<'EOF'
          01|abuamr|com.qurani.series.abuamr|638|1BVoetPB5RCq5cSV1zxaxb0nj98B0faup|01-AbuAmr-v1.0.2.apk
          02|ibnamir|com.qurani.series.ibnamir|633|1zxcrxi4Q2J0jaKZS1hFPQEF3GhNIDlTZ|02-IbnAmir-v1.0.2.apk
          03|ibnkathir|com.qurani.series.ibnkathir|632|1hFgLvZYo_tqrpTn82kzzRy30kr3agtg5|03-IbnKathir-v1.0.2.apk
          04|khalafhamza|com.qurani.series.khalafhamza|636|14dV4ewJ75I-feQSTz0oNsMvUSz2vnlPG|04-Khalaf-Hamza-Sakt-v1.0.2.apk
          05|alkisai|com.qurani.series.alkisai|633|1a2PHF7eHXmKtn8bgd_SHbSKSyc4vp1b3|05-AlKisai-v1.0.2.apk
          06|khalladhamza|com.qurani.series.khalladhamza|636|1iLjNkH1nB-eovs6xXJmsh0Zd_dBagpWS|06-Khallad-Hamza-NoSakt-v1.0.2.apk
          07|abujaafar|com.qurani.series.abujaafar|634|1ka0xEX2tK95HTJos_eU0W_yjtzYVFeKM|07-AbuJaafar-v1.0.2.apk
          08|yaqub|com.qurani.series.yaqub|630|1-HMgAHqQbJz97EQnPUDd7tFmUJ-uHsJu|08-Yaqub-v1.0.2.apk
          09|khalaf10|com.qurani.series.khalaf10|628|1vHJkNHxGLxLqby6pszUoxhGcOP4-wK6F|09-Khalaf10-v1.0.2.apk
          10|asim|com.qurani.series.asim|633|1dtHbfD19xNUxc9rPNT2gHuxTTSK8XLBh|10-Asim-v1.0.2.apk
          11|warshazraq|com.qurani.series.warshazraq|637|1eZsEfvK2WYERoHXRqdIxgfC8K6hqAcgI|11-Warsh-Azraq-v1.0.2.apk
          12|qalunqasr|com.qurani.series.qalunqasr|632|1qTjYqpjs9S6v0UM2nZMXvUSsmBXxum3b|12-Qalun-Qasr-v1.0.2.apk
          EOF

          count=0
          while IFS='|' read -r num slug package pages drive_id filename; do
            test -n "$num" && test -n "$slug" && test -n "$package" && test -n "$pages" && test -n "$drive_id" && test -n "$filename"
            [[ "$num" =~ ^[0-9]{2}$ ]]
            [[ "$pages" =~ ^[0-9]+$ ]]
            [[ "$package" == com.qurani.series.* ]]
            [[ "$filename" == *.apk ]]
            count=$((count+1))
          done < /tmp/apps.txt
          test "$count" -eq 12
          echo "APP_TABLE_PARSE_OK=$count"

          BT="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BT/aapt"
          ZIPALIGN="$BT/zipalign"
          APKSIGNER="$BT/apksigner"
          KEYSTORE=/tmp/quran-v102.keystore

          while IFS='|' read -r num slug package pages drive_id filename; do
            echo "===== $num $slug ====="
            src="/tmp/sources/$slug.pdf"
            python3 -m gdown "$drive_id" -O "$src" --quiet
            test -s "$src"

            python3 - "$src" "$pages" "$slug" <<'PY'
          import sys, fitz
          from pathlib import Path
          src_path, expected, slug=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          src=fitz.open(src_path)
          assert src.page_count==expected,(slug,src.page_count,expected)
          outdir=Path('/tmp/sections')/slug
          outdir.mkdir(parents=True,exist_ok=True)
          ranges={'reading.pdf':(1,4),'quran.pdf':(5,608),'quran_index.pdf':(609,610),'dua.pdf':(611,611),'waqf_symbols.pdf':(612,616),'furati_intro.pdf':(617,620),'usul.pdf':(621,expected)}
          for name,(start,end) in ranges.items():
              d=fitz.open(); d.insert_pdf(src,from_page=start-1,to_page=end-1)
              d.save(outdir/name,garbage=0,deflate=False)
              assert d.page_count==end-start+1,(slug,name,d.page_count)
              d.close()
          src.close()
          PY

            workdir="/tmp/apkwork/$slug"
            rm -rf "$workdir" && mkdir -p "$workdir/stage/assets/pdf" "$workdir/stage/assets"
            cp /tmp/payload/base.apk "$workdir/unsigned.apk"
            (zip -q -d "$workdir/unsigned.apk" 'META-INF/*' 'AndroidManifest.xml' 'resources.arsc' 'assets/index.android.bundle' 'assets/pdf/*' || true)
            cp "/tmp/payload/overlays/$slug/files/AndroidManifest.xml" "$workdir/stage/AndroidManifest.xml"
            cp "/tmp/payload/overlays/$slug/files/resources.arsc" "$workdir/stage/resources.arsc"
            cp "/tmp/payload/overlays/$slug/files/assets/index.android.bundle" "$workdir/stage/assets/index.android.bundle"
            cp "/tmp/sections/$slug/"*.pdf "$workdir/stage/assets/pdf/"
            (cd "$workdir/stage" && zip -q -0 "$workdir/unsigned.apk" AndroidManifest.xml resources.arsc assets/index.android.bundle assets/pdf/*.pdf)

            "$ZIPALIGN" -f -P 16 4 "$workdir/unsigned.apk" "$workdir/aligned.apk"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "final-apks/$filename" "$workdir/aligned.apk"

            unzip -t "final-apks/$filename" >/dev/null
            "$ZIPALIGN" -c -P 16 4 "final-apks/$filename"
            "$APKSIGNER" verify --verbose --min-sdk-version 21 "final-apks/$filename" | tee "$workdir/signing.txt"
            grep -q 'Verified using v1 scheme (JAR signing): true' "$workdir/signing.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$workdir/signing.txt"
            "$AAPT" dump badging "final-apks/$filename" | tee "$workdir/badging.txt"
            grep -q "package: name='$package' versionCode='3' versionName='1.0.2'" "$workdir/badging.txt"
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/quran.pdf'
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/quran_index.pdf'
            unzip -l "final-apks/$filename" | grep -q 'assets/pdf/usul.pdf'
            echo "APK_VERIFIED=$filename|$package|v1=true|v2=true"
          done < /tmp/apps.txt

          test "$(find final-apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 12
          sha256sum final-apks/*.apk | tee final-apks/SHA256SUMS.txt

      - name: Upload final APK bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Series-v1.0.2-Final-12-APKs
          path: final-apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish final release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" final-apks/*.apk final-apks/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Quran Series v1.0.2 – Final APKs' --notes 'Final 12 APKs from the user-provided PDFs only. Offline PDF assets embedded directly. RTL horizontal paging, zoom, offline PDF-derived text search, corrected Arabic labels and section icons. All APKs passed unzip, 16K zipalign, APK signature v1/v2 verification, package ID, versionCode 3 and versionName 1.0.2 checks.'
