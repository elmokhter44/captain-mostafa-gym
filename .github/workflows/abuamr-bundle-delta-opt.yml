name: AbuAmr Optimize Bundle Delta

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-bundle-delta-opt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_SHA: 071f82e8a816fb83b0802e763cad3e78479a73a4820b03a42137b1a199a4acea
    steps:
      - uses: actions/checkout@v4
      - name: Get matching old and new Hermes bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nafi2 /tmp/nafi3 /tmp/abu /tmp/o /tmp/n /tmp/d && mkdir -p /tmp/nafi2 /tmp/nafi3 /tmp/abu /tmp/o /tmp/n /tmp/d
          gh release download qurani-v1.0.2-nafi-final --repo "$GITHUB_REPOSITORY" -p 'default.apk' -D /tmp/nafi2
          gh release download qurani-v1.0.3-nafi-final --repo "$GITHUB_REPOSITORY" -p 'al-mushaf-al-muallam-nafi-v1.0.3.apk' -D /tmp/nafi3
          gh release download abuamr-transfer-v100 --repo "$GITHUB_REPOSITORY" -p 'AbuAmr-skeleton-v1.0.0.apk' -D /tmp/abu
          unzip -p /tmp/nafi2/default.apk assets/index.android.bundle > /tmp/nafi2/bundle
          unzip -p /tmp/nafi3/al-mushaf-al-muallam-nafi-v1.0.3.apk assets/index.android.bundle > /tmp/nafi3/bundle
          unzip -p /tmp/abu/AbuAmr-skeleton-v1.0.0.apk assets/index.android.bundle > /tmp/n/bundle
          echo 'candidate hashes:'
          sha256sum /tmp/nafi2/bundle /tmp/nafi3/bundle /tmp/n/bundle
          stat -c '%n %s' /tmp/nafi2/bundle /tmp/nafi3/bundle /tmp/n/bundle
          for f in /tmp/nafi2/bundle /tmp/nafi3/bundle; do
            if [ "$(sha256sum "$f" | awk '{print $1}')" = "$OLD_SHA" ]; then cp "$f" /tmp/o/bundle; break; fi
          done
          test -s /tmp/o/bundle
          test "$(sha256sum /tmp/n/bundle | awk '{print $1}')" = '14f3eb06d25894e001da298511cd194a8a9aa4c1c8b39995f343a8c429ccc0a9'
      - name: Try zstd patch and xdelta
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
          zstd --patch-from=/tmp/o/bundle /tmp/n/bundle -19 -f -o /tmp/d/bundle.zstpatch
          zstd -d --patch-from=/tmp/o/bundle /tmp/d/bundle.zstpatch -c > /tmp/d/check.bundle
          cmp /tmp/d/check.bundle /tmp/n/bundle
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3 || true
          if command -v xdelta3 >/dev/null; then xdelta3 -e -9 -s /tmp/o/bundle /tmp/n/bundle /tmp/d/bundle.xdelta; xdelta3 -d -s /tmp/o/bundle /tmp/d/bundle.xdelta /tmp/d/check2.bundle; cmp /tmp/d/check2.bundle /tmp/n/bundle; fi
          mkdir -p qurani-abuamr/optimized-delta
          base64 -w76 /tmp/d/bundle.zstpatch > qurani-abuamr/optimized-delta/bundle.zstpatch.b64
          sha256sum /tmp/d/bundle.zstpatch > qurani-abuamr/optimized-delta/bundle.zstpatch.sha256
          if [ -s /tmp/d/bundle.xdelta ]; then base64 -w76 /tmp/d/bundle.xdelta > qurani-abuamr/optimized-delta/bundle.xdelta.b64; sha256sum /tmp/d/bundle.xdelta > qurani-abuamr/optimized-delta/bundle.xdelta.sha256; fi
          stat -c '%n %s' /tmp/d/bundle.zstpatch /tmp/d/bundle.xdelta 2>/dev/null | tee qurani-abuamr/optimized-delta/sizes.txt
      - name: Commit optimized delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add qurani-abuamr/optimized-delta/
          git commit -m 'ci: persist optimized Abu Amr Hermes bundle delta'
          git pull --rebase origin qurani-abuamr-v100
          git push origin HEAD:qurani-abuamr-v100
