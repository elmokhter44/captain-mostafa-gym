name: Qurani Emulator Verification

on:
  push:
    branches: [qurani-build-temp]
    paths:
      - '.github/workflows/qurani-emulator-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-apk-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Disk before cleanup ==='
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" || true
          sudo rm -rf "$ANDROID_HOME/system-images" || true
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper" "$HOME/.npm/_cacache" || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          echo '=== Disk after cleanup ==='
          df -h /

      - name: Download already-built signed Qurani APK artifact
        uses: actions/download-artifact@v4
        with:
          name: qurani-production-v2-5
          path: artifact
          github-token: ${{ github.token }}
          repository: elmokhter44/captain-mostafa-gym
          run-id: 35052502128

      - name: Locate and verify exact APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find artifact -type f -name 'app-release.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" /tmp/Qurani-v1.0.0.apk
          echo 'fa447045e4306c0e7351e143c211204d3a51abf742e0fe26723ad1a489a161db  /tmp/Qurani-v1.0.0.apk' | sha256sum -c -
          ls -lh /tmp/Qurani-v1.0.0.apk
          df -h /

      - name: Install, launch, relaunch and inspect on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          script: |
            set -eu
            mkdir -p evidence
            echo '=== Emulator/device ===' | tee evidence/emulator.txt
            adb devices -l | tee -a evidence/emulator.txt
            adb shell getprop ro.build.version.release | tee -a evidence/emulator.txt
            adb shell getprop ro.build.version.sdk | tee -a evidence/emulator.txt

            echo '=== Install APK ==='
            adb install -r /tmp/Qurani-v1.0.0.apk | tee evidence/adb-install.txt
            adb shell pm path com.qurani.app | tee evidence/package-path.txt
            adb shell dumpsys package com.qurani.app | grep -E 'versionCode=|versionName=' | head -n 5 | tee evidence/package-version.txt

            echo '=== First launch ==='
            adb logcat -c
            adb shell am force-stop com.qurani.app
            adb shell monkey -p com.qurani.app -c android.intent.category.LAUNCHER 1 | tee evidence/launch.txt
            sleep 12
            PID="$(adb shell pidof com.qurani.app | tr -d '\r')"
            test -n "$PID"
            echo "PID=$PID" | tee evidence/process.txt

            adb shell uiautomator dump /sdcard/qurani-home.xml >/dev/null 2>&1 || true
            adb pull /sdcard/qurani-home.xml evidence/qurani-home.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > evidence/qurani-home.png
            adb logcat -d > evidence/android-logcat-first-launch.txt
            if grep -A12 -B3 'FATAL EXCEPTION' evidence/android-logcat-first-launch.txt | grep -q 'com.qurani.app'; then
              echo 'Qurani fatal exception detected on first launch' >&2
              exit 1
            fi

            echo '=== Relaunch persistence smoke ==='
            adb shell am force-stop com.qurani.app
            sleep 2
            adb shell monkey -p com.qurani.app -c android.intent.category.LAUNCHER 1 | tee evidence/relaunch.txt
            sleep 8
            PID2="$(adb shell pidof com.qurani.app | tr -d '\r')"
            test -n "$PID2"
            echo "PID_AFTER_RELAUNCH=$PID2" | tee -a evidence/process.txt
            adb exec-out screencap -p > evidence/qurani-relaunch.png
            adb logcat -d > evidence/android-logcat-final.txt
            if grep -A12 -B3 'FATAL EXCEPTION' evidence/android-logcat-final.txt | grep -q 'com.qurani.app'; then
              echo 'Qurani fatal exception detected after relaunch' >&2
              exit 1
            fi

            echo 'APK_INSTALL=PASS' | tee evidence/result.txt
            echo 'FIRST_LAUNCH=PASS' | tee -a evidence/result.txt
            echo 'RELAUNCH=PASS' | tee -a evidence/result.txt
            echo 'NO_QURANI_FATAL_EXCEPTION=PASS' | tee -a evidence/result.txt

      - name: Upload emulator verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qurani-emulator-verification-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: evidence/
