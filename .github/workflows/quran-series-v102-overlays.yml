name: Quran Series v1.0.2 Overlays
on:
  workflow_dispatch:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-series-v102-overlays.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Reconstruct source and previous base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-app series-output-v102 /tmp/payload
          mkdir -p qurani-app /tmp/payload
          cat qurani-ci/text/part-* > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C qurani-app
          cat qurani-v101/overlay/part-* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.gz
          echo 'cbb6b45021274412968d6f6747fa54048d1d46be31e92a6cea31b5d80a2b9d7e  /tmp/overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/overlay.tar.gz -C qurani-app
          cat .series-generated-v101/parts/payload.part-* > /tmp/v101.tar.gz
          echo 'ee3030765c148ffefb921972bce03b0655475765e9dda7bb8b3a5555b10749e8  /tmp/v101.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v101.tar.gz -C /tmp/payload
          cp qurani-v101/generate-verse-index.py qurani-app/scripts/generate-verse-index.py
          chmod +x qurani-app/scripts/generate-verse-index.py
          python3 - <<'PY'
          from pathlib import Path
          import base64
          b64=''.join(p.read_text() for p in sorted(Path('qurani-ci/logo').glob('part-*')))
          Path('/tmp/qurani-logo.jpg').write_bytes(base64.b64decode(b64,validate=True))
          PY
          echo '4c8d65a11c77539831be3a791e54b9eb984375cea878262fd1972ed3acf58cae  /tmp/qurani-logo.jpg' | sha256sum -c -
      - name: Install build dependencies and restore launcher resources
        shell: bash
        run: |
          set -euo pipefail
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/apply.py
          base64 -d qurani-series/build_all_overlays.py.gz.b64 | gzip -dc > /tmp/build.py
          cd qurani-app && npm install --no-audit --no-fund && cd ..
          python3 -m pip install --quiet 'PyMuPDF==1.26.4' pillow
          mkdir -p qurani-app/assets/branding
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('/tmp/qurani-logo.jpg').convert('RGBA')
          src.save('qurani-app/assets/branding/qurani-icon.png',optimize=True)
          base=Path('qurani-app/android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=base/folder
              d.mkdir(parents=True,exist_ok=True)
              icon=src.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
          PY
          test -s qurani-app/assets/branding/qurani-icon.png
          test -s qurani-app/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s qurani-app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;27.1.12297006' 'cmake;3.22.1'
          keytool -genkeypair -v -keystore qurani-app/android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Series Build,O=QuranKarem,C=EG' >/dev/null 2>&1 || true
          cd qurani-app/android && gradle wrapper --gradle-version 9.3.1 && chmod +x gradlew && cd ../..
      - name: RED - prove current v1.0.1 behavior misses requested contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v102_contract.py <<'PY'
          from pathlib import Path
          import json,sys
          root=Path(sys.argv[1])
          reader=(root/'src/features/reader/ReaderScreen.tsx').read_text(encoding='utf-8')
          index=(root/'src/features/index/IndexScreen.tsx').read_text(encoding='utf-8')
          search=(root/'src/features/search/SearchScreen.tsx').read_text(encoding='utf-8')
          card=(root/'src/features/home/SectionCard.tsx').read_text(encoding='utf-8')
          apps=json.loads(Path('qurani-series/apps.json').read_text(encoding='utf-8'))
          text='\n'.join(x['title']+'\n'+x['reading']+'\n'+x['usul'] for x in apps)
          checks={
            'reader_rtl': 'horizontal inverted pagingEnabled' in reader,
            'reader_zoom': 'ZoomablePdfPage' in reader,
            'index_rtl': 'horizontal inverted pagingEnabled' in index,
            'index_zoom': 'ZoomablePdfPage' in index,
            'verse_search': 'searchVerses' in search and 'VERSE_INDEX' in search,
            'dua_icon': "dua: '🤲'" in card or "dua:'🤲'" in reader,
            'intro_icon': "'furati-intro': '📖'" in card or "'furati-intro':'📖'" in reader,
            'spelling': all(bad not in text for bad in ['راوية','أبي عمر البصري','براويه','ماخالفة','الكسائى','مطلقآ','أصولقراءة']),
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              print('CONTRACT_FAIL='+','.join(failed))
              raise SystemExit(1)
          print('CONTRACT_OK=1')
          PY
          set +e
          python3 /tmp/v102_contract.py qurani-app
          rc=$?
          set -e
          test "$rc" -ne 0
          echo 'RED_CONFIRMED=1'
      - name: Apply v1.0.2 fixes
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app && python3 /tmp/apply.py . && cd ..
          cp qurani-v102-fixed/ReaderScreen.tsx qurani-app/src/features/reader/ReaderScreen.tsx
          cp qurani-v102-fixed/ZoomablePdfPage.tsx qurani-app/src/features/reader/ZoomablePdfPage.tsx
          cp qurani-v101-fixed/PdfPage.tsx qurani-app/src/features/reader/PdfPage.tsx
          cp qurani-v102-fixed/IndexScreen.tsx qurani-app/src/features/index/IndexScreen.tsx
          cp qurani-v102-fixed/SectionCard.tsx qurani-app/src/features/home/SectionCard.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qurani-app/src/features/search/SearchScreen.tsx')
          s=p.read_text(encoding='utf-8').replace("navigation.navigate('Reader',", "navigation.push('Reader',")
          p.write_text(s,encoding='utf-8')
          p=Path('/tmp/build.py'); s=p.read_text(encoding='utf-8')
          replacements=[
            ("'versionCode 1'","'versionCode 3'"),
            ("'versionName \"1.0.0\"'","'versionName \"1.0.2\"'"),
            ("VERSION_NAME = '1.0.0'","VERSION_NAME = '1.0.2'"),
            ("VERSION_CODE = 1","VERSION_CODE = 3"),
            ("versionCode='1' versionName='1.0.0'","versionCode='3' versionName='1.0.2'"),
            ("'versionCode':1,'versionName':'1.0.0'","'versionCode':3,'versionName':'1.0.2'"),
            ("title: 'من بين يدي السلسلة الفراتية'","title: 'بين يدي السلسلة الفراتية'"),
          ]
          for a,b in replacements: s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          assert "versionCode='3' versionName='1.0.2'" in s
          assert "title: 'بين يدي السلسلة الفراتية'" in s
          assert "title: 'من بين يدي السلسلة الفراتية'" not in s
          PY
      - name: GREEN - verify requested behavior, wording, search, icons, and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v102_contract.py qurani-app
          cd qurani-app
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path('src/features/reader/ReaderScreen.tsx').read_text(encoding='utf-8')
          z=Path('src/features/reader/ZoomablePdfPage.tsx').read_text(encoding='utf-8')
          i=Path('src/features/index/IndexScreen.tsx').read_text(encoding='utf-8')
          s=Path('src/features/search/SearchScreen.tsx').read_text(encoding='utf-8')
          c=Path('src/features/home/SectionCard.tsx').read_text(encoding='utf-8')
          assert 'horizontal inverted pagingEnabled' in r
          assert 'ZoomablePdfPage' in r and 'scrollEnabled={!pageZoomed}' in r
          assert 'onStartShouldSetPanResponderCapture' in z and 'onMoveShouldSetPanResponderCapture' in z
          assert 'sourcePages=useMemo(()=>[609,610]' in i
          assert 'hotspotPages=useMemo(()=>[621,622]' in i
          assert 'horizontal inverted pagingEnabled' in i and 'ZoomablePdfPage' in i
          assert "navigation.push('Reader',toSurahTarget(surah))" in i
          assert 'searchVerses' in s and 'VERSE_INDEX' in s and "navigation.push('Reader'" in s
          assert "dua: '🤲'" in c and "'furati-intro': '📖'" in c
          apps=json.loads(Path('../qurani-series/apps.json').read_text(encoding='utf-8'))
          text='\n'.join(x['title']+'\n'+x['reading']+'\n'+x['usul'] for x in apps)
          for bad in ['راوية','أبي عمر البصري','براويه','ماخالفة','الكسائى','مطلقآ','أصولقراءة']:
              assert bad not in text,bad
          assert apps[0]['title']=='المصحف المعلم بقراءة الإمام أبي عمرو البصري براوييه السوسي والدوري'
          print('V102_SOURCE_CONTRACT_OK=1')
          PY
          cat > tsconfig.series.json <<'EOF'
          {"extends":"./tsconfig.json","exclude":["node_modules","android","__tests__","**/*.node.test.ts"]}
          EOF
          npx tsc --noEmit -p tsconfig.series.json
          echo 'TYPESCRIPT_OK=1'
          cd ..
      - name: Build and persist 12 v1.0.2 overlays
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-app/android/app/src/main/assets/pdf .series-generated-v102 series-output-v102
          mkdir -p qurani-app/android/app/src/main/assets/pdf
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          out=Path('qurani-app/android/app/src/main/assets/pdf')
          for name,count in {'reading.pdf':4,'quran.pdf':604,'quran_index.pdf':2,'dua.pdf':1,'waqf_symbols.pdf':5,'furati_intro.pdf':4,'usul.pdf':18}.items():
              d=fitz.open()
              for _ in range(count): d.new_page(width=512.402,height=652.68)
              d.save(out/name); d.close()
          PY
          cd qurani-app && python3 /tmp/build.py . /tmp/payload/base.apk ../qurani-series/apps.json ../series-output-v102 && cd ..
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('series-output-v102/build-report.json'))
          assert len(r)==12
          for x in r:
              assert x['badgingOk'] and x['nativeLibsIdenticalToBase'] and x['overlayReconstructsSkeleton']
              assert x['versionCode']==3 and x['versionName']=='1.0.2'
          sections=Path('qurani-app/src/data/sections.ts').read_text(encoding='utf-8')
          assert "title: 'بين يدي السلسلة الفراتية'" in sections
          assert "title: 'من بين يدي السلسلة الفراتية'" not in sections
          assert 'sourceStartPage: 609, sourceEndPage: 610' in sections
          PY
          mkdir -p .series-generated-v102/parts
          cp /tmp/payload/base.apk series-output-v102/base.apk
          tar -C series-output-v102 -czf /tmp/v102.tar.gz base.apk overlays build-report.json
          sha256sum /tmp/v102.tar.gz | tee .series-generated-v102/SHA256SUMS.txt
          split -b 45M -d -a 2 /tmp/v102.tar.gz .series-generated-v102/parts/payload.part-
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .series-generated-v102
          git commit -m 'ci: persist Quran series v1.0.2 overlay payload'
          git pull --rebase origin qurani-series-v100
          git push origin HEAD:qurani-series-v100
