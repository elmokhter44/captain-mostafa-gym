name: AbuAmr Android Skeleton Build

on:
  push:
    branches: [qurani-abuamr-v100]
    paths:
      - '.github/workflows/abuamr-skeleton-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALM_DISABLE_ANALYTICS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Restore verified master-template source
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35100431525 --repo "$GITHUB_REPOSITORY" -n QURANI-FINAL-v1.0.1-R2-1 -D /tmp/master
          test -s /tmp/master/final-delivery/Qurani-source-v1.0.1.zip
          mkdir -p qurani-app
          unzip -q /tmp/master/final-delivery/Qurani-source-v1.0.1.zip -d qurani-app
          test -f qurani-app/package.json
          test -f qurani-app/android/app/build.gradle

      - name: Reproduce Ibn Kathir v1.0.0 master-template code and UI
        shell: bash
        run: |
          set -euo pipefail
          base64 -d qurani-ibnkathir/ibnkathir-code.patch.gz.b64 | gzip -dc > /tmp/ibnkathir.patch
          cd qurani-app
          patch --batch -p1 < /tmp/ibnkathir.patch
          patch --batch -p1 < ../qurani-ibnkathir/approved-additions-code.patch
          grep -q 'applicationId "com.qurani.ibnkathir"' android/app/build.gradle
          grep -q "ibn-kathir-reading" src/data/sections.ts

      - name: Red test - Abu Amr approved identity and section contract must fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          cat > __tests__/abuamrConfig.node.test.ts <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {SECTIONS} from '../src/data/sections.ts';
          import {mushafToSourcePage, sourceToMushafPage} from '../src/utils/pageMapping.ts';

          const exactTitle = 'المصحف المعلم بقراءة الإمام أبي عمر البصري براوييه السوسي والدوري';
          const expected = [
            ['quran','المصحف','',5,608,'quran.pdf',true],
            ['abu-amr-reading','قراءة أبي عمر البصري برواية السوسي والدوري','',1,5,'abu_amr_reading.pdf',undefined],
            ['index','الفهرس','',609,610,'quran_index.pdf',undefined],
            ['dua','الدعاء','',611,611,'dua.pdf',undefined],
            ['waqf-symbols','علامات الوقف ومصطلحات الضبط ودلالات الرمز والترميز اللوني للقراءات العشر في مصاحف السلسلة الفراتية','',612,616,'waqf_symbols.pdf',undefined],
            ['furati-intro','من بين يدي السلسلة الفراتية','',617,620,'furati_intro.pdf',undefined],
            ['abu-amr-usul','شرح أصول قراءة الامام أبي عمر البصري برواية السوسي والدوري','',621,638,'abu_amr_usul.pdf',undefined],
          ] as const;

          test('Abu Amr app uses exactly the approved seven cards, order, ranges and no subtitles', () => {
            assert.deepEqual(SECTIONS.map(s => [s.id,s.title,s.subtitle,s.sourceStartPage,s.sourceEndPage,s.assetName,s.featured]), expected);
          });
          test('main mushaf mapping remains exactly PDF 5-608 / printed 1-604', () => {
            assert.equal(mushafToSourcePage(1),5);
            assert.equal(mushafToSourcePage(604),608);
            assert.equal(sourceToMushafPage(5),1);
            assert.equal(sourceToMushafPage(608),604);
            assert.throws(() => sourceToMushafPage(609));
          });
          test('identity, title and version are independent and exact', () => {
            const gradle=readFileSync('android/app/build.gradle','utf8');
            const constants=readFileSync('src/app/constants.ts','utf8');
            const home=readFileSync('src/features/home/HomeScreen.tsx','utf8');
            assert.match(gradle,/namespace "com\.qurani\.abuamr"/);
            assert.match(gradle,/applicationId "com\.qurani\.abuamr"/);
            assert.match(gradle,/versionCode 1/);
            assert.match(gradle,/versionName "1\.0\.0"/);
            assert.match(constants,/com\.qurani\.abuamr/);
            assert.ok(home.includes(exactTitle));
          });
          EOF
          set +e
          node --experimental-strip-types --test __tests__/abuamrConfig.node.test.ts > /tmp/abuamr-red.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/abuamr-red.txt
          test "$STATUS" -ne 0
          grep -Eq '# fail [1-9][0-9]*' /tmp/abuamr-red.txt
          echo 'ABUAMR_RED_PHASE_CONFIRMED=1'

      - name: Apply only approved Abu Amr content and independent Android identity
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          exact_title='المصحف المعلم بقراءة الإمام أبي عمر البصري براوييه السوسي والدوري'
          sections=Path('src/data/sections.ts')
          s=sections.read_text()
          s=s.replace("'ibn-kathir-reading'", "'abu-amr-reading'")
          s=s.replace("'ibn-kathir-usul'", "'abu-amr-usul'")
          s=s.replace("قراءة عبدالله بن كثير برواية البزي وقنبل", "قراءة أبي عمر البصري برواية السوسي والدوري")
          s=s.replace("sourceStartPage: 1, sourceEndPage: 4, assetName: 'ibn_kathir_reading.pdf'", "sourceStartPage: 1, sourceEndPage: 5, assetName: 'abu_amr_reading.pdf'")
          s=s.replace("شرح أصول قراءة الامام بن كثير المكي برواية البزي وقنبل", "شرح أصول قراءة الامام أبي عمر البصري برواية السوسي والدوري")
          s=s.replace("sourceStartPage: 621, sourceEndPage: 632, assetName: 'ibn_kathir_usul.pdf'", "sourceStartPage: 621, sourceEndPage: 638, assetName: 'abu_amr_usul.pdf'")
          sections.write_text(s)

          home=Path('src/features/home/HomeScreen.tsx')
          h=home.read_text()
          h=re.sub(r'<Text style=\{styles\.tagline\}>.*?</Text>', f'<Text style={{styles.tagline}}>{exact_title}</Text>', h, count=1)
          h=re.sub(r'<Text style=\{styles\.subtag\}>.*?</Text>', '<Text style={styles.subtag}>السوسي والدوري • يعمل بالكامل دون إنترنت</Text>', h, count=1)
          home.write_text(h)

          gradle=Path('android/app/build.gradle')
          g=gradle.read_text().replace('com.qurani.ibnkathir','com.qurani.abuamr')
          g=re.sub(r'versionCode\s+\d+', 'versionCode 1', g)
          g=re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.0"', g)
          gradle.write_text(g)

          const=Path('src/app/constants.ts')
          c=const.read_text().replace('com.qurani.ibnkathir','com.qurani.abuamr')
          c=re.sub(r"VERSION_NAME\s*=\s*'[^']+'", "VERSION_NAME = '1.0.0'", c)
          c=re.sub(r'VERSION_CODE\s*=\s*\d+', 'VERSION_CODE = 1', c)
          const.write_text(c)

          for p in Path('android/app/src/main/java').rglob('*.kt'):
              t=p.read_text().replace('com.qurani.ibnkathir','com.qurani.abuamr')
              p.write_text(t)
          old=Path('android/app/src/main/java/com/qurani/ibnkathir')
          new=Path('android/app/src/main/java/com/qurani/abuamr')
          if old.exists():
              new.parent.mkdir(parents=True,exist_ok=True)
              if new.exists(): shutil.rmtree(new)
              shutil.move(str(old),str(new))

          appjson=Path('app.json')
          import json
          aj=json.loads(appjson.read_text())
          aj['displayName']=exact_title
          appjson.write_text(json.dumps(aj,ensure_ascii=False,indent=2)+'\n')

          strings=Path('android/app/src/main/res/values/strings.xml')
          x=strings.read_text()
          x=re.sub(r'(<string name="app_name">).*?(</string>)', r'\1'+exact_title+r'\2', x, count=1, flags=re.S)
          strings.write_text(x)
          PY
          grep -q 'applicationId "com.qurani.abuamr"' android/app/build.gradle
          grep -q 'المصحف المعلم بقراءة الإمام أبي عمر البصري براوييه السوسي والدوري' src/features/home/HomeScreen.tsx
          grep -q 'sourceEndPage: 638' src/data/sections.ts

      - name: Create build-only PDF placeholders with the exact approved counts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyMuPDF==1.26.4'
          rm -rf qurani-app/android/app/src/main/assets/pdf
          mkdir -p qurani-app/android/app/src/main/assets/pdf
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          out=Path('qurani-app/android/app/src/main/assets/pdf')
          specs={
            'quran.pdf':604,
            'abu_amr_reading.pdf':5,
            'quran_index.pdf':2,
            'dua.pdf':1,
            'waqf_symbols.pdf':5,
            'furati_intro.pdf':4,
            'abu_amr_usul.pdf':18,
          }
          for name,count in specs.items():
              d=fitz.open()
              for _ in range(count): d.new_page(width=612,height=612)
              d.save(out/name,garbage=4,deflate=True)
              d.close()
              chk=fitz.open(out/name); assert chk.page_count==count,(name,chk.page_count,count); chk.close()
          print('ABUAMR_PLACEHOLDER_COUNTS_OK=1')
          PY

      - name: Green test - exact Abu Amr approved contract
        shell: bash
        working-directory: qurani-app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --experimental-strip-types --test __tests__/abuamrConfig.node.test.ts | tee /tmp/abuamr-green.txt
          grep -q '# fail 0' /tmp/abuamr-green.txt
          echo 'ABUAMR_GREEN_PHASE_CONFIRMED=1'

      - name: Install Android SDK 36, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' \
            'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Build release skeleton with independent package
        shell: bash
        run: |
          set -euo pipefail
          cd qurani-app
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Temporary Skeleton,O=QuranKarem,C=EG' >/dev/null 2>&1
          cd android
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          rm -rf app/.cxx .cxx
          ./gradlew assembleRelease --stacktrace
          cd ..
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/abuamr-badging.txt
          grep -q "package: name='com.qurani.abuamr' versionCode='1' versionName='1.0.0'" /tmp/abuamr-badging.txt
          unzip -l "$APK" > /tmp/abuamr-contents.txt
          for f in quran.pdf abu_amr_reading.pdf quran_index.pdf dua.pdf waqf_symbols.pdf furati_intro.pdf abu_amr_usul.pdf; do grep -q "assets/pdf/$f" /tmp/abuamr-contents.txt; done
          cp "$APK" AbuAmr-skeleton-v1.0.0.apk

      - name: Package local finalization and verification tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          rm -rf /tmp/android-apk-tools
          mkdir -p /tmp/android-apk-tools/lib
          cp "$BT/apksigner" /tmp/android-apk-tools/
          cp "$BT/zipalign" /tmp/android-apk-tools/
          cp "$BT/aapt" /tmp/android-apk-tools/
          cp "$BT/aapt2" /tmp/android-apk-tools/
          cp "$BT/lib/apksigner.jar" /tmp/android-apk-tools/lib/
          chmod +x /tmp/android-apk-tools/apksigner /tmp/android-apk-tools/zipalign /tmp/android-apk-tools/aapt /tmp/android-apk-tools/aapt2
          cd /tmp
          zip -qr android-apk-tools-36.zip android-apk-tools
          sha256sum android-apk-tools-36.zip

      - name: Upload isolated Abu Amr skeleton and tools
        uses: actions/upload-artifact@v4
        with:
          name: ABUAMR-SKELETON-v1.0.0
          retention-days: 14
          compression-level: 0
          path: |
            qurani-app/AbuAmr-skeleton-v1.0.0.apk
            /tmp/android-apk-tools-36.zip
            /tmp/abuamr-red.txt
            /tmp/abuamr-green.txt
            /tmp/abuamr-badging.txt
