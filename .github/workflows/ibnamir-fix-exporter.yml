name: IbnAmir Fix Skeleton Exporter
on:
  push:
    branches: [qurani-ibnamir-v100]
    paths: ['.github/workflows/ibnamir-fix-exporter.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index export to discover array export names safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ibnamir-native-skeleton-export.yml')
          s=p.read_text()
          a="const {SURAHS}=await import('./src/data/surahs.ts');"
          b="const {VERSE_INDEX}=await import('./src/data/verses.generated.ts');"
          assert a in s and b in s, 'import lines not found'
          s=s.replace(a,"const sm=await import('./src/data/surahs.ts');\n          const SURAHS=Object.values(sm).find(v=>Array.isArray(v)&&v.length===114);")
          s=s.replace(b,"const vm=await import('./src/data/verses.generated.ts');\n          const VERSE_INDEX=Object.values(vm).find(v=>Array.isArray(v)&&v.length===6236);")
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/ibnamir-native-skeleton-export.yml
          git commit -m 'fix: discover offline index export names'
          git pull --rebase origin qurani-ibnamir-v100
          git push origin HEAD:qurani-ibnamir-v100
