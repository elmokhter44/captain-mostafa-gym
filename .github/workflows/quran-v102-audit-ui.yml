name: Audit Quran v1.0.2 Splash and Dark UI
on:
  push:
    branches: [qurani-series-v100]
    paths: ['.github/workflows/quran-v102-audit-ui.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source through v1.0.2 UI overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qurani-app /tmp/payload
          mkdir -p qurani-app /tmp/payload
          cat qurani-ci/text/part-* > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          echo '8419ab562a4783684b34e1bc62a96be4dc3da00f8a85e5e0d298182ab1e79192  /tmp/src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/src.tar.gz -C qurani-app
          cat qurani-v101/overlay/part-* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.gz
          echo 'cbb6b45021274412968d6f6747fa54048d1d46be31e92a6cea31b5d80a2b9d7e  /tmp/overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/overlay.tar.gz -C qurani-app
          base64 -d qurani-series/apply_series_common.py.gz.b64 | gzip -dc > /tmp/apply.py
          (cd qurani-app && python3 /tmp/apply.py .)
          cp qurani-v102-fixed/ReaderScreen.tsx qurani-app/src/features/reader/ReaderScreen.tsx
          cp qurani-v102-fixed/ZoomablePdfPage.tsx qurani-app/src/features/reader/ZoomablePdfPage.tsx
          cp qurani-v101-fixed/PdfPage.tsx qurani-app/src/features/reader/PdfPage.tsx
          cp qurani-v102-fixed/IndexScreen.tsx qurani-app/src/features/index/IndexScreen.tsx
          cp qurani-v102-fixed/SectionCard.tsx qurani-app/src/features/home/SectionCard.tsx
      - name: RED - requested splash and dark-only contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('qurani-app/src/app/App.tsx').read_text(encoding='utf-8')
          reader=Path('qurani-app/src/features/reader/ReaderScreen.tsx').read_text(encoding='utf-8')
          failed=[]
          if 'resizeMode="contain"' not in app: failed.append('splash_logo_contain')
          if 'const dark=true;' not in reader: failed.append('dark_default')
          if "key:'theme'" in reader or 'toggleTheme' in reader: failed.append('theme_toggle_removed')
          if failed:
              print('V102_UI_CONTRACT_FAIL='+','.join(failed))
              raise SystemExit(1)
          print('V102_UI_CONTRACT_OK=1')
          PY
