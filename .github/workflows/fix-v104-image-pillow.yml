name: Fix Qurani v1.0.4 Image Verification Dependency

on:
  push:
    branches: [qurani-build-temp]
    paths:
      - '.github/workflows/fix-v104-image-pillow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qurani-build-temp
          fetch-depth: 0
      - name: Install Pillow dependency step in v1.0.4 workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/qurani-v104-image-page-final.yml')
          s = p.read_text()
          old = "          cd qurani-app\n          python3 - <<'PY'\n          from pathlib import Path\n          from PIL import Image\n"
          new = "          cd qurani-app\n          python3 -m pip install --quiet Pillow\n          python3 - <<'PY'\n          from pathlib import Path\n          from PIL import Image\n"
          if old not in s:
              raise SystemExit('target regression block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/qurani-v104-image-page-final.yml
          git commit -m 'ci(qurani): install Pillow for v1.0.4 visual verification'
          git push origin HEAD:qurani-build-temp
