<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلسلة قرآني — Web Preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#061c18,#0b2f28 55%,#071713);color:#f5f1e6;min-height:100vh}button{font:inherit}.shell{max-width:1120px;margin:auto;padding:24px}.brand{text-align:center;padding:18px 0 24px}.brand h1{margin:8px 0 4px;font-size:30px}.brand p{margin:0;color:#c9d8d2}.notice{background:#102f29;border:1px solid #31574e;border-radius:16px;padding:12px 16px;margin-bottom:20px;color:#dbe8e2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:linear-gradient(160deg,#123d34,#0c2924);border:1px solid #356257;border-radius:18px;padding:18px;cursor:pointer;text-align:right;transition:.2s;min-height:145px;color:#fff;width:100%}.card:hover{transform:translateY(-3px);border-color:#d6b66a}.num{color:#d6b66a;font-size:13px;font-weight:bold}.card h2{font-size:18px;line-height:1.65;margin:10px 0}.card span{color:#b9cbc5;font-size:13px}.reader{display:none}.reader.active{display:block}.home.hidden{display:none}.topbar{display:flex;align-items:center;gap:10px;background:#0b2722;border:1px solid #31574e;border-radius:16px;padding:10px;position:sticky;top:10px;z-index:5}.back{background:#173e35;color:#fff;border:1px solid #426a60;border-radius:10px;padding:9px 14px;cursor:pointer}.title{font-weight:bold;flex:1}.status{font-size:12px;color:#b9cbc5}.viewer{margin-top:14px;background:#1b1b1b;border-radius:14px;overflow:hidden;min-height:78vh}.viewer iframe{width:100%;height:78vh;border:0;background:#fff}.loading{text-align:center;padding:80px 20px;color:#d6b66a}.error{padding:40px 20px;text-align:center;color:#ffb8b8}.small{font-size:12px;color:#9fb4ad;margin-top:12px}@media(max-width:600px){.shell{padding:12px}.brand h1{font-size:25px}.grid{grid-template-columns:1fr}.viewer iframe{height:74vh}}</style></head><body><div id="app"></div><script>
const RELEASE='quran-series-v1.0.4-exact-ayah-search',owner='elmokhter44',repo='captain-mostafa-gym';
const items=[['01','أبو عمرو البصري','01-AbuAmr-v1.0.4.apk'],['02','ابن عامر الشامي','02-IbnAmir-v1.0.4.apk'],['03','ابن كثير المكي','03-IbnKathir-v1.0.4.apk'],['04','خلف عن حمزة — وجه السكت','04-Khalaf-Hamza-Sakt-v1.0.4.apk'],['05','الكسائي','05-AlKisai-v1.0.4.apk'],['06','خلاد عن حمزة — ترك السكت','06-Khallad-Hamza-NoSakt-v1.0.4.apk'],['07','أبو جعفر المدني','07-AbuJaafar-v1.0.4.apk'],['08','يعقوب الحضرمي','08-Yaqub-v1.0.4.apk'],['09','خلف العاشر','09-Khalaf10-v1.0.4.apk'],['10','عاصم الكوفي','10-Asim-v1.0.4.apk'],['11','ورش عن نافع — طريق الأزرق','11-Warsh-Azraq-v1.0.4.apk'],['12','قالون عن نافع — قصر المنفصل','12-Qalun-Qasr-v1.0.4.apk']];
const base='https://github.com/'+owner+'/'+repo+'/releases/download/'+RELEASE+'/';const $=s=>document.querySelector(s);const app=$('#app');
app.innerHTML='<div class="shell"><section id="home"><div class="brand"><h1>سلسلة قرآني</h1><p>نسخة اختبار عبر المتصفح — 12 مصحف</p></div><div class="notice">اختبر الكروت قبل تثبيت الـAPK. كل كارت مرتبط بملف APK الخاص بالمصحف نفسه.</div><div class="grid" id="grid"></div><div class="small">اضغط أي كارت لاختبار ملف المصحف الخاص به.</div></section><section id="reader" class="reader"><div class="topbar"><button class="back" id="back">← الرجوع للمصاحف</button><div class="title" id="readerTitle"></div><div class="status" id="status"></div></div><div class="viewer" id="viewer"></div></section></div>';
items.forEach(([n,name,file])=>{const b=document.createElement('button');b.className='card';b.innerHTML='<div class="num">المصحف '+n+'</div><h2>'+name+'</h2><span>فتح واختبار المصحف الصحيح</span>';b.onclick=()=>openMushaf(n,name,file);$('#grid').appendChild(b)});
function u16(a,o){return a[o]|a[o+1]<<8}function u32(a,o){return(a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}function findSig(a,s){for(let i=a.length-4;i>=0;i--)if(u32(a,i)===s)return i;return-1}
async function range(url,start,end){const r=await fetch(url,{headers:{Range:'bytes='+start+'-'+end}});if(!r.ok)throw Error('HTTP '+r.status);return new Uint8Array(await r.arrayBuffer())}
async function extractReadingPdf(url){const head=await fetch(url,{method:'HEAD'});const size=Number(head.headers.get('content-length'));if(!size)throw Error('تعذر معرفة حجم APK');const tailSize=Math.min(size,131072),tail=await range(url,size-tailSize,size-1),e=findSig(tail,0x06054b50);if(e<0)throw Error('لم يتم العثور على ZIP directory');const cdSize=u32(tail,e+12),cdOffset=u32(tail,e+16),cd=await range(url,cdOffset,cdOffset+cdSize-1);let p=0,entry=null;while(p+46<=cd.length){if(u32(cd,p)!==0x02014b50)break;const method=u16(cd,p+10),comp=u32(cd,p+20),uncomp=u32(cd,p+24),nl=u16(cd,p+28),el=u16(cd,p+30),cl=u16(cd,p+32),off=u32(cd,p+42),name=new TextDecoder().decode(cd.slice(p+46,p+46+nl));if(name==='assets/pdf/reading.pdf'){entry={method,comp,uncomp,off};break}p+=46+nl+el+cl}if(!entry)throw Error('reading.pdf غير موجود داخل APK');const local=await range(url,entry.off,entry.off+30-1),nl=u16(local,26),el=u16(local,28),raw=await range(url,entry.off+30+nl+el,entry.off+30+nl+el+entry.comp-1);let pdf;if(entry.method===0)pdf=raw;else if(entry.method===8){const ds=new DecompressionStream('deflate-raw');pdf=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}else throw Error('ZIP compression method '+entry.method+' غير مدعوم');return new Blob([pdf],{type:'application/pdf'})}
async function openMushaf(n,name,file){$('#home').classList.add('hidden');$('#reader').classList.add('active');$('#readerTitle').textContent='المصحف '+n+' — '+name;$('#status').textContent='جاري الاستخراج…';$('#viewer').innerHTML='<div class="loading">جاري استخراج PDF الخاص بهذا المصحف من APK v1.0.4…</div>';try{const blob=await extractReadingPdf(base+encodeURIComponent(file)),url=URL.createObjectURL(blob);$('#viewer').innerHTML='<iframe title="مصحف '+name+'" src="'+url+'#page=1&zoom=page-width"></iframe>';$('#status').textContent='تم فتح ملف المصحف الصحيح'}catch(e){console.error(e);$('#status').textContent='فشل';$('#viewer').innerHTML='<div class="error">تعذر الاستخراج من المتصفح.<br><br>'+e.message+'<br><br>إذا ظهر هذا الخطأ، سأستخدم استضافة PDF مستقلة للمعاينة.</div>'}}
$('#back').onclick=()=>{$('#reader').classList.remove('active');$('#home').classList.remove('hidden');$('#viewer').innerHTML='';$('#status').textContent=''};
</script></body></html>
