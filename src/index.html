<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كابتن مصطفى الريدي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#19a974;--blue:#2878e3;--ink:#17313b;--muted:#75858d;--bg:#f4f8f7;--card:#fff;--line:#e7eeec;--danger:#e14c4c;--warn:#e89520;--shadow:0 14px 38px rgba(31,61,73,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Alexandria,Tahoma,Arial,sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:24px 16px;background:linear-gradient(175deg,#0d9067,#2878e3);color:#fff}.brand{padding:9px 10px 25px;border-bottom:1px solid #ffffff33}.brand b{display:block;font-size:19px}.brand small{opacity:.8}.nav{display:grid;gap:8px;margin-top:22px}.nav button{border:0;background:transparent;color:#fff;text-align:right;padding:13px 15px;border-radius:15px;font:inherit;cursor:pointer;opacity:.88}.nav button:hover,.nav button.active{background:#ffffff22;opacity:1}.main{padding:28px;min-width:0}.top{display:flex;gap:14px;align-items:center;margin-bottom:24px}.search{flex:1;position:relative}.search input{width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--line);outline:none;background:white;font:inherit;box-shadow:0 5px 20px #19363c0a}.btn{border:0;border-radius:15px;padding:13px 18px;font:600 14px Alexandria;cursor:pointer}.primary{background:linear-gradient(135deg,var(--green),var(--blue));color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:14px}.stat{background:var(--card);padding:18px;border-radius:20px;box-shadow:var(--shadow);border:1px solid #edf2f1}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}.stat strong{font-size:25px}.section{margin-top:22px;background:var(--card);border-radius:22px;border:1px solid #edf2f1;box-shadow:var(--shadow);overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.section-head h2{font-size:17px;margin:0}.filters{display:flex;gap:9px;flex-wrap:wrap}.filters select{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff;font:inherit}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:14px 18px;text-align:right;border-bottom:1px solid #eff3f2;font-size:13px}th{color:var(--muted);font-weight:500;background:#fafcfc}.name{font-weight:700}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px}.active-b{background:#e9f8f1;color:#0a8b5c}.expiring-b{background:#fff4df;color:#b76c05}.expired-b{background:#ffebeb;color:#c43939}.row-actions{display:flex;gap:6px}.mini{border:0;background:#eef5f5;border-radius:9px;padding:7px 9px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px}.view{display:none}.view.active{display:block}.panel{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:22px;max-width:920px;margin:auto}.panel h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{font:inherit} .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;background:#fcfefe}.field input:focus,.field select:focus,.field textarea:focus{border-color:#52a8cb}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#f4faf8;padding:14px;border-radius:16px;margin:16px 0}.summary div small{display:block;color:var(--muted);font-size:10px}.summary div b{font-size:14px}.modal-back{display:none;position:fixed;inset:0;background:#102c3377;z-index:20;padding:30px;overflow:auto}.modal-back.show{display:flex;align-items:flex-start;justify-content:center}.modal{background:#fff;width:min(860px,100%);margin:auto;border-radius:24px;box-shadow:0 30px 70px #09242c44;overflow:hidden}.modal-head{display:flex;justify-content:space-between;padding:19px 22px;border-bottom:1px solid var(--line)}.modal-body{padding:22px}.close{border:0;background:#eef3f3;border-radius:10px;width:34px;height:34px;cursor:pointer}.profile-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.profile-name h2{margin:0 0 6px}.profile-name p{margin:0;color:var(--muted)}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.info{padding:14px;border-radius:15px;background:#f6f9f9}.info small{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-top:20px}.tabs button{border:0;background:transparent;padding:10px 12px;font:inherit;cursor:pointer}.tabs button.on{color:var(--blue);border-bottom:2px solid var(--blue)}.list-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.toast{position:fixed;bottom:24px;left:24px;background:#17313b;color:#fff;padding:13px 17px;border-radius:13px;opacity:0;transform:translateY(15px);transition:.25s;z-index:40}.toast.show{opacity:1;transform:none}.setting-row{display:grid;grid-template-columns:1fr 180px;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><b>كابتن مصطفى الريدي</b><small>نظام إدارة الجيم</small></div><nav class="nav">
<button class="active" data-view="dashboard">⌂ الرئيسية</button><button data-view="trainees">◉ المتدربون</button><button data-view="add">＋ إضافة متدرب</button><button data-view="reminders">◷ تنبيهات الانتهاء</button><button data-view="settings">⚙ الإعدادات</button></nav></aside>
<main class="main"><div class="top"><div class="search"><input id="globalSearch" placeholder="ابحث بالاسم أو رقم الموبايل..." autocomplete="off"></div><button class="btn primary" onclick="showView('add')">＋ إضافة متدرب</button></div>
<section id="dashboard" class="view active"><div class="grid"><div class="stat"><span>إجمالي المتدربين</span><strong id="stTotal">0</strong></div><div class="stat"><span>النشطون</span><strong id="stActive">0</strong></div><div class="stat"><span>ينتهي خلال يومين</span><strong id="stExpiring">0</strong></div><div class="stat"><span>المنتهية</span><strong id="stExpired">0</strong></div><div class="stat"><span>إجمالي المتبقي</span><strong id="stRemaining">0</strong></div></div><div class="section"><div class="section-head"><h2>أقرب الاشتراكات للانتهاء</h2><button class="btn ghost" onclick="showView('reminders')">عرض التنبيهات</button></div><div id="dashList"></div></div></section>
<section id="trainees" class="view"><div class="section" style="margin-top:0"><div class="section-head"><h2>المتدربون</h2><div class="filters"><select id="filterStatus"><option value="all">كل الحالات</option><option value="active">نشط</option><option value="expiring">ينتهي قريبًا</option><option value="expired">منتهي</option></select><select id="filterPlan"><option value="all">كل الخطط</option></select><select id="filterArchive"><option value="false">الحاليون</option><option value="true">الأرشيف</option></select></div></div><div id="traineeTable"></div></div></section>
<section id="add" class="view"><div class="panel"><h2>إضافة متدرب جديد</h2><form id="addForm"><div class="form-grid"><div class="field"><label>اسم المتدرب *</label><input name="name" required></div><div class="field"><label>البلد</label><input name="country" value="مصر"></div><div class="field"><label>كود الدولة</label><input name="countryCode" value="+20"></div><div class="field"><label>رقم الموبايل *</label><input name="phone" required></div><div class="field full"><label>الهدف / نوع الاشتراك *</label><select name="planId" id="addPlan" required></select></div><div class="field"><label>عدد الأشهر</label><input type="number" name="months" id="addMonths" min="1" value="1"></div><div class="field"><label>تاريخ بداية الاشتراك</label><input type="date" name="startDate" id="addStart" required></div><div class="field"><label>المبلغ المدفوع</label><input type="number" name="paid" id="addPaid" min="0" value="0"></div><div class="field"><label>طريقة الدفع</label><select name="method"><option>نقدي</option><option>InstaPay</option><option>Vodafone Cash</option><option>تحويل بنكي</option><option>أخرى</option></select></div><div class="field full"><label>ملاحظات</label><textarea name="notes" rows="3"></textarea></div></div><div class="summary"><div><small>سعر الشهر</small><b id="sumMonthly">0 جنيه</b></div><div><small>الإجمالي</small><b id="sumTotal">0 جنيه</b></div><div><small>المدفوع</small><b id="sumPaid">0 جنيه</b></div><div><small>المتبقي</small><b id="sumRemain">0 جنيه</b></div></div><button class="btn primary" type="submit">حفظ المتدرب والاشتراك</button></form></div></section>
<section id="reminders" class="view"><div class="section" style="margin-top:0"><div class="section-head"><h2>تنبيهات واتساب المستحقة</h2><button class="btn ghost" onclick="loadReminders()">تحديث</button></div><div id="reminderList"></div></div></section>
<section id="settings" class="view"><div class="panel"><h2>الإعدادات</h2><div id="planSettings"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><form id="settingsForm"><div class="form-grid"><div class="field"><label>اسم الجيم</label><input name="gymName"></div><div class="field"><label>العملة</label><input name="currency"></div><div class="field"><label>التذكير قبل الانتهاء (يوم)</label><input type="number" name="reminderDays" min="0"></div><div class="field full"><label>قالب رسالة التذكير</label><textarea name="reminderTemplate" rows="4"></textarea></div></div><div style="display:flex;gap:9px;margin-top:16px"><button class="btn primary">حفظ الإعدادات</button><button type="button" class="btn ghost" onclick="backup()">إنشاء نسخة احتياطية</button><button type="button" class="btn ghost" onclick="openDataFolder()">فتح مجلد البيانات</button></div></form></div></section>
</main></div>
<div id="profileBack" class="modal-back" onclick="if(event.target===this)closeProfile()"><div class="modal"><div class="modal-head"><b>ملف المتدرب</b><button class="close" onclick="closeProfile()">×</button></div><div id="profileBody" class="modal-body"></div></div></div><div id="toast" class="toast"></div>
<script>
const api=window.gymAPI;let state={plans:[],settings:{},trainees:[],selected:null};const $=s=>document.querySelector(s);const money=n=>`${Number(n||0).toLocaleString('ar-EG')} ${state.settings.currency||'جنيه'}`;const date=v=>v?new Intl.DateTimeFormat('ar-EG',{dateStyle:'medium'}).format(new Date(v)):'—';
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function unwrap(r){if(!r?.ok)throw new Error(r?.error||'حدث خطأ');return r.data}function statusLabel(s){return s==='active'?['نشط','active-b']:s==='expiring'?['ينتهي قريبًا','expiring-b']:['منتهي','expired-b']}
async function init(){try{const x=unwrap(await api.bootstrap());state={...state,...x};fillPlans();fillSettings();renderStats(x.dashboard);renderTrainees(x.trainees);renderDashboardList(x.trainees);renderReminders(x.reminders);$('#addStart').value=new Date().toISOString().slice(0,10);calcSummary()}catch(e){toast(e.message)}}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='trainees')loadTrainees();if(id==='reminders')loadReminders()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function fillPlans(){const opts=state.plans.map(p=>`<option value="${p.id}">${p.name} — ${money(p.monthlyPrice)}</option>`).join('');$('#addPlan').innerHTML=opts;$('#filterPlan').innerHTML='<option value="all">كل الخطط</option>'+state.plans.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('#planSettings').innerHTML='<h3>أسعار الاشتراكات</h3>'+state.plans.map(p=>`<div class="setting-row"><span>${p.name}</span><input type="number" min="1" value="${p.monthlyPrice}" onchange="savePlanPrice('${p.id}',this.value)"></div>`).join('')}
function fillSettings(){const f=$('#settingsForm');Object.keys(state.settings).forEach(k=>{if(f.elements[k])f.elements[k].value=state.settings[k]})}
function renderStats(d){$('#stTotal').textContent=d.total;$('#stActive').textContent=d.active;$('#stExpiring').textContent=d.expiring;$('#stExpired').textContent=d.expired;$('#stRemaining').textContent=money(d.remaining)}
function renderDashboardList(list){const near=list.filter(t=>t.subscription).sort((a,b)=>a.subscription.daysRemaining-b.subscription.daysRemaining).slice(0,8);$('#dashList').innerHTML=near.length?`<div class="table-wrap"><table><thead><tr><th>المتدرب</th><th>الخطة</th><th>الانتهاء</th><th>الأيام</th><th>الحالة</th></tr></thead><tbody>${near.map(rowHtmlSimple).join('')}</tbody></table></div>`:'<div class="empty">لا توجد اشتراكات مسجلة بعد</div>'}
function rowHtmlSimple(t){const s=t.subscription,l=statusLabel(s.status);return `<tr onclick="openProfile('${t.id}')" style="cursor:pointer"><td class="name">${esc(t.name)}</td><td>${esc(s.planName)}</td><td>${date(s.endDate)}</td><td>${s.daysRemaining>=0?s.daysRemaining:'انتهى'}</td><td><span class="badge ${l[1]}">${l[0]}</span></td></tr>`}
function renderTrainees(list){state.trainees=list;$('#traineeTable').innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الموبايل</th><th>الخطة</th><th>الانتهاء</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(t=>{const s=t.subscription,l=s?statusLabel(s.status):['بدون اشتراك','expired-b'];return `<tr><td class="name">${esc(t.name)}</td><td>${esc(t.normalizedPhone)}</td><td>${esc(s?.planName||'—')}</td><td>${date(s?.endDate)}</td><td>${money(s?.remaining||0)}</td><td><span class="badge ${l[1]}">${l[0]}</span></td><td><button class="mini" onclick="openProfile('${t.id}')">فتح</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد نتائج</div>'}
async function loadTrainees(){try{const filters={search:$('#globalSearch').value,status:$('#filterStatus').value,planId:$('#filterPlan').value,archived:$('#filterArchive').value==='true'};renderTrainees(unwrap(await api.list(filters)))}catch(e){toast(e.message)}}
['filterStatus','filterPlan','filterArchive'].forEach(id=>$('#'+id).onchange=loadTrainees);let timer;$('#globalSearch').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{showView('trainees');loadTrainees()},180)};
function calcSummary(){const p=state.plans.find(x=>x.id===$('#addPlan').value);const months=Math.max(1,+$('#addMonths').value||1),paid=Math.max(0,+$('#addPaid').value||0),total=(p?.monthlyPrice||0)*months;$('#sumMonthly').textContent=money(p?.monthlyPrice||0);$('#sumTotal').textContent=money(total);$('#sumPaid').textContent=money(paid);$('#sumRemain').textContent=money(Math.max(0,total-paid))}['addPlan','addMonths','addPaid'].forEach(id=>$('#'+id).oninput=calcSummary);
$('#addForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.months=+data.months;data.paid=+data.paid;data.whatsappEnabled=true;try{const t=unwrap(await api.add(data));toast('تم إضافة المتدرب بنجاح');e.target.reset();e.target.country.value='مصر';e.target.countryCode.value='+20';e.target.months.value=1;e.target.paid.value=0;$('#addStart').value=new Date().toISOString().slice(0,10);await refresh();openProfile(t.id)}catch(err){toast(err.message)}};
async function refresh(){const x=unwrap(await api.bootstrap());state.plans=x.plans;state.settings=x.settings;renderStats(x.dashboard);renderDashboardList(x.trainees);state.trainees=x.trainees;fillPlans();fillSettings();calcSummary()}
async function openProfile(id){try{const t=unwrap(await api.get(id));state.selected=t;const s=t.subscription,l=s?statusLabel(s.status):['بدون اشتراك','expired-b'];$('#profileBody').innerHTML=`<div class="profile-top"><div class="profile-name"><h2>${esc(t.name)}</h2><p>${esc(t.normalizedPhone)} · ${esc(t.country)}</p></div><span class="badge ${l[1]}">${l[0]}</span></div>${s?`<div class="cards3"><div class="info"><small>الاشتراك الحالي</small><b>${esc(s.planName)}</b></div><div class="info"><small>نهاية الاشتراك</small><b>${date(s.endDate)}</b></div><div class="info"><small>المتبقي</small><b>${money(s.remaining)}</b></div></div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="renewPrompt()">تجديد الاشتراك</button>${s?.remaining>0?`<button class="btn ghost" onclick="paymentPrompt()">تسجيل دفعة</button>`:''}<button class="btn ghost" onclick="sendWhatsApp()">واتساب</button><button class="btn danger" onclick="archiveSelected(${!t.archived})">${t.archived?'استعادة':'أرشفة'}</button>${t.archived?`<button class="btn danger" onclick="deleteSelected()">حذف نهائي</button>`:''}</div><div class="tabs"><button class="on">الاشتراكات (${t.subscriptions.length})</button><button>الدفعات (${t.payments.length})</button></div><h3>سجل الاشتراكات</h3>${t.subscriptions.map(x=>`<div class="list-item"><span>${esc(x.planName)}<br><small>${date(x.startDate)} ← ${date(x.endDate)}</small></span><b>${money(x.totalAmount)}<br><small>متبقي ${money(x.remaining)}</small></b></div>`).join('')||'<p class="empty">لا يوجد</p>'}<h3>سجل الدفعات</h3>${t.payments.map(x=>`<div class="list-item"><span>${date(x.paymentDate)} · ${esc(x.method)}</span><b>${money(x.amount)}</b></div>`).join('')||'<p class="empty">لا يوجد</p>'}`;$('#profileBack').classList.add('show')}catch(e){toast(e.message)}}
function closeProfile(){$('#profileBack').classList.remove('show')}
async function paymentPrompt(){const t=state.selected,s=t.subscription;const a=prompt(`المتبقي ${money(s.remaining)}\nاكتب قيمة الدفعة:`);if(!a)return;try{unwrap(await api.payment(t.id,s.id,+a,'نقدي',''));toast('تم تسجيل الدفعة');await openProfile(t.id);await refresh()}catch(e){toast(e.message)}}
async function renewPrompt(){const t=state.selected;const p=prompt('اكتب رقم الخطة:\n'+state.plans.map((x,i)=>`${i+1}) ${x.name} - ${money(x.monthlyPrice)}`).join('\n'),'1');if(!p)return;const plan=state.plans[+p-1];if(!plan)return toast('اختيار غير صحيح');const months=+(prompt('عدد الأشهر','1')||1);const paid=+(prompt(`المدفوع الآن (الإجمالي ${money(plan.monthlyPrice*months)})`,'0')||0);try{unwrap(await api.renew(t.id,{planId:plan.id,months,startDate:new Date().toISOString().slice(0,10),paid,method:'نقدي'}));toast('تم تجديد الاشتراك');await openProfile(t.id);await refresh()}catch(e){toast(e.message)}}
async function archiveSelected(v){if(!confirm(v?'نقل المتدرب إلى الأرشيف؟':'استعادة المتدرب؟'))return;try{unwrap(await api.archive(state.selected.id,v));closeProfile();toast(v?'تمت الأرشفة':'تمت الاستعادة');await loadTrainees();await refresh()}catch(e){toast(e.message)}}async function deleteSelected(){if(!confirm('حذف نهائي لكل بيانات المتدرب؟ لا يمكن التراجع.'))return;try{unwrap(await api.delete(state.selected.id));closeProfile();toast('تم الحذف النهائي');await loadTrainees();await refresh()}catch(e){toast(e.message)}}
async function sendWhatsApp(){const t=state.selected;const msg=`أهلاً ${t.name}، معك جيم ${state.settings.gymName||'كابتن مصطفى الريدي'}.`;try{unwrap(await api.whatsapp(t.normalizedPhone,msg));toast('تم فتح واتساب')}catch(e){toast(e.message)}}
async function loadReminders(){try{renderReminders(unwrap(await api.reminders()))}catch(e){toast(e.message)}}function renderReminders(rows){$('#reminderList').innerHTML=rows.length?rows.map(r=>`<div class="list-item" style="padding:15px 20px"><div><b>${esc(r.name)}</b><br><small>${esc(r.phone)} · موعد التذكير ${date(r.scheduledDate)}</small></div><button class="btn primary" onclick="sendReminder('${r.id}','${r.traineeId}')">إرسال واتساب</button></div>`).join(''):'<div class="empty">لا توجد رسائل مستحقة الآن</div>';state.reminders=rows}async function sendReminder(id,tid){const r=state.reminders.find(x=>x.id===id);if(!r)return;try{unwrap(await api.whatsapp(r.phone,r.message,r.id));toast('تم فتح واتساب وتسجيل التذكير');loadReminders()}catch(e){toast(e.message)}}
async function savePlanPrice(id,price){try{unwrap(await api.updatePlan(id,+price));state.plans=unwrap(await api.plans());fillPlans();toast('تم تحديث السعر')}catch(e){toast(e.message)}}$('#settingsForm').onsubmit=async e=>{e.preventDefault();try{state.settings=unwrap(await api.saveSettings(Object.fromEntries(new FormData(e.target))));toast('تم حفظ الإعدادات');await refresh()}catch(err){toast(err.message)}};async function backup(){try{const p=unwrap(await api.backup());if(p)toast('تم حفظ النسخة الاحتياطية')}catch(e){toast(e.message)}}async function openDataFolder(){try{unwrap(await api.openDataFolder())}catch(e){toast(e.message)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
init();
</script>
</body></html>
